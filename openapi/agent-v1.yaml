  /chats/{chatId}/messages/{messageId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Messages]
      operationId: cancelMessage
      summary: Cancel a reply
      description: |
        Stops this reply and nothing else, so it is safe even if a newer reply has started.
        A queued reply is dropped before it starts; the rest of the queue keeps its order.
        Pass the reply's id; your own message's id also works and cancels its reply.
        Idempotent: cancelling a reply that has already finished returns it unchanged.
        Platform jobs the reply already submitted are NOT cancelled; use the jobs API for those.

        In campaign mode this interrupts the campaign's current step without pausing the
        campaign (`campaign.status` stays `running`). To pause or stop it, PATCH the chat.

        A reply whose turn already ended on an approval (`requires_action`, nothing left
        running) is different: there is no turn to stop, so cancelling it DENIES its pending
        approvals. The reply then ends `completed`, and the agent answers the denial in a new
        reply of its own (named by `continuedBy`), as after `deny`. Each denial wakes the agent,
        so each counts against the hourly message limit (429), and an organization that cannot
        start work gets 403. If the reply's only approval is already being applied, it is 409
        `approval_not_pending`. Cancelling a reply while its turn is still running stops the
        turn only: a card it raised stays pending until resolved.
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '202':
          description: |
            Cancellation recorded. The reply is returned as it is now; it ends `cancelled`
            within seconds (follow it on the stream, or poll). For a reply stopped at an
            approval, the approvals are denied and it ends `completed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '200':
          description: The reply had already finished; returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                id: msg_1
                object: message
                chatId: chat_7Q
                role: assistant
                createdAt: '2026-10-27T17:02:11Z'
                content:
                  - type: text
                    id: p_0
                    text: I'll fold the target with Boltz-2, 5 samples.
                status: cancelled
                startedBy: user
                inReplyTo: msg_0
                pendingApprovals: []
                pendingQuestions: []
                completedAt: '2026-10-27T17:06:30Z'
                incompleteReason:
                error:
                model: claude-opus-5-5
                usage:
                  agentHours: 0.08
                  jobsHours: 0.4
                  totalHours: 0.48
                  capHours: 40
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/rewind:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    post:
      tags: [Chats]
      operationId: rewindChat
      summary: Rewind the chat to before a message
      description: Hides the given message and everything after it, so you can edit and resend. A reply's id rewinds to the message it answered, which is hidden too. Refused while a reply is in progress or an approval is waiting (409 `reply_in_progress`). A message sent while an earlier reply was still running can be rewound too; if that hides how the earlier reply ended, it ends `incomplete`, reason `rewound`. The chat's event stream says `chat.rewound`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beforeMessageId]
              properties:
                beforeMessageId: { type: string, description: 'The message to rewind to; it and everything after it are hidden. Use it to fix a prompt and resend instead of starting a new chat. Ids from `GET /chats/{chatId}/messages`.' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: The chat after rewinding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: idle
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 40
                  usedHours: 0
                  perJobHours:
                autoApprove: false
                mode: chat
                workflow:
                campaign:
                usage:
                  agentHours: 0
                  jobsHours: 0
                  totalHours: 0
                  capHours: 40
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T17:30:00Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The message is neither one you sent nor a reply to one.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Events ─────────────────────────────
  /chats/{chatId}/events:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Events]
      operationId: listChatEvents
      summary: List or stream all of a chat's events
      description: |
        Chat-wide history across replies. With `stream=true` the connection stays open after a
        reply ends, so you also receive events between replies: jobs finishing and waking the agent, and
        campaign progress (`plan.updated`, `candidates.updated`, `campaign.status`) when the
        chat is in campaign mode. This is the one stream for a campaign. Expect the server to close idle streams about every
        60 minutes; reconnect with your last cursor.

        With `messageId`, only that reply's events (and `chat.rewound`, whose `messageId` is null), and a stream closes after its final event.
        Use it to follow one reply started elsewhere, or to rejoin one after a dropped connection.

        Your account holds at most 10 open streams across the service, whichever of its keys opened them (429 past that). When the stream
        limit cannot be checked, opening one answers 503; an open stream whose slot cannot be
        renewed ends with a retryable `stream_interrupted` error event: reconnect with your last cursor.
      parameters:
        - name: messageId
          in: query
          schema: { type: string, examples: [msg_1] }
          description: 'Only this reply''s events (and `chat.rewound`, since a rewind can remove it), e.g. the id `POST /chats/{chatId}/messages` returned. A stream then closes when the reply ends. Default: every event in the chat.'
        - $ref: '#/components/parameters/Stream'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/LastEventId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: Events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
              example:
                data:
                  - id: '2210.0'
                    type: job.completed
                    sequence: 2210
                    chatId: chat_7Q
                    messageId:
                    campaignId: cmp_4k
                    createdAt: '2026-10-27T18:40:12Z'
                    data:
                      jobName: rfd-pdl1-batch-3
                      tool: rfdiffusion
                      status: Complete
                  - id: '2211.0'
                    type: candidates.updated
                    sequence: 2211
                    chatId: chat_7Q
                    messageId:
                    campaignId: cmp_4k
                    createdAt: '2026-10-27T18:40:15Z'
                    data:
                      count: 18
                      top:
                        - id: cand_07
                          iptm: 0.86
                  - id: '2212.0'
                    type: plan.updated
                    sequence: 2212
                    chatId: chat_7Q
                    messageId:
                    campaignId: cmp_4k
                    createdAt: '2026-10-27T18:40:16Z'
                    data:
                      plan:
                        stage: filter
                nextCursor: '2212.0'
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventStream' }
              example: |
                id: 2210.0
                event: job.completed
                data: {"id":"2210.0","type":"job.completed","sequence":2210,"chatId":"chat_7Q","messageId":null,"campaignId":"cmp_4k","createdAt":"2026-10-27T18:40:12Z","data":{"jobName":"rfd-pdl1-batch-3","tool":"rfdiffusion","status":"Complete"}}

                id: 2211.0
                event: candidates.updated
                data: {"id":"2211.0","type":"candidates.updated","sequence":2211,"chatId":"chat_7Q","messageId":null,"campaignId":"cmp_4k","createdAt":"2026-10-27T18:40:15Z","data":{"count":18,"top":[{"id":"cand_07","iptm":0.86}]}}

                id: 2212.0
                event: plan.updated
                data: {"id":"2212.0","type":"plan.updated","sequence":2212,"chatId":"chat_7Q","messageId":null,"campaignId":"cmp_4k","createdAt":"2026-10-27T18:40:16Z","data":{"plan":{"stage":"filter"}}}

                event: ping
                data: {}
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Approvals ─────────────────────────────
