openapi: 3.1.0
info:
  title: Tamarind Agent API
  version: 1.0.0
  summary: "Drive Tamarind's AI agent from your own code: chats (including campaign mode), streamed replies, approvals and files."
  description: |
    Start chats with Tamarind's AI agent, send it messages, stream its replies, approve or deny the
    actions it asks about, and download the files it produces.

    **Base URL.** `https://app.tamarind.bio/api`, the same host and prefix as the jobs API
    (`/api/jobs`, `/api/molecules`, `/api/pipelines`).

    **Auth.** Send your Tamarind API key as `x-api-key: <your key>`, the same key as the jobs API.
    `Authorization: Bearer <key>` is also accepted. Keys from an agent trial are not accepted, and
    your organization must have AI enabled.

    **Conventions.**
    - JSON is camelCase.
    - Lists take `limit` and an opaque `cursor`, and return `nextCursor` (null on the last page). A
      page can hold fewer items than `limit`, even none, and still have a `nextCursor`: keep
      reading until it is null.
    - Errors are RFC 9457 `application/problem+json`. Branch on `code`, not on `detail`.
    - Creating a chat, sending a message and starting an export accept an `Idempotency-Key`.
      Retrying with the same key and body applies the request once. Keys are kept for at least 24 h.
    - Ignore event types and fields you do not know: new ones are added without notice.

    **Chats and campaigns are one resource.** A campaign is a mode of a chat: the same id,
    history, event stream, approvals and files. Start one with `POST /chats {mode: "campaign"}`
    or switch an existing chat with `PATCH /chats/{chatId} {mode: "campaign"}`. There are no
    campaign paths: pause, resume and the budget are `PATCH /chats/{chatId}` too, a campaign's
    state is the chat's `campaign` field, and its results are chat collections.

    **Teammates' chats.** Members of your organization can read each other's chats, as in the web
    app, unless the organization turns off sharing between members (its admins can still read).
    Add `scope=org` to `GET /chats` to list them. Reading is all a teammate can do: every other
    request on someone else's chat is `404 not_found`. A teammate can read the chat
    (`GET /chats/{chatId}`), its messages and events, its tasks, its candidates with their
    structures, and its jobs. They cannot list its approvals, files, subagents, usage or exports,
    or change anything. Its messages and events show a teammate what the web app shows them, an
    approval request or a subagent's steps included. Credentials in what they read are replaced
    with `[redacted]`.

    **Streaming.** Server-sent events.
    - Each event's SSE `id` is a resume cursor (`<sequence>.<index>`).
    - Reconnect with the `Last-Event-ID` header or `?after=`.
    - `ping` events come every 15 s and carry no id.
    - A reply keeps going when your connection drops.

    **Limits.** Past a limit a request is `429 rate_limited`, with `Retry-After` in seconds.
    - 200 new messages an hour per account, across all its keys. Answering a question and
      deciding an approval count as messages, because each wakes the agent. A message send
      returns `x-ratelimit-limit`, `x-ratelimit-remaining` and `x-ratelimit-reset`.
    - 10 open event streams per account.
    - Per key and hour: 500 file uploads started, 600 file listings, 1,200 reads of a chat's
      results (candidates, tasks, jobs, structures), 300 listings of teammates' chats and 30
      exports started.
    - A message holds up to 100,000 characters and 64 files. A file is up to 200 MB.
  license:
    name: Proprietary
    identifier: LicenseRef-Tamarind-Proprietary
  contact:
    name: Tamarind Bio
    url: https://app.tamarind.bio/api-docs
servers:
  - url: https://app.tamarind.bio/api
    description: Production
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Chats
    description: A chat is a conversation with the agent. It is the same object the Tamarind web app shows in its sidebar.
  - name: Messages
    description: |
      A message is one entry in a chat: yours, or the agent's reply. Each reply has an id you can
      follow: it has a status, streams as it is written, can be cancelled, and keeps going if you
      disconnect. Replies the agent starts on its own (a job finishing, a campaign step) are
      messages too.
  - name: Subagents
    description: |
      A subagent is a helper the agent starts for a sub-task (a hotspot researcher, say). Each has
      its own status, steps and result. A background one can be stopped on its own while the reply
      goes on.
  - name: Events
    description: The ordered record of what happened in a chat, campaign progress included. Read it as history, or follow it live as a server-sent event stream.
  - name: Approvals
    description: Spending, deleting and other outward actions pause the reply in `requires_action` until you approve or deny them. Questions the agent asks wait for your answer here too.
  - name: Files
    description: Upload inputs and download what the agent produced.
  - name: Campaign mode
    description: |
      A chat in campaign mode runs a long, autonomous design workflow with a budget, a plan and
      candidates. It runs in the chat itself, so it has the chat's id, history and event stream.
      Start and control it with `POST` and `PATCH` on `/chats`, and read its state from the chat's
      `campaign` field. This tag lists only the available workflows.
  - name: Usage
    description: What the agent has used, per chat and per month, in weighted hours.

paths:
  # ───────────────────────────── Chats ─────────────────────────────
  /chats:
    post:
      tags: [Chats]
      operationId: createChat
      summary: Create a chat
      description: |
        Creates a chat. Every field is optional: `POST /chats {}` gives a plain chat with the default
        effort and budget. Retrying with the same `Idempotency-Key` returns the same chat, not a
        second one. The key is tied to the whole body: a different body is refused.

        To start a design campaign, set `mode: "campaign"` (and, if you want one, a `workflow` from
        `GET /agent-workflows`), then send your objective as the first message. The agent answers a
        design request with a `campaign_start` approval. Approving it starts the campaign, within the
        chat's budget.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCreate' }
      responses:
        '501':
          description: '`not_supported`: the Agent API is not available for new chats on this Tamarind deployment.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: Chat created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: idle
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 40
                  usedHours: 0
                  perJobHours:
                autoApprove: false
                mode: chat
                workflow:
                campaign:
                usage:
                  agentHours: 0
                  jobsHours: 0
                  totalHours: 0
                  capHours: 40
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T17:02:11Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            - `idempotency_key_reused`: that `Idempotency-Key` was already used with a different body.
            - `not_in_campaign_mode`: you sent `workflow` without `mode: "campaign"`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: |
            - `unknown_workflow`: `workflow` is not one `GET /agent-workflows` lists.
            - `invalid_request`: `autoApprove` cannot turn on because no budget is left. Send `budgetHours`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Chats]
      operationId: listChats
      summary: List chats
      description: |
        Your own chats, most recently updated first. With `scope=org`, the chats of your teammates that
        you may read instead, grouped by owner in order of their email addresses, with each owner's
        newest first. Those are `SharedChat` items. They carry no state, so `status` is 400 with
        `scope=org`. The list is empty if you are in no organization, or your organization keeps its
        members' chats apart and you are not an admin. Deleted chats are never listed.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: scope
          in: query
          description: '`org` lists the chats of the other members of your organization that you may read. Default `own`.'
          schema: { type: string, enum: [own, org], default: own }
        - name: source
          in: query
          description: '`api` lists only chats your scripts created; `ui` only ones people started in the web app. Default `all`.'
          schema: { type: string, enum: [api, ui, all], default: all }
        - name: status
          in: query
          schema: { type: string, enum: [idle, running, requires_action, waiting_on_jobs] }
          description: Only chats in this state, e.g. `requires_action` to find chats waiting on an approval. A listed state can trail the chat by a few seconds; `GET /chats/{chatId}` has the current one.
        - name: mode
          in: query
          description: '`campaign` lists only chats that are or were campaigns. Default `all`.'
          schema: { type: string, enum: [chat, campaign, all], default: all }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: A page of chats, most recently updated first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Chat'
                            - $ref: '#/components/schemas/SharedChat'
              example:
                data:
                  - id: chat_7Q
                    object: chat
                    title: PD-L1 binders, hotspot 54-68
                    status: waiting_on_jobs
                    source: api
                    effort: high
                    agentId:
                    mode: campaign
                    campaign:
                      id: cmp_7Q
                      workflow: binder-design
                      status: running
                      plan:
                        stage: design
                        tasks:
                          - id: task-1
                            title: Pick hotspot residues
                            status: done
                          - id: task-2
                            title: RFdiffusion backbones, 200 designs
                            status: running
                          - id: task-3
                            title: Fold and filter with Boltz-2
                            status: pending
                      candidateCount: 18
                      startedAt: '2026-10-27T17:20:04Z'
                    webUrl: https://app.tamarind.bio/agent/chat_7Q
                    createdAt: '2026-10-27T17:02:11Z'
                    updatedAt: '2026-10-27T18:41:55Z'
                  - id: chat_2M
                    object: chat
                    title: Antibody humanization notes
                    status: idle
                    source: ui
                    effort: high
                    agentId:
                    mode: chat
                    campaign:
                    webUrl: https://app.tamarind.bio/agent/chat_2M
                    createdAt: '2026-10-25T09:12:00Z'
                    updatedAt: '2026-10-26T16:30:41Z'
                nextCursor: eyJ1IjoiMjAyNi0xMC0yNSJ9
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      operationId: getChat
      summary: Get a chat
      description: |
        A chat of a teammate is a `SharedChat`: its campaign and plan are included, its state, budget
        and usage are not.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: The chat.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Chat'
                  - $ref: '#/components/schemas/SharedChat'
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: waiting_on_jobs
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 40
                  usedHours: 1.52
                  perJobHours: 4
                autoApprove: true
                mode: campaign
                workflow: binder-design
                campaign:
                  id: cmp_7Q
                  workflow: binder-design
                  status: running
                  plan:
                    stage: design
                    tasks:
                      - id: task-1
                        title: Pick hotspot residues
                        status: done
                      - id: task-2
                        title: RFdiffusion backbones, 200 designs
                        status: running
                      - id: task-3
                        title: Fold and filter with Boltz-2
                        status: pending
                  candidateCount: 18
                  startedAt: '2026-10-27T17:20:04Z'
                usage:
                  agentHours: 0.42
                  jobsHours: 1.1
                  totalHours: 1.52
                  capHours: 40
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T18:41:55Z'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Chats]
      operationId: updateChat
      summary: Update a chat
      description: |
        Changes a chat. Send only the fields you want to change.

        When one request changes several fields, they apply in this order: `mode` and `workflow`;
        pausing (`campaign.status: paused`), so nothing runs on a budget you raise in the same
        request; `title`, `autoApprove`, `budgetHours` and `perJobHours`; `effort`; resuming
        (`campaign.status: running`); and last `dangerouslyApproveAll`, which, when it turns the flag
        on, also answers the approvals the agent is waiting on (see the field).

        A request that cannot succeed is refused before anything changes: `workflow` or
        `campaign.status` on a chat that is not in campaign mode and that the request does not put
        there (409 `not_in_campaign_mode`), and turning on `autoApprove` or `dangerouslyApproveAll`,
        or resuming, when your organization cannot start new work (403; pausing is always allowed).
        If a field is refused after earlier ones were applied, such as a budget at or below what the
        chat has already spent (422), the earlier changes stay applied. The error's `detail` starts
        with the name of the field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatUpdate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: The updated chat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: waiting_on_jobs
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 60
                  usedHours: 1.52
                  perJobHours: 4
                autoApprove: true
                mode: campaign
                workflow: binder-design
                campaign:
                  id: cmp_7Q
                  workflow: binder-design
                  status: running
                  plan:
                    stage: design
                    tasks:
                      - id: task-1
                        title: Pick hotspot residues
                        status: done
                      - id: task-2
                        title: RFdiffusion backbones, 200 designs
                        status: running
                      - id: task-3
                        title: Fold and filter with Boltz-2
                        status: pending
                  candidateCount: 18
                  startedAt: '2026-10-27T17:20:04Z'
                usage:
                  agentHours: 0.42
                  jobsHours: 1.1
                  totalHours: 1.52
                  capHours: 60
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T18:41:55Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `not_in_campaign_mode`: `workflow` or `campaign.status` on a chat that is not in campaign mode.
            - `no_campaign`: `campaign.status` before a campaign has started.
            - `conflict`: a chat that has run a campaign cannot go back to `mode: "chat"` or change its `workflow`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '422':
          description: |
            - `unknown_workflow`: `workflow` is not one `GET /agent-workflows` lists.
            - `invalid_request`: `budgetHours` is at or below what the chat has already used or reserved, or `autoApprove` cannot turn on because no budget is left. Send a higher `budgetHours`.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    delete:
      tags: [Chats]
      operationId: deleteChat
      summary: Delete a chat
      description: Stops any reply in progress, then deletes the chat. It is no longer listed, every other request for it is `404 not_found`, and it cannot be restored through the API.
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, object, deleted]
                properties:
                  id: { type: string }
                  object: { const: chat }
                  deleted: { const: true }
              example:
                id: chat_7Q
                object: chat
                deleted: true
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Messages ─────────────────────────────
  /chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message
      description: |
        Sends your message and starts the agent's reply. The reply is a Message with its own id, and
        your message's id is its `inReplyTo`.

        With `stream: true` the response is the reply's event stream. With `stream: false` it returns
        `202` and the queued reply. Follow that reply with `GET .../messages/{messageId}`, or with the
        chat's event stream and `messageId`. The reply keeps running if you disconnect, and it spends
        from the chat's budget.

        You can send while the agent is busy. The agent reads your message at its next step. The reply
        in progress ends there as `completed`, with `continuedBy` set to the new reply, which carries
        the work on. Nothing already running is stopped. Send `interrupt: true` to stop the reply in
        progress first.

        Retry with the same `Idempotency-Key` after a timeout and the message is sent once: a retry
        never starts a second reply. The key is tied to the message's `input` and `interrupt`; a retry
        may change `stream`, which only decides how the reply is returned. If a rewind has hidden the
        message, send it again under a new key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
            examples:
              streamed:
                value:
                  input:
                    - { type: text, text: Fold this and summarize pLDDT }
                    - { type: file, fileId: file_9f2 }
                  stream: true
      responses:
        '501':
          description: '`not_supported`: this chat cannot run replies on this Tamarind deployment.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: The reply's event stream (`stream:true`).
          headers:
            x-ratelimit-limit: { $ref: '#/components/headers/RateLimitLimit' }
            x-ratelimit-remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            x-ratelimit-reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventStream' }
              example: |
                id: 1040.0
                event: message.created
                data: {"id":"1040.0","type":"message.created","sequence":1040,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"id":"msg_1","object":"message","chatId":"chat_7Q","role":"assistant","createdAt":"2026-10-27T17:02:11Z","content":[],"status":"queued","startedBy":"user","inReplyTo":"msg_0","pendingApprovals":[],"pendingQuestions":[],"completedAt":null}}

                id: 1041.0
                event: message.in_progress
                data: {"id":"1041.0","type":"message.in_progress","sequence":1041,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"id":"msg_1","object":"message","chatId":"chat_7Q","role":"assistant","createdAt":"2026-10-27T17:02:11Z","content":[],"status":"in_progress","startedBy":"user","inReplyTo":"msg_0","pendingApprovals":[],"pendingQuestions":[],"completedAt":null}}

                id: 1042.0
                event: output_text.delta
                data: {"id":"1042.0","type":"output_text.delta","sequence":1042,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"partId":"p_0","delta":"I'll fold the target with Boltz-2, "}}

                id: 1043.0
                event: output_text.delta
                data: {"id":"1043.0","type":"output_text.delta","sequence":1043,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"partId":"p_0","delta":"5 samples."}}

                event: ping
                data: {}

                id: 1044.0
                event: step.started
                data: {"id":"1044.0","type":"step.started","sequence":1044,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"id":"stp_1","kind":"platform","title":"Submitting 5 Boltz-2 samples of the target","status":"running"}}

                id: 1050.0
                event: subagent.started
                data: {"id":"1050.0","type":"subagent.started","sequence":1050,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"id":"sub_3h","object":"subagent","chatId":"chat_7Q","messageId":"msg_1","name":"hotspot-researcher","title":"Find the PD-L1 hotspot residues","instructions":"Read the PD-L1/PD-1 complex (3BIK) and name the PD-L1 residues that carry the PD-1 contact.","background":false,"status":"running","result":null,"createdAt":"2026-10-27T17:03:40Z","completedAt":null}}

                id: 1061.0
                event: subagent.completed
                data: {"id":"1061.0","type":"subagent.completed","sequence":1061,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"id":"sub_3h","object":"subagent","chatId":"chat_7Q","messageId":"msg_1","name":"hotspot-researcher","title":"Find the PD-L1 hotspot residues","instructions":"Read the PD-L1/PD-1 complex (3BIK) and name the PD-L1 residues that carry the PD-1 contact.","background":false,"status":"completed","result":"Residues 54-68 (loop C'C'') form the PD-1 contact patch; 56, 63 and 66 are the anchors.","createdAt":"2026-10-27T17:03:40Z","completedAt":"2026-10-27T17:05:12Z"}}

                id: 1071.0
                event: job.completed
                data: {"id":"1071.0","type":"job.completed","sequence":1071,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"jobName":"boltz-target-1","tool":"boltz","status":"Complete"}}

                id: 1072.0
                event: step.completed
                data: {"id":"1072.0","type":"step.completed","sequence":1072,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"id":"stp_1","kind":"platform","title":"Submitting 5 Boltz-2 samples of the target","status":"completed"}}

                id: 1079.0
                event: output_text.done
                data: {"id":"1079.0","type":"output_text.done","sequence":1079,"chatId":"chat_7Q","messageId":"msg_1","createdAt":"2026-10-27T17:02:11Z","data":{"partId":"p_2","text":"Mean pLDDT 87.3 across 5 samples; the interface loop (residues 54-68) is the least confident at 71."}}

                id: 1080.0
                event: message.completed
