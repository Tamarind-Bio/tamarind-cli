  /chats/{chatId}/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - name: questionId
        in: path
        required: true
        schema: { type: string, examples: [q_8c] }
        description: The question, from a `question.asked` event or the reply's `pendingQuestions`.
    post:
      tags: [Approvals]
      operationId: answerQuestion
      summary: Answer a question
      description: |
        Answers a question the agent is waiting on, and the reply goes on in place. Sending a
        message instead does not answer it: it ends the waiting question and starts a new
        reply that reads your message. A question that is no longer pending returns 409
        `question_not_pending`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionAnswer' }
      responses:
        '200':
          description: The answered question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
              example:
                id: q_8c
                messageId: msg_1
                status: answered
                questions:
                  - question: Which chain is the target?
                    header: Target chain
                    multiSelect: false
                    options:
                      - label: Chain A
                        description: PD-L1 IgV domain
                      - label: Chain B
                        description: The second copy in the crystal
                answers:
                  Which chain is the target?: Chain A
                createdAt: '2026-10-27T17:03:02Z'
                expiresAt: '2026-10-27T17:06:02Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /chats/{chatId}/approvals/{approvalId}:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/ApprovalId'
    post:
      tags: [Approvals]
      operationId: resolveApproval
      summary: Approve or deny a pending action
      description: Resolving the reply's last pending approval completes it, and the agent's answer to the decision is a new reply, named by the old one's `continuedBy` when it starts (follow the chat's stream without `messageId` to see it). A card outlives a turn cancelled or interrupted while running, and stays pending until resolved; cancelling a reply whose turn already ended on the card denies it (see cancelMessage). Resolving an approval that is no longer pending returns 409 `approval_not_pending`; one whose reply was rewound away is `superseded`. Retrying needs no `Idempotency-Key`, since the approval is the key. The same bare `decision` again (a retry whose answer was lost) returns the resolved approval and runs nothing twice; a different decision, or new options, is 409 `approval_not_pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: The resolved approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
              example:
                id: apr_x
                messageId: msg_1
                status: approved
                kind: platform
                summary: Submit 24 Boltz-2 jobs (~3.1 h)
                detail:
                  operation: submit
                  tool: boltz
                  count: 24
                estimate:
                  computeHours: 3.1
                  jobs: 24
                createdAt: '2026-10-27T17:05:40Z'
                expiresAt:
                resolvedAt: '2026-10-27T17:06:02Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Files ─────────────────────────────
  /chat-files:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
    post:
      tags: [Files]
      operationId: createChatFile
      summary: Start a file upload
      description: |
        Returns a presigned URL. `PUT` the bytes to `uploadUrl` with the same `Content-Type`
        before `expiresAt`, then reference `fileId` in a message's `input`. The limit is 200 MB
        per file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size]
              properties:
                filename: { type: string, maxLength: 255, examples: [target.pdb], description: "The file's name, e.g. `target.pdb`. The agent sees this name, and the extension sets the default `contentType`." }
                contentType: { type: string, examples: [chemical/x-pdb], description: 'MIME type, e.g. `chemical/x-pdb`. Default: from the filename extension, else `application/octet-stream`.' }
                size: { type: integer, minimum: 1, maximum: 209715200, description: Size in bytes. Checked against the 200 MB limit before you upload anything. }
      responses:
        '201':
          description: Upload slot created.
          content:
            application/json:
              schema:
                type: object
                required: [fileId, uploadUrl, expiresAt]
                properties:
                  fileId: { type: string, examples: [file_9f2] }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
              example:
                fileId: file_9f2
