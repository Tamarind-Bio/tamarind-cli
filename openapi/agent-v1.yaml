              schema: { $ref: '#/components/schemas/Message' }
              example:
                id: msg_1
                object: message
                chatId: chat_7Q
                role: assistant
                createdAt: '2026-10-27T17:02:11Z'
                content:
                  - type: text
                    id: p_0
