      tags: [Files]
      operationId: downloadChatFile
      summary: Download a file
      responses:
        '302':
          description: Redirect to a short-lived presigned download URL.
          headers:
            Location: { schema: { type: string, format: uri }, example: 'https://tamarind-agent-files.s3.us-west-1.amazonaws.com/u/boltz/model_0.cif?X-Amz-Expires=300&X-Amz-Signature=EXAMPLE' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── Campaign mode ───────────────────────
  # A campaign is a mode of a chat, not a resource. There are no campaign paths:
  # start, change, pause, resume and stop it with `POST`/`PATCH /chats`; its state is the
  # Chat's `campaign` field; its results are chat collections (candidates, tasks, exports,
  # and jobs above), empty for a chat that never ran one.
  /agent-workflows:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
    get:
      tags: [Campaign mode]
      operationId: listAgentWorkflows
      summary: List the workflows a chat can run in campaign mode
      description: |
        Only workflows your account is entitled to are listed. An unknown workflow and one
        you are not entitled to both return 422 `unknown_workflow` wherever a workflow is named.
      responses:
        '200':
          description: Available workflows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
              example:
                data:
                  - id: binder-design
                    engine: sdk
                    label: Binder design
                    supports:
                      - plan
                  - id: miniprotein-design
                    engine: sdk
                    label: Miniprotein design
                    supports:
                      - plan
                  - id: classic-binder-miniprotein
                    engine: classic
                    label: Binder design (classic, miniprotein)
                    supports:
                      - interrupt
  /chats/{chatId}/candidates:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      operationId: listCandidates
      summary: List design candidates
      description: Designs a campaign in this chat produced, ranked. Empty for a chat that never ran one.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          description: "Rank by a metric, `-` for descending, e.g. `-iptm` for the best designs first. Default: the campaign's own ranking."
          schema: { type: string, examples: ['-iptm'] }
      responses:
        '200':
          description: A page of candidates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
              example:
                data:
                  - id: cand_07
                    name: pdl1-b07
                    sequence: MSEEKLKELLKRAEELAKKGDLEGAIRVLEEAL
                    rank: 1
                    metrics:
                      iptm: 0.86
                      plddt: 89.2
                      pae_interaction: 5.1
                    structureFileId: file_c07
                    jobName: boltz-pdl1-b07
                  - id: cand_12
                    name: pdl1-b12
                    sequence: MSPEELIKKAIELAKEGNLEEALKLLKEAA
                    rank: 2
                    metrics:
                      iptm: 0.83
                      plddt: 87.5
                      pae_interaction: 6.0
                    structureFileId: file_c12
                    jobName: boltz-pdl1-b12
                nextCursor: Y2FuZF8xMg
        '404': { $ref: '#/components/responses/NotFound' }
  /chats/{chatId}/candidates/{candidateId}/structure:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - name: candidateId
        in: path
        required: true
        schema: { type: string }
        description: The candidate, from `GET /chats/{chatId}/candidates`.
    get:
      tags: [Chats]
      operationId: getCandidateStructure
      summary: Download a candidate's predicted structure
      responses:
        '302':
          description: Redirect to a presigned download URL for the mmCIF/PDB file.
          headers:
            Location: { schema: { type: string, format: uri }, example: 'https://tamarind-agent-files.s3.us-west-1.amazonaws.com/u/candidates/pdl1-b07.cif?X-Amz-Expires=300&X-Amz-Signature=EXAMPLE' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/jobs:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      operationId: listChatJobs
      summary: List platform jobs submitted from this chat
      description: |
        Every job the agent submitted in this chat, in either mode, including the campaign's
        jobs. Each `jobName` can be used directly with the jobs API (`/api/jobs`, `/api/result`).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: campaignId
          in: query
          description: Only the jobs one campaign submitted, e.g. to separate a campaign's jobs from ones you asked for in chat mode.
          schema: { type: string }
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/JobRef' } }
              example:
                data:
                  - jobName: boltz-target-1
                    tool: boltz
                    status: Complete
                    submittedAt: '2026-10-27T17:06:05Z'
                    computeHours: 0.4
                    campaignId:
                  - jobName: rfd-pdl1-batch-3
                    tool: rfdiffusion
                    status: Complete
                    submittedAt: '2026-10-27T18:02:40Z'
                    computeHours: 0.7
                    campaignId: cmp_4k
                nextCursor:
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - name: taskId
        in: path
        required: true
        schema: { type: string }
        description: The task, from the campaign's `plan.tasks` on the chat.
    get:
      tags: [Chats]
      operationId: getChatTask
      summary: Get a task's report
      description: Tasks come from a campaign's plan. 404 for an id the chat's campaign never had, including on a chat that never ran one.
      responses:
        '200':
          description: The task report.
          content:
            application/json:
              schema:
                type: object
                required: [id, title, status]
                properties:
                  id: { type: string }
                  title: { type: string }
                  status: { type: string, enum: [pending, running, done, failed] }
                  report: { type: [string, 'null'], description: Markdown report written by the agent or a subagent. }
                  trace:
                    type: array
                    description: Ordered steps the task took.
                    items: { $ref: '#/components/schemas/Step' }
              example:
                id: t1
                title: Pick hotspot residues
                status: done
                report: "## Hotspot\nResidues 54-68 (loop C'C'') form the PD-1 contact patch; 56, 63 and 66 are the anchors."
                trace:
                  - id: stp_4
                    kind: platform
                    status: completed
                    title: Reading the RFdiffusion settings
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/subagents:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Subagents]
      operationId: listSubagents
      summary: List a chat's subagents
      description: Newest first, without their steps. Read one for its steps and result.
      parameters:
        - name: messageId
          in: query
          description: Only the subagents this reply started.
          schema: { type: string }
        - name: status
          in: query
          description: Only subagents in this status, e.g. `running` for the ones still working.
          schema: { $ref: '#/components/schemas/SubagentStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of subagents.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Subagent' } }
                  nextCursor: { type: [string, 'null'] }
              example:
                data:
                  - id: sub_5c
                    object: subagent
                    chatId: chat_7Q
                    messageId: msg_1
                    name: hotspot-researcher
                    title: Check the hotspot is not glycosylated
                    instructions: Check whether any of PD-L1 residues 54-68 carry a glycan.
                    background: true
                    status: running
                    result:
                    createdAt: '2026-10-27T17:05:30Z'
                    completedAt:
                  - id: sub_3h
                    object: subagent
                    chatId: chat_7Q
                    messageId: msg_1
                    name: hotspot-researcher
                    title: Find the PD-L1 hotspot residues
                    instructions: Read the PD-L1/PD-1 complex (3BIK) and name the PD-L1 residues that carry the PD-1 contact.
                    background: false
                    status: completed
                    result: Residues 54-68 (loop C'C'') form the PD-1 contact patch; 56, 63 and 66 are the anchors.
                    createdAt: '2026-10-27T17:03:40Z'
                    completedAt: '2026-10-27T17:05:12Z'
                nextCursor:
        '404': { $ref: '#/components/responses/NotFound' }
  /chats/{chatId}/subagents/{subagentId}:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/SubagentId'
    get:
      tags: [Subagents]
      operationId: getSubagent
      summary: Get a subagent
      description: Its brief, its steps so far and, once it has finished, what it found.
      responses:
        '200':
          description: The subagent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subagent' }
              example:
                id: sub_3h
                object: subagent
                chatId: chat_7Q
                messageId: msg_1
                name: hotspot-researcher
                title: Find the PD-L1 hotspot residues
                instructions: Read the PD-L1/PD-1 complex (3BIK) and name the PD-L1 residues that carry the PD-1 contact.
                background: false
                status: completed
                result: Residues 54-68 (loop C'C'') form the PD-1 contact patch; 56, 63 and 66 are the anchors.
                createdAt: '2026-10-27T17:03:40Z'
                completedAt: '2026-10-27T17:05:12Z'
                steps:
                  - id: stp_s1
                    kind: site
                    title: Reading 3BIK from the PDB
                    status: completed
                    subagentId: sub_3h
                  - id: stp_s2
                    kind: code
                    title: Measuring buried surface per residue
                    status: completed
                    subagentId: sub_3h
        '404': { $ref: '#/components/responses/NotFound' }
  /chats/{chatId}/subagents/{subagentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/SubagentId'
    post:
      tags: [Subagents]
      operationId: cancelSubagent
      summary: Stop a subagent
      description: |
        Stops this subagent only. Its reply goes on and is told the subagent was stopped. A
        subagent that already finished is returned unchanged.
      responses:
        '200':
          description: The subagent, `cancelled` or already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subagent' }
              example:
                id: sub_5c
                object: subagent
                chatId: chat_7Q
                messageId: msg_1
                name: hotspot-researcher
                title: Check the hotspot is not glycosylated
                instructions: Check whether any of PD-L1 residues 54-68 carry a glycan.
                background: true
                status: cancelled
                result: The helper was stopped before it finished.
                createdAt: '2026-10-27T17:05:30Z'
                completedAt: '2026-10-27T17:06:10Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{chatId}/exports:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    post:
      tags: [Chats]
      operationId: createChatExport
      summary: Export the chat's results
      description: |
        Exports the chat's campaign results (candidates, metrics, structures). Works after the
        chat went back to chat mode. 409 `no_campaign` when `campaign` is null.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [csv, zip], default: zip, description: '`zip` bundles structures and a metrics table; `csv` is the metrics table only, for a spreadsheet or LIMS import. Default `zip`.' }
      responses:
        '202':
          description: Export started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
              example:
                id: exp_5d
                status: pending
                format: zip
                downloadUrl:
                expiresAt:
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /chats/{chatId}/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
      - name: exportId
        in: path
        required: true
        schema: { type: string }
        description: The export, from `POST /chats/{chatId}/exports`.
    get:
      tags: [Chats]
      operationId: getChatExport
      summary: Get an export
      responses:
        '200':
          description: The export; `downloadUrl` is set once `status` is `ready`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
              example:
                id: exp_5d
                status: ready
                format: zip
                downloadUrl: https://tamarind-agent-files.s3.us-west-1.amazonaws.com/u/exports/exp_5d.zip?X-Amz-Signature=EXAMPLE
                expiresAt: '2026-10-28T18:45:00Z'
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Usage ─────────────────────────────
  /chats/{chatId}/usage:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Usage]
      operationId: getChatUsage
      summary: Get a chat's usage
      description: Model spend in dollars and tokens (overall and per model) and the jobs' GPU-weighted hours, so far.
      responses:
        '200':
          description: Usage so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
              example:
                agentUsd: 0.42
                agentHours: 0.42
                jobsHours: 1.1
                totalHours: 1.52
                capHours: 40
                tokens:
                  input: 18240
                  output: 9120
                  cacheRead: 612400
                  cacheWrite: 41300
                byModel:
                  - model: claude-opus-5-5
                    usd: 0.4
                    hours: 0.4
                    tokens:
                      input: 16100
                      output: 8420
                      cacheRead: 590200
                      cacheWrite: 39800
                  - model: claude-haiku-5-5
                    usd: 0.02
                    hours: 0.02
                    tokens:
                      input: 2140
                      output: 700
                      cacheRead: 22200
                      cacheWrite: 1500
  /agent-usage:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
    get:
      tags: [Usage]
      operationId: getAgentUsage
      summary: Get your monthly agent usage
      description: The month's model spend in dollars and tokens, per model, and the jobs' GPU-weighted hours, across all your chats.
      parameters:
        - name: month
          in: query
          description: 'Which month, `YYYY-MM`, e.g. for a monthly cost report. Default: the current month.'
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Totals for the month.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Usage'
                  - type: object
                    required: [month]
                    properties:
                      month: { type: string }
                      remainingHours: { type: [number, 'null'] }
              example:
                month: 2026-10
                agentUsd: 12.4
                agentHours: 12.4
                jobsHours: 61.9
                totalHours: 74.3
                remainingHours: 925.7
                tokens:
                  input: 512300
                  output: 268100
                  cacheRead: 18420000
                  cacheWrite: 1210500
                byModel:
                  - model: claude-opus-5-5
                    usd: 11.6
                    hours: 11.6
                    tokens:
                      input: 468000
                      output: 251000
                      cacheRead: 17300000
                      cacheWrite: 1150000
                  - model: claude-haiku-5-5
                    usd: 0.7
                    hours: 0.7
                    tokens:
                      input: 44300
                      output: 17100
                      cacheRead: 1120000
                      cacheWrite: 60500
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      description: The same Tamarind API key, sent as a bearer token.

  parameters:
    TamarindVersion:
      name: Tamarind-Version
      in: header
      required: false
      schema: { type: string, format: date, default: '2026-11-01', examples: ['2026-11-01'] }
      description: 'The API version your code was written against. Pin it so a later breaking change does not reach you. Default: `2026-11-01`, the first version.'
    SubagentId:
      name: subagentId
      in: path
      required: true
      schema: { type: string, examples: [sub_3h] }
      description: The subagent, from a `subagent.started` event, a `helper` step, or the list.
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string, examples: [chat_7Q] }
      description: The chat, e.g. `chat_7Q`, from `POST /chats` or `GET /chats`.
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, examples: [msg_1] }
      description: 'The message, e.g. `msg_1`: the reply `POST /chats/{chatId}/messages` returned, one listed by `GET /chats/{chatId}/messages` or the chat''s `activeMessageIds`, or a `message.created` event.'
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, examples: [apr_x] }
      description: The approval, e.g. `apr_x`, from a `message.requires_action` event, the reply's `pendingApprovals`, or `GET /chats/{chatId}/approvals`.
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, examples: [file_9f2] }
      description: The file, e.g. `file_9f2`, from `POST /chat-files` or a chat's file list.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Page size, 1-200. Raise it to page through a long history in fewer calls.
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`. Omit for the first page; stop when `nextCursor` is null.
      schema: { type: string }
    Stream:
      name: stream
      in: query
      description: '`true` keeps the connection open and sends events as they happen (SSE). `false` returns one page of past events: use it to catch up after being offline, then stream from the last id.'
      schema: { type: boolean, default: false }
    After:
      name: after
      in: query
      description: Only events after this cursor (an event `id`, e.g. `1042.0`). Use it to resume where you left off, from a stored cursor or the last event you processed.
      schema: { type: string, pattern: '^\d+(\.\d+)?$', examples: ['1042.0'] }
    LastEventId:
      name: Last-Event-ID
      in: header
      description: The standard SSE resume header, same meaning as `after`. Browsers' EventSource sends it automatically on reconnect; set it yourself in other clients.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Any unique string (a UUID is typical), up to 255 chars. Send the same key when you retry after a timeout or network error, and the request is applied once: a retried message never starts a second reply. Kept at least 24 h, bound to the request body (a blank key is refused, 400): the same key with a different body is 409 `idempotency_key_reused`, and so is a message''s key once a rewind hid that message (resend it under a new key). A message''s key is bound to its `input`; `stream` only changes how the reply is returned.'
      schema: { type: string, maxLength: 255 }

  headers:
    RateLimitLimit:
      description: New messages your account may send in an hour, across every key. On a message send, and its 429.
      schema: { type: integer }
    RateLimitRemaining:
      description: New messages left this hour.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the hour's count starts again.
      schema: { type: integer }
  responses:
    BadRequest:
      description: The request is malformed or fails validation (`invalid_request`, `invalid_cursor`). A method a path does not take is 405 `method_not_allowed`, in the same shape.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthenticated:
      description: Missing or invalid API key.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Key is valid but not allowed. Codes include `ai_disabled_for_org`, `agent_api_not_available_for_trial_keys` and `agent_api_not_enabled`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: No such resource, or it is not visible to you. An archived chat reads as not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: |
        The state does not allow this. Codes: `reply_in_progress` (a rewind while replies are running or queued),
        `question_not_pending` (answered already, or it stopped waiting),
        `approval_not_pending`, `idempotency_key_reused`, `conflict`, `operation_not_supported_for_engine`,
        `not_in_campaign_mode` (campaign fields on a chat not in campaign mode), `no_campaign`
        (a campaign-only action on a chat that never ran one).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BudgetExhausted:
      description: Your compute budget (or the chat or campaign cap) is used up.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: 'Message over 100,000 characters or about 295,000 bytes of UTF-8 (so CJK or emoji text fits fewer characters), more than 64 attachments, or a file over 200 MB.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Semantically invalid, e.g. `unknown_workflow`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    RateLimited:
      description: Too many requests, replies in progress or active campaigns.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait. }
        x-ratelimit-limit: { $ref: '#/components/headers/RateLimitLimit' }
        x-ratelimit-remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        x-ratelimit-reset: { $ref: '#/components/headers/RateLimitReset' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotSupported:
      description: In the contract, served in a later phase (`not_supported`), e.g. `agentId`, campaign fields, file parts.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: Something failed on our side (`internal_error`, `retryable` true). Retry with the same `Idempotency-Key`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: Temporarily unavailable (`unavailable`, among others), e.g. the rate limits could not be checked; `retryable` is true. Retry with the same `Idempotency-Key`, after `Retry-After` when it is set.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait, when known. }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    # ── shared ──
    Problem:
      type: object
      description: RFC 9457 problem details, in the same shape as the Tamarind public jobs API.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ['https://app.tamarind.bio/api-docs/errors/reply_in_progress'] }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          examples: [reply_in_progress]
          description: |
            Stable; branch on it, not on `detail`. New codes may be added.
            - 400 `invalid_request`, `invalid_cursor`, `unsupported_version`
            - 401 `unauthenticated` (no key), `invalid_api_key`
            - 403 `ai_disabled_for_org`, `agent_api_not_enabled`, `agent_api_not_available_for_trial_keys`, `organization_read_disabled`, `organization_compute_disabled` (an org that is not active may read but not send, or approve work)
            - 404 `not_found` (also another user's chat, and an archived one)
            - 405 `method_not_allowed`
            - 409 `conflict` (retryable when the chat moved under the request), `reply_in_progress`, `idempotency_key_reused`, `operation_not_supported_for_engine`
            - 413 `payload_too_large`
            - 422 `invalid_request` (a rewind to a message that is not a prompt, or a budget the chat has already spent)
            - 429 `rate_limited`
            - 500 `internal_error`
            - 501 `not_supported` (in the contract, served in a later phase)
            - 503 `unavailable`, `auth_unavailable`, `account_not_ready`, `organization_access_unavailable`
            Stream `error` events: `key_revoked`, `not_found` (the chat was deleted), `stream_interrupted`. A failed reply's `error.code`: `agent_error`.
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        retryable: { type: boolean }
        requestId: { type: string }
    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { type: [string, 'null'] }
    # ── chats ──
    ChatStatus:
      type: string
      description: |
        - `idle`: nothing running.
        - `running`: a reply is in progress.
        - `requires_action`: a reply is waiting on an approval or a question.
        - `waiting_on_jobs`: the agent is waiting for submitted jobs and will wake when they finish.
        - `archived`.
      enum: [idle, running, requires_action, waiting_on_jobs, archived]
    Chat:
      type: object
      required: [id, object, title, status, source, createdAt, updatedAt]
      properties:
        id: { type: string, examples: [chat_7Q] }
        object: { const: chat }
        title: { type: string }
        status: { $ref: '#/components/schemas/ChatStatus' }
        source: { type: string, enum: [api, ui], description: Where the chat was started. Both kinds appear in the web app sidebar. }
        activeMessageIds:
          type: array
          items: { type: string }
          description: 'Replies in progress, including ones the agent started on its own. Use them to cancel or follow a reply you did not start. Oldest first: the first is running, the rest are queued. Empty when idle. Not in `GET /chats` items, which say only whether the chat is working: read the chat for its replies.'
        effort: { $ref: '#/components/schemas/Effort' }
        agentId: { type: [string, 'null'], description: Saved agent (from the web app's agent builder) this chat runs. }
        budget: { $ref: '#/components/schemas/Budget' }
        autoApprove: { type: boolean, description: Job submissions within `budget.perJobHours` run without asking. Deletes and cancels always ask. }
        mode: { $ref: '#/components/schemas/ChatMode' }
        workflow: { type: [string, 'null'], description: 'The workflow the campaign runs, from `GET /agent-workflows`. Null in chat mode.' }
        campaign:
          description: The chat's campaign (the current one, or the last one if the chat went back to chat mode). Null if it never ran one.
          oneOf:
            - $ref: '#/components/schemas/Campaign'
            - type: 'null'
        usage: { $ref: '#/components/schemas/Usage' }
        webUrl: { type: string, format: uri, description: Open this chat in the web app. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatCreate:
      type: object
      description: Every field is optional.
      properties:
        title: { type: string, maxLength: 200, description: 'Shown in the web app sidebar. Set it to something your users will recognise, e.g. the ELN entry name. Default: generated from the first message.' }
        effort: { $ref: '#/components/schemas/Effort', description: 'How hard the agent thinks before acting. `low` is fastest and cheapest, for lookups and simple edits; `high` suits most design work; `max` is for hard multi-step problems, and is the slowest and most expensive. Default: the server''s default (`high`).' }
        agentId: { type: string, description: "Run a saved agent from the web app's agent builder, with its instructions, tools and settings. Use it to give scripts the same configured agent your team uses in the browser." }
        mode: { $ref: '#/components/schemas/ChatMode', description: '`campaign` makes this a design campaign: the first message is the objective and the agent works autonomously within the budget. Default `chat`.' }
        workflow: { type: string, description: 'Which campaign workflow (and engine) to run, from `GET /agent-workflows`. Campaign mode only. Default: the standard workflow.' }
        budgetHours: { $ref: '#/components/schemas/BudgetHours', description: 'Spend cap for the whole chat, campaign included. Set it lower than the default when a script runs unattended or you want a hard ceiling per experiment.' }
        perJobHours: { type: number, exclusiveMinimum: 0, description: 'Largest single job that `autoApprove` may submit without asking. Use it to let small jobs run hands-free while big ones still need a yes. Needs `autoApprove: true` (400 otherwise). Default: no ceiling.' }
        autoApprove: { type: boolean, default: false, description: '`true` lets the agent submit jobs within the budget without pausing for approval. Use it for unattended runs; deletes and cancels always still ask. Default off.' }
    ChatUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, maxLength: 200, description: Rename the chat. }
        effort: { $ref: '#/components/schemas/Effort', description: 'Change the effort for future messages, e.g. `max` when a task turns out harder than expected, or `low` for quick follow-ups.' }
        mode: { $ref: '#/components/schemas/ChatMode', description: Switch to `campaign` to hand the chat's task to an autonomous campaign; switch back to `chat` to pause it and discuss the results. }
        workflow: { type: string, description: 'Change the campaign''s workflow. The current campaign is paused and kept; switching back resumes it.' }
        budgetHours: { $ref: '#/components/schemas/BudgetHours', description: "Raise or lower the chat's spend cap, e.g. to let a campaign that is going well continue." }
        perJobHours: { type: number, exclusiveMinimum: 0, description: "Change the largest job `autoApprove` may submit without asking. Send it with `autoApprove: true`; a limit you leave out keeps the value the chat shows." }
        autoApprove: { type: boolean, description: "Turn hands-free job submission on or off, e.g. off before reviewing a campaign's next batch yourself. `true` uses the limits in this request and keeps the chat's own for the rest; already on with no limit named, nothing changes. A budget already spent is refused (422) whether it is named or kept: send a higher `budgetHours`. The budget is the chat's, so spend carries across Auto being turned off and on. Turning it off takes no budget: send `budgetHours` in its own request (with both, the request is refused, 400)." }
        campaign:
          type: object
          properties:
            status:
              type: string
              enum: [running, paused, cancelled]
              description: '`paused` stops new work while running jobs finish (e.g. to review results). `running` resumes. `cancelled` stops it for good and cancels its jobs; results stay readable and the chat stays open.'
          description: Campaign controls. Campaign mode only.
    BudgetHours:
      type: number
      exclusiveMinimum: 0
      description: |
        The chat's spend cap in weighted hours ($1 of model spend = 1 h; GPU jobs weighted by
        hardware). Runs and the chat's campaign spend from it; a run that reaches it ends
        `incomplete` with `budget_exhausted`. Default: on the agent's current engine, your
        remaining balance, capped at 20,000 h, the same default as the web app; on the
        classic engine, none (`capHours` null), so name one for an unattended run. Approval
        pauses still apply unless `autoApprove` is on, so a default budget never lets jobs
        run unasked.
    Budget:
      type: object
      required: [capHours, usedHours]
      properties:
        capHours: { type: [number, 'null'], description: 'The cap; null when the chat has none.' }
        usedHours: { type: [number, 'null'], description: 'Spent so far: the chat''s meter, or on an engine without one the Auto run''s own count. Null when the meter cannot be read right now.' }
        perJobHours: { type: [number, 'null'] }
    Effort:
      type: string
      enum: [low, medium, high, max]
    ChatMode:
      type: string
      description: |
        - `chat`: a plain conversation.
        - `campaign`: the chat runs a design workflow autonomously within a budget.

        On a Chat this is derived by the server, never stored as-is: `campaign` when the chat
        is in campaign mode on any engine (sdk included), `chat` otherwise. It answers "is this a
        campaign right now". Whether the chat has ever run a campaign is `campaign != null`:
        a chat switched back to `chat` keeps its paused or finished campaign there. In a request
        it is the mode you want.
      enum: [chat, campaign]
      default: chat

    # ── messages & content ──
    InputPart:
      oneOf:
        - type: object
          title: TextPart
          required: [type, text]
          properties:
            type: { const: text }
            text: { type: string, minLength: 1, maxLength: 100000 }
        - type: object
          title: FilePart
          required: [type, fileId]
          properties:
            type: { const: file }
            fileId: { type: string, description: 'From `POST /chat-files`, a chat file listing, or a jobs-API file.' }
      discriminator: { propertyName: type }
    OutputPart:
      oneOf:
        - type: object
          title: OutputText
          required: [type, text]
          properties:
            type: { const: text }
            id: { type: string, description: 'Matches `partId` on `output_text.*` events.' }
            text: { type: string }
        - type: object
          title: OutputFile
          required: [type, fileId]
          properties:
            type: { const: file }
            fileId: { type: string }
            path: { type: string }
        - type: object
          title: OutputStep
          required: [type, step]
          properties:
            type: { const: step }
            step: { $ref: '#/components/schemas/Step' }
    Message:
      type: object
      description: |
        Yours (`role: user`) or the agent's reply (`role: assistant`). A reply is one agent turn;
        the fields from `status` down are set on replies only.
      required: [id, object, chatId, role, content, createdAt]
      properties:
        id: { type: string, examples: [msg_1] }
        object: { const: message }
        chatId: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: array, items: { $ref: '#/components/schemas/OutputPart' } }
        createdAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/MessageStatus' }
        startedBy:
          type: string
          enum: [user, job, timer, continuation, campaign]
          description: |
            What started this reply. `user`: your message (`inReplyTo`). `job`: jobs finishing
            woke the agent. `timer`: an Auto status check, or a notice from the platform (Auto paused, stopped or resumed). `continuation`: the agent carrying on a reply that ended `incomplete` (a limit, or a restart). `campaign`: a campaign step.
        inReplyTo: { type: [string, 'null'], description: 'Your message this replies to. Null when the agent started the reply.' }
        continuedBy: { type: [string, 'null'], description: 'Set when a message you sent while this reply ran was read into it: the reply that carried the work on from there. This reply then ends `completed`.' }
        incompleteReason:
          type: [string, 'null']
          enum: [budget_exhausted, turn_time_limit, step_limit, context_limit, interrupted, max_output, rewound, null]
          description: |
            Why the reply ended early. `budget_exhausted`: the chat's budget ran out. `turn_time_limit`:
            it ran out of time. `step_limit`: it reached the most tool calls one reply may make.
            `context_limit`: the conversation stopped fitting the model. `interrupted`: the platform
            restarted (a deploy) and usually resumes the work by itself (a reply with `startedBy: continuation`);
            if none follows, resend. After `turn_time_limit`, `step_limit`, `context_limit` or `interrupted`
            the agent may carry on in a new reply of its own (`startedBy: continuation`). `rewound`: a rewind
            hid how it ended; it never resumes.
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
        model: { type: string, description: 'The model that wrote this reply, chosen by the server. Read-only: useful for audits and reproducibility.' }
        pendingApprovals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        pendingQuestions: { type: array, items: { $ref: '#/components/schemas/Question' } }
        usage: { $ref: '#/components/schemas/Usage' }
        completedAt: { type: [string, 'null'], format: date-time }
    Step:
      type: object
      description: |
        Something the agent did, in words. Internal tool names, raw arguments and raw output are
        never public: they can carry secrets (a signed URL inside a command, say). What a step
        produced reaches you as its own events and collections: `job.*`, `file.created`,
        candidates.
      required: [id, kind, title, status]
      properties:
        id: { type: string, examples: [stp_1] }
        kind:
          type: string
          enum: [platform, code, web, site, helper, other]
          description: |
            - `platform`: a Tamarind action, e.g. submitting or reading jobs, files or molecules.
            - `code`: running code in the chat's sandbox.
            - `web`: a web search.
            - `site`: reading a web page or connecting to a host.
            - `helper`: a helper agent working on a sub-task.
        title: { type: string, examples: ['Submitting 5 Boltz-2 samples'], description: 'The agent''s own one-line status for the step.' }
        status: { type: string, enum: [running, waiting, completed, failed], description: '`waiting`: stopped at an approval, so nothing has run yet.' }
        subagentId:
          type: [string, 'null']
          description: On a `helper` step, the subagent it started. On a step a subagent took, that subagent. Null otherwise.

    SubagentStatus:
      type: string
      enum: [running, completed, failed, cancelled]
    Subagent:
      type: object
      description: |
        A helper agent working on a sub-task. Its steps follow the same rule as the reply's: no
        internal tool names, arguments or output.
      required: [id, object, chatId, messageId, name, title, status, createdAt]
      properties:
        id: { type: string, examples: [sub_3h] }
        object: { const: subagent }
        chatId: { type: string }
        messageId: { type: string, description: The reply that started it. }
        name: { type: string, examples: [hotspot-researcher], description: 'Which kind of helper it is.' }
        title: { type: string, examples: ['Find the PD-L1 hotspot residues'], description: 'The sub-task in one line, as the agent put it.' }
        instructions: { type: [string, 'null'], description: 'The brief the agent gave it, cut at 4,000 characters.' }
        background: { type: boolean, description: 'True when it runs on after its reply ends; its result then arrives in a later reply.' }
        status: { $ref: '#/components/schemas/SubagentStatus' }
        steps:
          type: array
          description: |
            Only when you get one subagent. Every step for its first 120, then one step a few
            seconds, so a long run still shows its latest work.
          items: { $ref: '#/components/schemas/Step' }
        result: { type: [string, 'null'], description: 'What it found, in its own words (Markdown, up to 8,000 characters); for a failed or stopped one, what happened. Null while it runs.' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }

    MessageStatus:
      type: string
      description: |
        A reply's lifecycle: `queued` (waiting behind earlier replies; `classic`, `cda` and
        `opendde` campaigns, or briefly before the agent picks it up) → `in_progress` ⇄
        `requires_action`, then one of the final states `completed`, `failed`, `cancelled` or
        `incomplete`.
      enum: [queued, in_progress, requires_action, completed, failed, cancelled, incomplete]
    MessageCreate:
      type: object
      required: [input]
      properties:
        input:
          type: array
          minItems: 1
          maxItems: 65
          description: 'Your message: one text part plus up to 64 file parts (`fileId` from `POST /chat-files`, or a jobs-API file). The only required field.'
          items: { $ref: '#/components/schemas/InputPart' }
        stream: { type: boolean, default: false, description: "`true` returns the reply's live event stream in the response, for showing the answer as it is written. `false` returns at once (202) with the reply; follow it by polling or the event stream. Default false." }
        interrupt: { type: boolean, default: false, description: "`true` stops the reply in progress now (cancelled, as with `cancel`) and runs this message next; replies still queued are cancelled too. Use it for a correction that must not wait for the agent's current step. Default false: the message steers the running reply, or queues." }

    # ── approvals ──
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired, superseded]
    Approval:
      type: object
      required: [id, status, kind, summary, createdAt]
      properties:
        id: { type: string, examples: [apr_x] }
        messageId: { type: [string, 'null'], description: The reply waiting on this approval. Null for campaign approvals raised between replies. }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        kind:
          type: string
          enum: [platform, code, web, site, helper, connector, package, batch, plan, campaign_start]
          description: |
            - `platform`: a Tamarind action that spends or deletes, e.g. submitting or deleting jobs.
            - `code`: run a command in the chat's sandbox.
            - `web`: run a web search.
            - `site`: let the chat read a web page or connect to a host.
            - `helper`: start a helper agent on a sub-task.
            - `connector`: call a tool of a connector the user added (a third-party service).
            - `package`: install a Python package in the chat's sandbox.
            - `campaign_start`: the agent offers to switch this chat into campaign mode. Approving
              it (optionally with `workflow` and `budgetHours`) is the same as
              `PATCH /chats/{chatId} {mode: "campaign"}`. Never shown to a caller with no
              workflows in `GET /agent-workflows`.
            - `batch`: submitting a batch of jobs (`detail.count` and `estimate.jobs` say how many).
            - `plan`: a campaign plan, an amendment to it, a stage, a decision or a deviation, or a harness confirmation.
        summary: { type: string, examples: ['Submit 24 Boltz-2 jobs (~3.1 h)'] }
        detail: { $ref: '#/components/schemas/ApprovalDetail' }
        estimate:
          type: object
          properties:
            computeHours: { type: number }
            jobs: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    ApprovalDetail:
      type: object
      description: |
        What exactly would run, so a script can decide. Which fields are set depends on `kind`:
        - `platform`: `operation`, `tool`, `count`, `target`, `settings`, `affects` and `call`; for a
          change to your agent or a skill (the agent builder), also `settingChanges` and `scopes`.
        - `code`: `command`.
        - `web`: `query`.
        - `site`: `host`, and `connect` when a command would open a connection to it.
        - `helper`: `helper`, `task`.
        - `package`: `package`.
        - `connector`: `connector`, `tool`, `arguments`.
        - `campaign_start`: `workflow`, and `plan` when the campaign starts from a plan.
        - `plan`: a proposed plan's `plan`; an amendment's `changes`, `reason` and the `plan` it
          makes; a stage, decision or deviation's `record`.

        Every field is what the web app's card shows, as written: only your own chats are readable,
        so nothing in them is hidden from you, a credential the agent wrote into a command included
        (where the card hides one, a custom tool's `envVars`, so does this). `complete` is false
        when `arguments` were cut at 4,000 characters, or `settings` or any part of `call` cut to fit
        (the call sends them whole); an action too long to show whole raises no approval at all.
      properties:
        operation: { type: string, enum: [submit, delete, cancel, other] }
        tool: { type: string, examples: [boltz], description: 'The Tamarind tool, as named in the jobs API; for a `connector` approval, the connector''s tool.' }
        connector: { type: string, examples: [Benchling], description: The connector (third-party service) a `connector` approval would call. }
        arguments: { type: string, description: 'The arguments a `connector` approval would send, as indented JSON (bounded).' }
        count: { type: integer, description: Jobs affected. }
        command: { type: string }
        query: { type: string }
        host: { type: string, examples: [rest.uniprot.org] }
        connect: { type: boolean, default: false, description: 'On a `site` approval: a command in the workspace would open a connection to `host`, which can send its files as well as read. Approving it `once` keeps the host open to the workspace until it restarts, as in the web app; a page read''s `once` is that page alone.' }
        helper: { type: string, examples: [hotspot-researcher] }
        task: { type: string }
        package: { type: string, examples: [numpy], description: The Python package to install. }
        workflow: { type: string, examples: [binder-design], description: 'The workflow a `campaign_start` runs: the one offered, and once approved the one the campaign took (a picked workflow the chat cannot run is dropped for the offered one, as in the web app).' }
        plan:
          type: object
          description: The plan as the web app's plan card shows it. Fields it leaves unset are absent.
          properties:
            title: { type: string }
            objective: { type: string }
            target: { type: string }
            modality: { type: string }
            workflow: { type: string }
            rationale: { type: string }
            stages:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  goal: { type: string }
                  designs: { type: integer }
                  tools: { type: array, items: { type: string } }
            tools: { type: array, items: { type: string } }
            validation:
              type: array
              items:
                type: object
                properties:
                  method: { type: string }
                  threshold: { type: string }
            deliverables: { type: array, items: { type: string } }
            designCount: { type: integer }
            estimatedHours: { type: number }
            budgetHours: { type: number }
        changes:
          type: array
          description: What an amendment changes against the plan in force, field by field (a stage added or removed has one side empty).
          items:
            type: object
            required: [field, before, after]
            properties:
              field: { type: string, examples: ['Stage: Screen'] }
              before: { type: string }
              after: { type: string }
        reason: { type: string, description: Why the agent asks to amend the plan. }
        settingChanges:
          type: array
          description: 'What an agent builder change changes, a row per setting (`key`): `before` and `after` for a value; `added`, `removed` and their counts for a list (`every` is `before` or `after` when that side is every one); `changed` and `changedCount` for switches. Lists show a bounded number of names; the counts are whole.'
          items:
            type: object
            required: [key]
            additionalProperties: true
            properties:
              key: { type: string, examples: [allowed_sites] }
              added: { type: array }
              removed: { type: array }
              addedCount: { type: integer }
              removedCount: { type: integer }
              changed: { type: array }
              changedCount: { type: integer }
              every: { type: string, enum: [before, after] }
        target: { type: string, description: 'What the call names: the job, batch or run it starts, or the job, file or run it deletes, cancels or stops.' }
        settings: { type: string, description: 'As indented JSON: what a platform call runs with (a job''s settings; a batch''s first job, or what its jobs share), or what an agent builder change saves (the agent''s definition, or a skill''s SKILL.md and files). Bounded.' }
        affects: { type: object, additionalProperties: true, description: 'For a delete, cancel or stop: what the platform reports it reaches (a job''s type, status and children, a run''s steps, a file''s size).' }
        call:
          type: object
          additionalProperties: true
          description: 'The rest of the call as the web app''s card shows it, per tool: a custom tool''s mode, Dockerfile, scripts and resources (`customTool`), a pipeline''s graph and bindings, a fine-tuning run''s base model and files (`finetune`), a benchmark''s predictors (`benchmark`), a batch''s source (`fromJob`, `fromFile`, `batchFile`). Bounded. Fields may be added.'
        scopes: { type: array, items: { type: string }, description: 'The scopes an agent builder change may be saved for (`once`, `chat`, `all`), any of which `scope` may name.' }
        record:
          type: object
          additionalProperties: true
          description: 'What a stage, decision or deviation would record, as its card shows it: `stage`, `status`, `note` and `plan_stage`; `decision`, `reason`, `direction`; or `deviation`, `reason`, `cost`.'
        complete: { type: boolean, default: true }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny], description: '`approve` lets the paused action run; `deny` tells the agent not to, and it continues without it.' }
        budgetHours: { type: number, exclusiveMinimum: 0, description: 'Only when accepting a `campaign_start` offer: set the chat''s budget as you accept. Default: keep the current budget.' }
        workflow: { type: string, description: 'Only when accepting a `campaign_start` offer from a start card: run a different workflow than the agent proposed. Default: the proposed one. One the chat cannot run is dropped for the proposed one; the answer''s `detail.workflow` says which runs.' }
        scope:
          type: string
          enum: [once, chat, site, all, connector, package]
          default: once
          description: |
            `once` approves only this action (on a `site` approval with `detail.connect`, the host stays
            open to the workspace until it restarts). `chat` also allows later actions of the same kind in
            this chat, for `code`, `web` and `helper` approvals. For `site` approvals: `site` allows
            that host for the rest of the chat, `all` every host. A `platform`, `plan` or
            `campaign_start` approval takes only `once` (for jobs to run without asking, set
            `autoApprove` on the chat), unless the approval is an agent builder change, which
            names its own scopes. On a `connector` approval: `once` that call alone, `chat` that tool
            for the chat, `connector` every tool of that connector for the chat, `all` every tool of it
            in all your chats. A `package`
            approval must name `package` (that package for the chat) or `chat` (every package). A denial takes no
            scope. Any other scope is refused (400).
            Default `once`.

    # ── questions ──
    Question:
      type: object
      description: The agent asking you to choose before it goes on. One card can hold several questions.
      required: [id, status, questions, createdAt]
      properties:
        id: { type: string, examples: [q_8c] }
        messageId: { type: string, description: The reply waiting on the answer. }
        status: { type: string, enum: [pending, answered, expired] }
        questions:
          type: array
          items:
            type: object
            required: [question, options]
            properties:
              question: { type: string }
              header: { type: string }
              multiSelect: { type: boolean }
              options:
                type: array
                items:
                  type: object
                  required: [label]
                  properties:
                    label: { type: string }
                    description: { type: string }
        answers: { type: [object, 'null'], additionalProperties: { type: string }, description: 'What was answered, by question text.' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 'The agent waits about 3 minutes. After that the question is `expired` and the reply ends asking in words; answer by sending a message.' }
    QuestionAnswer:
      type: object
      minProperties: 1
      properties:
        answers:
          type: object
          additionalProperties: { type: string }
          description: 'Your choice for each question, keyed by the question''s text: an option''s `label`, or your own words. For a `multiSelect` question, join labels with ", ".'
        text: { type: string, description: 'One plain answer given to every question on the card. Use it when the questions have no options or one sentence answers them all.' }

    # ── files ──
    File:
      type: object
      required: [id, object, filename, status]
      properties:
        id: { type: string, examples: [file_k2] }
        object: { const: file }
        filename: { type: string }
        path: { type: string, description: 'Path inside the workspace, e.g. boltz/model_0.cif.' }
        contentType: { type: string }
        size: { type: integer }
        status: { type: string, enum: [pending, ready] }
        origin: { type: string, enum: [upload, agent, job] }
        createdAt: { type: string, format: date-time }

    # ── campaign mode ──
    CampaignEngine:
      type: string
      description: |
        - `sdk`: the current agent.
        - `classic`: the original campaign runtime.
        - `cda`: preset design programs.
        - `opendde`: the OpenDDE harness.
      enum: [sdk, classic, cda, opendde]
    CampaignStatus:
      type: string
      enum: [planning, running, awaiting_input, paused, completed, cancelled, failed]
    Workflow:
      type: object
      required: [id, engine, label]
      properties:
        id: { type: string, examples: [binder-design] }
        engine: { $ref: '#/components/schemas/CampaignEngine' }
        label: { type: string }
        description: { type: string }
        supports:
          type: array
          description: Optional behaviour this engine supports.
          items: { type: string, enum: [interrupt, plan] }
    Campaign:
      type: object
      description: The campaign part of a chat in campaign mode. Read it on the Chat; change it with `PATCH /chats/{chatId}`.
      required: [id, engine, workflow, status]
      properties:
        id: { type: string, examples: [cmp_4k], description: 'Stable id for correlating events and jobs. Every operation addresses it through its chat.' }
        engine: { $ref: '#/components/schemas/CampaignEngine' }
        workflow: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        plan:
          type: [object, 'null']
          description: The current plan with stages and tasks; tasks are readable at `/chats/{chatId}/tasks/{taskId}`. Null for engines without plans.
          properties:
            stage: { type: string }
            tasks:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  status: { type: string, enum: [pending, running, done, failed] }
        candidateCount: { type: integer }
        pausedWorkflows:
          type: array
          description: Campaigns this chat kept on other workflows, paused until the chat switches back.
          items:
            type: object
            properties:
              id: { type: string }
              workflow: { type: string }
              status: { $ref: '#/components/schemas/CampaignStatus' }
        startedAt: { type: string, format: date-time }
    Candidate:
      type: object
      required: [id, sequence]
      properties:
        id: { type: string }
        name: { type: string }
        sequence: { type: string }
        rank: { type: integer }
        metrics:
          type: object
          description: Engine-specific scores, e.g. iptm, plddt, pae_interaction, ipsae.
          additionalProperties: { type: number }
        structureFileId: { type: [string, 'null'] }
        jobName: { type: [string, 'null'] }
    JobRef:
      type: object
      required: [jobName, tool, status]
      properties:
        jobName: { type: string }
        tool: { type: string, examples: [boltz] }
        status: { type: string, examples: [Complete] }
        submittedAt: { type: string, format: date-time }
        computeHours: { type: [number, 'null'] }
        campaignId: { type: [string, 'null'], description: The campaign that submitted it; null for a job submitted in chat mode. }
    Export:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, ready, failed] }
        format: { type: string }
        downloadUrl: { type: [string, 'null'], format: uri }
        expiresAt: { type: [string, 'null'], format: date-time }

    # ── usage ──
    Usage:
      type: object
      description: |
        What the agent cost. Model spend is in US dollars and tokens; jobs are in GPU-weighted
        hours. Budgets are in hours, where $1 of model spend = 1 h, so `agentHours` equals
        `agentUsd`. `tokens` and `byModel` come with the usage endpoints, not with the chat or
        message objects.
      required: [agentHours, jobsHours, totalHours]
      properties:
        agentUsd: { type: number, description: 'Model spend in US dollars. This is what is charged: the spend recorded by the model gateway, or the per-round estimate at list prices while that is still higher.' }
        agentHours: { type: number }
        jobsHours: { type: number }
        totalHours: { type: number }
        capHours: { type: [number, 'null'] }
        tokens:
          description: Model tokens, all models together. Null on engines that keep no token ledger.
          oneOf:
            - $ref: '#/components/schemas/TokenCounts'
            - type: 'null'
        byModel:
          type: array
          description: Spend per model, largest first. `usd` here is the per-round estimate, so the rows can sum to slightly less than `agentUsd`.
          items:
            type: object
            required: [model, usd, tokens]
            properties:
              model: { type: string }
              usd: { type: number }
              hours: { type: number }
              tokens: { $ref: '#/components/schemas/TokenCounts' }
    TokenCounts:
      type: object
      required: [input, output, cacheRead, cacheWrite]
      properties:
        input: { type: integer, description: Input tokens not served from the prompt cache. }
        output: { type: integer }
        cacheRead: { type: integer, description: Input tokens read from the prompt cache. }
        cacheWrite: { type: integer, description: Input tokens written to the prompt cache. }

    # ── events ──
    EventStream:
      type: string
      description: |
        `text/event-stream`. Each event is sent as:

            id: <sequence>.<index>
            event: <type>
            data: <Event JSON>

        `ping` events are sent every 15 s and have no `id`, so they never move your cursor.
        Reconnect with `Last-Event-ID: <last id>` (or `?after=`) and you get exactly the events
        you missed. The server may also send `retry: 2000`.
    EventPage:
      type: object
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
        nextCursor: { type: [string, 'null'], description: Pass as `after` to continue. }
    Event:
      type: object
      description: Envelope for every event, streamed or listed.
      required: [id, type, sequence, chatId, createdAt, data]
      properties:
        id: { type: string, description: 'Resume cursor `<sequence>.<index>`.', examples: ['1042.0'] }
        type: { $ref: '#/components/schemas/EventType' }
        sequence: { type: integer, description: Monotonic per chat. }
        chatId: { type: string }
        messageId: { type: [string, 'null'], description: 'The reply this event belongs to. Null for events between replies, e.g. campaign progress.' }
        campaignId: { type: [string, 'null'], description: Set on campaign-mode events. }
        createdAt: { type: string, format: date-time }
        data:
          description: |
            Shape depends on the event's `type`; see the matching `*Data` schema. This is `anyOf`, not
            `oneOf`: the shapes overlap (every one is also an object), so pick the shape by `type`.
          anyOf:
            - $ref: '#/components/schemas/MessageEventData'
            - $ref: '#/components/schemas/TextDeltaData'
            - $ref: '#/components/schemas/TextDoneData'
            - $ref: '#/components/schemas/Step'
            - $ref: '#/components/schemas/Subagent'
            - $ref: '#/components/schemas/Question'
            - $ref: '#/components/schemas/Approval'
            - $ref: '#/components/schemas/JobEventData'
            - $ref: '#/components/schemas/File'
            - $ref: '#/components/schemas/Usage'
            - $ref: '#/components/schemas/ErrorData'
            - type: object
    EventType:
      type: string
      description: |
        Clients MUST ignore types they don't know.

        **Messages**
        - `message.created`: a message was added, yours or a reply starting (status `queued`).
        - `message.in_progress`, `message.requires_action`, `message.completed`, `message.failed`,
          `message.cancelled`, `message.incomplete`: a reply's status changed.
          Data is the Message (`requires_action` adds `approvals[]`).
        - `message.continued` `{id, continuedBy}`: a message you sent while this reply ran was
          read into it (steering, `sdk` engine); the reply `continuedBy` names carries the work on.

        **Reply text**
        - `output_text.delta` `{partId, delta}`
        - `output_text.done` `{partId, text}`. Authoritative: replace the accumulated deltas with it.
        - `output_text.discarded` `{partId}`: the agent threw that draft away; remove it.

        **Steps and subagents**
        - `step.started`, `step.waiting` (stopped at an approval, nothing has run) and `step.completed` (Step). A step a subagent took has its `subagentId`.
        - `subagent.started` and `subagent.completed` (Subagent, without steps). `completed`
          covers every end; read its `status`.

        **Human in the loop**
        - `approval.requested` and `approval.resolved` (Approval)
        - `question.asked` and `question.resolved` (Question): answer it with
          `POST /chats/{chatId}/questions/{questionId}`.

        **Platform**
        - `job.submitted`, `job.completed`, `job.failed` `{jobName, tool, status}`
        - `file.created` (File)

        **Campaign mode** (on the chat's own stream)
        - `plan.updated` `{plan}`
        - `candidates.updated` `{count, top[]}`
        - `campaign.status` `{campaignId, status}`

        **Chat**
        - `chat.rewound` `{fromSequence, toSequence}`: a rewind (yours, or an edit in the web
          app) hid the events in that range and the messages they made. Re-read
          `GET /chats/{chatId}/messages`: a reply the cut ended now reads `incomplete`
          (`rewound`), and a running fold cannot take back what the hidden events added.
          Sent to a read following one message (`messageId`) too.

        **Misc**
        - `usage.updated` (Usage)
        - `error` `{code, message, retryable}`
        - `ping` (stream only, no id)
      enum:
        - message.created
        - message.in_progress
        - message.requires_action
        - message.completed
        - message.failed
        - message.cancelled
        - message.incomplete
        - message.continued
        - output_text.delta
        - output_text.done
        - output_text.discarded
        - step.started
        - step.waiting
        - step.completed
        - subagent.started
        - subagent.completed
        - approval.requested
        - approval.resolved
        - question.asked
        - question.resolved
        - job.submitted
        - job.completed
        - job.failed
        - file.created
        - plan.updated
        - candidates.updated
        - campaign.status
        - chat.rewound
        - usage.updated
        - error
        - ping
    MessageEventData:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
    TextDeltaData:
      type: object
      required: [partId, delta]
      properties:
        partId: { type: string }
        delta: { type: string }
    TextDoneData:
      type: object
      required: [partId, text]
      properties:
        partId: { type: string }
        text: { type: string }
    JobEventData:
      type: object
      required: [jobName, status]
      properties:
        jobName: { type: string }
        tool: { type: string }
        status: { type: string }
    ErrorData:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [key_revoked] }
        message: { type: string }
        retryable: { type: boolean }
