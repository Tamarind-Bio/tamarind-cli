openapi: 3.1.0
info:
  title: Tamarind Agent API
  version: 1.0.0-draft
  summary: "Drive Tamarind's AI agent programmatically: chats (including campaign mode), streamed replies, approvals and files."
  description: |
    DRAFT 2026-10-26, design only, not implemented. The design rationale is in
    `docs/agent-public-api-design.md`.

    **Base URL.** `https://app.tamarind.bio/api`, the same host and prefix as the jobs API
    (`/api/jobs`, `/api/molecules`, `/api/pipelines`). There is no version segment in the URL:
    each path below is a Next.js rewrite to `${agentUrl}/v1/public/<same path>` on the agent
    service.

    **Auth.** `x-api-key: <your Tamarind API key>`, the same key as the jobs API.
    `Authorization: Bearer <key>` is also accepted. Agent-trial (unclaimed) keys are refused.
    Your organization must have AI enabled.

    **Versioning.** Send `Tamarind-Version: 2026-11-01` (a date). A breaking change ships under a
    new date, and your requests keep the behaviour of the date you send. Without the header you
    get `2026-11-01`, the first version. Every response echoes the version it used. Additive
    changes (new fields, new event types) come without a new date.

    **Conventions.**
    - JSON is camelCase.
    - Lists take `limit` and an opaque `cursor`, and return `nextCursor` (null on the last page).
    - Errors are RFC 9457 `application/problem+json`.
    - Every POST that creates or spends accepts `Idempotency-Key` (kept at least 24 h, bound to a
      hash of the body).
    - Clients MUST ignore unknown event types and unknown fields. New ones are added without a
      version bump.

    **Chats and campaigns are one resource.** A campaign is a mode of a chat: the same id,
    history, event stream, approvals and files. Start one with `POST /chats {mode: "campaign"}`
    or switch an existing chat with `PATCH /chats/{chatId} {mode: "campaign"}`. There are no
    campaign paths: pause, resume, stop and budget are `PATCH /chats/{chatId} {campaign: …}`,
    its state is the Chat's `campaign` field, and its results are chat collections.

    **Streaming.** Server-sent events.
    - Each event's SSE `id` is a resume cursor (`<sequence>.<index>`).
    - Reconnect with the `Last-Event-ID` header or `?after=`.
    - `ping` events come every 15 s and carry no id.
    - A reply keeps going when your connection drops.
  license:
    name: Proprietary
    identifier: LicenseRef-Tamarind-Proprietary
  contact:
    name: Tamarind Bio
    url: https://app.tamarind.bio/api-docs
servers:
  - url: https://app.tamarind.bio/api
    description: Production
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Chats
    description: A chat is a durable conversation with the agent. It is the same object the Tamarind web app shows in its sidebar.
  - name: Messages
    description: |
      A message is one entry in a chat: yours, or the agent's reply. A reply is one agent turn,
      and its id is how you follow it: it has a status, streams as it is written, can be
      cancelled, and keeps going if you disconnect. Replies the agent starts on its own (a job
      finishing, a campaign step) are messages too.
  - name: Subagents
    description: |
      Helper agents the agent starts on a sub-task (a hotspot researcher, say). Each has its own
      status, steps and result, and can be stopped on its own while its reply goes on.
  - name: Events
    description: Append-only, ordered events for a chat (or one reply), campaign progress included. They are listed as history or tailed as an SSE stream.
  - name: Approvals
    description: Human-in-the-loop. Spending, destructive and outbound actions pause the reply in `requires_action` until you approve or deny them, and questions wait for your answer.
  - name: Files
    description: Upload inputs and download what the agent produced.
  - name: Campaign mode
    description: |
      A chat in campaign mode runs a long, autonomous design workflow with a budget, a plan and
      candidates, on any engine (sdk, classic, cda, opendde). There are no campaign endpoints:
      it is controlled with `PATCH /chats/{chatId}` and read from the Chat's `campaign` field.
      This tag lists only the workflow catalog.
  - name: Usage
    description: What the agent cost, per chat and per month, in dollars, tokens and weighted hours.

paths:
  # ───────────────────────────── Chats ─────────────────────────────
  /chats:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
    post:
      tags: [Chats]
      operationId: createChat
      summary: Create a chat
      description: |
        Creates a chat owned by the key's user. Every field is optional: `POST /chats {}`
        gives a plain chat with the default effort and budget. Send messages with
        `POST /chats/{chatId}/messages`.

        `mode: "campaign"` makes the chat's first message start a campaign on `workflow`
        (default: the standard workflow). The workflow picks the engine, fixed for that
        campaign's life. An unknown workflow and one you are not entitled to both return
        422 `unknown_workflow`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCreate' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '201':
          description: Chat created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: idle
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 40
                  usedHours: 0
                  perJobHours:
                autoApprove: false
                mode: chat
                workflow:
                campaign:
                usage:
                  agentHours: 0
                  jobsHours: 0
                  totalHours: 0
                  capHours: 40
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T17:02:11Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/BudgetExhausted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Chats]
      operationId: listChats
      summary: List chats
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: source
          in: query
          description: '`api` lists only chats your scripts created; `ui` only ones people started in the web app. Default `all`.'
          schema: { type: string, enum: [api, ui, all], default: all }
        - name: status
          in: query
          schema: { type: string, enum: [idle, running, requires_action, waiting_on_jobs] }
          description: Only chats in this state, e.g. `requires_action` to find chats waiting on an approval. Deleted chats are never listed. A listed state can trail the chat by a few seconds; `GET /chats/{chatId}` has the current one. If states cannot be read, the list is 503 rather than reporting them idle.
        - name: mode
          in: query
          description: '`campaign` lists only chats that are or were campaigns. Default `all`.'
          schema: { type: string, enum: [chat, campaign, all], default: all }
        - name: campaignStatus
          in: query
          schema: { $ref: '#/components/schemas/CampaignStatus' }
          description: Only campaigns in this state, e.g. `running` for a dashboard of live campaigns, or `awaiting_input` for ones that need you.
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: A page of chats, most recently updated first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Chat' } }
              example:
                data:
                  - id: chat_7Q
                    object: chat
                    title: PD-L1 binders, hotspot 54-68
                    status: waiting_on_jobs
                    source: api
                    effort: high
                    agentId:
                    mode: campaign
                    campaign:
                      id: cmp_4k
                      engine: sdk
                      workflow: binder-design
                      status: running
                      plan:
                        stage: design
                        tasks:
                          - id: t1
                            title: Pick hotspot residues
                            status: done
                          - id: t2
                            title: RFdiffusion backbones, 200 designs
                            status: running
                          - id: t3
                            title: Fold and filter with Boltz-2
                            status: pending
                      candidateCount: 18
                      pausedWorkflows: []
                      startedAt: '2026-10-27T17:20:04Z'
                    webUrl: https://app.tamarind.bio/agent/chat_7Q
                    createdAt: '2026-10-27T17:02:11Z'
                    updatedAt: '2026-10-27T18:41:55Z'
                  - id: chat_2M
                    object: chat
                    title: Antibody humanization notes
                    status: idle
                    source: ui
                    effort: high
                    agentId:
                    mode: chat
                    campaign:
                    webUrl: https://app.tamarind.bio/agent/chat_2M
                    createdAt: '2026-10-25T09:12:00Z'
                    updatedAt: '2026-10-26T16:30:41Z'
                nextCursor: eyJ1IjoiMjAyNi0xMC0yNSJ9
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      operationId: getChat
      summary: Get a chat
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: The chat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: waiting_on_jobs
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 40
                  usedHours: 1.52
                  perJobHours: 4
                autoApprove: true
                mode: campaign
                workflow: binder-design
                campaign:
                  id: cmp_4k
                  engine: sdk
                  workflow: binder-design
                  status: running
                  plan:
                    stage: design
                    tasks:
                      - id: t1
                        title: Pick hotspot residues
                        status: done
                      - id: t2
                        title: RFdiffusion backbones, 200 designs
                        status: running
                      - id: t3
                        title: Fold and filter with Boltz-2
                        status: pending
                  candidateCount: 18
                  pausedWorkflows: []
                  startedAt: '2026-10-27T17:20:04Z'
                usage:
                  agentUsd: 0.42
                  agentHours: 0.42
                  jobsHours: 1.1
                  totalHours: 1.52
                  capHours: 40
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T18:41:55Z'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Chats]
      operationId: updateChat
      summary: Change a chat's settings, mode or campaign
      description: |
        One call for everything you can change about a chat, campaign included.

        - `mode`: switching to `campaign` keeps the same id, history, stream and URL; this is
          how a chat becomes a campaign, on `workflow` (default: the standard workflow). A caller
          with no workflows in `GET /agent-workflows` gets 422 `unknown_workflow`. Switching to
          `chat` pauses the campaign.
        - `workflow`: switching pauses the current campaign and keeps it; switching back
          resumes it.
        - `budgetHours`, `perJobHours`, `autoApprove`: the chat's one budget and auto-approval.
          They apply in either mode; a campaign spends from the same budget.
        - `campaign.status`: `paused`, `running` (resume) or `cancelled` (stop permanently;
          its jobs are cancelled, results stay readable, the chat stays open). Idempotent.

        To stop the campaign's current step without pausing it, cancel the reply in progress
        (`POST /chats/{chatId}/messages/{messageId}/cancel`).
        An engine that doesn't support a change returns 409 `operation_not_supported_for_engine`.

        `campaign.status` needs the chat to be in campaign mode, now or by this same PATCH.
        Otherwise the PATCH returns 409 `not_in_campaign_mode` and changes nothing. That
        includes a chat whose campaign is paused because it went back to chat mode: resume it
        with `mode: "campaign"`, not `campaign.status`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatUpdate' }
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: The updated chat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
              example:
                id: chat_7Q
                object: chat
                title: PD-L1 binders, hotspot 54-68
                status: waiting_on_jobs
                source: api
                activeMessageIds: []
                effort: high
                agentId:
                budget:
                  capHours: 60
                  usedHours: 1.52
                  perJobHours: 4
                autoApprove: true
                mode: campaign
                workflow: binder-design
                campaign:
                  id: cmp_4k
                  engine: sdk
                  workflow: binder-design
                  status: running
                  plan:
                    stage: design
                    tasks:
                      - id: t1
                        title: Pick hotspot residues
                        status: done
                      - id: t2
                        title: RFdiffusion backbones, 200 designs
                        status: running
                      - id: t3
                        title: Fold and filter with Boltz-2
                        status: pending
                  candidateCount: 18
                  pausedWorkflows: []
                  startedAt: '2026-10-27T17:20:04Z'
                usage:
                  agentUsd: 0.42
                  agentHours: 0.42
                  jobsHours: 1.1
                  totalHours: 1.52
                  capHours: 60
                webUrl: https://app.tamarind.bio/agent/chat_7Q
                createdAt: '2026-10-27T17:02:11Z'
                updatedAt: '2026-10-27T18:41:55Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '402': { $ref: '#/components/responses/BudgetExhausted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Chats]
      operationId: archiveChat
      summary: Archive a chat
      description: Stops any reply in progress and every campaign the chat ran (including ones paused by a workflow switch), then archives it. This is not a hard delete.
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { const: archived }
                  campaignsStopping: { type: array, items: { type: string } }
              example:
                id: chat_7Q
                status: archived
                campaignsStopping:
                  - cmp_4k
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Messages ─────────────────────────────
  /chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/TamarindVersion'
      - $ref: '#/components/parameters/ChatId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message
      description: |
        Sends your message and starts the agent's reply. The reply is a Message with its own
        id: keep it to check on, stream or cancel this turn. Your message's id is the reply's
        `inReplyTo`.

        With `stream: true` the response body is the reply's SSE stream, from
        `message.created` to a final `message.*` event. With `stream: false` it returns `202`
        and the reply (status `queued`); follow it with `GET .../messages/{messageId}` or the
        chat's event stream with `messageId`.

        The reply runs server-side whether or not you stay connected, and spends from the
        chat's budget. A send while the agent is busy is never refused:
        - On the `sdk` engine (the default) the agent reads your message at its next step, as
          steering. The reply in progress ends there as `completed` with `continuedBy` set to
          the new reply, which carries the work on. Nothing already running is stopped.
        - On `classic`, `cda` and `opendde` campaigns the reply is `queued` and starts when the
          replies ahead of it finish, in the order sent.

        Send `interrupt: true` to stop the reply in progress first (on queued engines, the
        queued replies are dropped too) and run your message next.
        `Idempotency-Key` makes retries safe: a retried send returns the same reply and never
        starts a second one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
            examples:
              streamed:
                value:
                  input:
                    - { type: text, text: Fold this and summarize pLDDT }
                    - { type: file, fileId: file_9f2 }
                  stream: true
      responses:
        '501': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '200':
          description: The reply's event stream (`stream:true`).
          headers:
            x-ratelimit-limit: { $ref: '#/components/headers/RateLimitLimit' }
            x-ratelimit-remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            x-ratelimit-reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventStream' }
              example: |
                id: 1040.0
                event: message.created
                data: {"id":"1040.0","type":"message.created","sequence":1040,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"msg_1","object":"message","chatId":"chat_7Q","role":"assistant","createdAt":"2026-10-27T17:02:11Z","content":[],"status":"queued","startedBy":"user","inReplyTo":"msg_0","pendingApprovals":[],"pendingQuestions":[],"completedAt":null}}

                id: 1041.0
                event: message.in_progress
                data: {"id":"1041.0","type":"message.in_progress","sequence":1041,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"msg_1","object":"message","chatId":"chat_7Q","role":"assistant","createdAt":"2026-10-27T17:02:11Z","content":[],"status":"in_progress","startedBy":"user","inReplyTo":"msg_0","pendingApprovals":[],"pendingQuestions":[],"completedAt":null}}

                id: 1042.0
                event: output_text.delta
                data: {"id":"1042.0","type":"output_text.delta","sequence":1042,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"partId":"p_0","delta":"I'll fold the target with Boltz-2, "}}

                id: 1043.0
                event: output_text.delta
                data: {"id":"1043.0","type":"output_text.delta","sequence":1043,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"partId":"p_0","delta":"5 samples."}}

                event: ping
                data: {}

                id: 1044.0
                event: step.started
                data: {"id":"1044.0","type":"step.started","sequence":1044,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"stp_1","kind":"platform","title":"Submitting 5 Boltz-2 samples of the target","status":"running"}}

                id: 1045.0
                event: job.submitted
                data: {"id":"1045.0","type":"job.submitted","sequence":1045,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"jobName":"boltz-target-1","tool":"boltz","status":"In Queue"}}

                id: 1050.0
                event: subagent.started
                data: {"id":"1050.0","type":"subagent.started","sequence":1050,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"sub_3h","object":"subagent","chatId":"chat_7Q","messageId":"msg_1","name":"hotspot-researcher","title":"Find the PD-L1 hotspot residues","instructions":"Read the PD-L1/PD-1 complex (3BIK) and name the PD-L1 residues that carry the PD-1 contact.","background":false,"status":"running","result":null,"createdAt":"2026-10-27T17:03:40Z","completedAt":null}}

                id: 1061.0
                event: subagent.completed
                data: {"id":"1061.0","type":"subagent.completed","sequence":1061,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"sub_3h","object":"subagent","chatId":"chat_7Q","messageId":"msg_1","name":"hotspot-researcher","title":"Find the PD-L1 hotspot residues","instructions":"Read the PD-L1/PD-1 complex (3BIK) and name the PD-L1 residues that carry the PD-1 contact.","background":false,"status":"completed","result":"Residues 54-68 (loop C'C'') form the PD-1 contact patch; 56, 63 and 66 are the anchors.","createdAt":"2026-10-27T17:03:40Z","completedAt":"2026-10-27T17:05:12Z"}}

                id: 1071.0
                event: job.completed
                data: {"id":"1071.0","type":"job.completed","sequence":1071,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"jobName":"boltz-target-1","tool":"boltz","status":"Complete"}}

                id: 1072.0
                event: step.completed
                data: {"id":"1072.0","type":"step.completed","sequence":1072,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"stp_1","kind":"platform","title":"Submitting 5 Boltz-2 samples of the target","status":"completed"}}

                id: 1079.0
                event: output_text.done
                data: {"id":"1079.0","type":"output_text.done","sequence":1079,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"partId":"p_2","text":"Mean pLDDT 87.3 across 5 samples; the interface loop (residues 54-68) is the least confident at 71."}}

                id: 1080.0
                event: message.completed
                data: {"id":"1080.0","type":"message.completed","sequence":1080,"chatId":"chat_7Q","messageId":"msg_1","campaignId":null,"createdAt":"2026-10-27T17:02:11Z","data":{"id":"msg_1","object":"message","chatId":"chat_7Q","role":"assistant","createdAt":"2026-10-27T17:02:11Z","content":[{"type":"text","id":"p_0","text":"I'll fold the target with Boltz-2, 5 samples."},{"type":"step","step":{"id":"stp_1","kind":"platform","title":"Submitting 5 Boltz-2 samples of the target","status":"completed"}},{"type":"text","id":"p_2","text":"Mean pLDDT 87.3 across 5 samples; the interface loop (residues 54-68) is the least confident at 71."},{"type":"file","fileId":"file_k2","path":"boltz/model_0.cif"}],"status":"completed","startedBy":"user","inReplyTo":"msg_0","pendingApprovals":[],"pendingQuestions":[],"completedAt":"2026-10-27T17:14:02Z","incompleteReason":null,"error":null,"model":"claude-opus-5-5","usage":{"agentHours":0.08,"jobsHours":0.4,"totalHours":0.48,"capHours":40}}}
        '202':
          description: The reply, accepted and queued (`stream:false`).
          headers:
            Location:
              description: 'The reply, as a reference relative to this request: `messages/{messageId}`, which resolves to `.../chats/{chatId}/messages/{messageId}`.'
              schema: { type: string }
            x-ratelimit-limit: { $ref: '#/components/headers/RateLimitLimit' }
