      description: |
        Poll a reply until its `status` is final (`completed`, `failed`, `cancelled`,
        `incomplete`). The id stays the same for the whole turn, even if the server restarts
        mid-reply and picks the work up again.
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
