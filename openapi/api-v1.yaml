    PipelineRunItem:
      type: object
      description: |
        A `/jobs` item of `kind` `pipeline`. Its steps, node runs and molecules are under
        `/pipelines/runs/{runId}`, with the run's own detailed status. Status from the run's:
        `queued` In Queue, `running` Running, `finished` and `partial` Complete (a partial run's
        failures show in `counts` and `jobCounts`), `stopped` Stopped (`stopReason` `canceled`),
        `failed` Failed (`stopReason` `error`: `platform_error` when the cause is ours, i.e. `infra`,
        `ingestion_failed`, `ingestion_timeout` or `outputs_lost`, otherwise `tool_error`). The
        `message` is always a fixed sentence. A `failed` run halted: a step's tool failed and the
        steps after it never ran, so unlike a batch, whose jobs are independent, it is `Failed`. A
        run that finished with some failed steps is `partial`, so `Complete`.
      required:
      - kind
      - id
      - name
      - displayName
      - pipeline
      - status
      - stopReason
      - counts
      - jobCounts
      - projectId
      - createdBy
      - apiKeyId
      - source
      - createdAt
      - startedAt
      - completedAt
      - pollAfterSeconds
      - links
      properties:
        kind:
          type: string
          const: pipeline
        id:
          type: string
          description: '`run_` and the run''s id, the same run `/pipelines/runs/{runId}` takes.'
          examples:
          - run_3f2a9c1e-7b4d-4e8a-9c2b-1d0e5f6a7b8c
        name:
          type: string
          description: The run's name, or a generated `run-` and the first 8 characters of its id when it has none.
        displayName:
          type:
          - string
          - 'null'
          description: The name the run was given; null when it has none.
        pipeline:
          type:
          - string
          - 'null'
          description: The name of the pipeline it ran.
        status:
          $ref: '#/components/schemas/JobStatus'
        stopReason:
          description: Set when `status` is `Stopped` or `Failed`.
          oneOf:
          - $ref: '#/components/schemas/JobStopReason'
          - type: 'null'
        counts:
          description: The run's steps (tool nodes) by status. `waiting` and `queued` count as inQueue,
            `running` as running, `finished` as complete, `failed` as failed, and `stopped`, `cancelled` and
            `skipped` (never ran because an earlier step didn't finish) as stopped. A step status not in this
            list counts as running, since it is no evidence of a failure.
          $ref: '#/components/schemas/ItemCounts'
        jobCounts:
          description: The jobs the run's steps launched, each once at its newest attempt, by the same status
            `GET /jobs` shows for that job. In a list, only what's already cached, and null when nothing is; on
            `GET /jobs/run_...`, read at most 60 seconds ago.
          oneOf:
          - $ref: '#/components/schemas/ItemCounts'
          - type: 'null'
        projectId:
          type:
          - string
          - 'null'
          description: Null for now.
        createdBy:
          type: string
          format: email
        apiKeyId:
          type:
          - string
          - 'null'
          description: Null for now.
        source:
          description: The channel the run was submitted through. Null for a run that recorded none,
            which is every run started before runs recorded it.
          oneOf:
          - $ref: '#/components/schemas/SubmissionChannel'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          description: When the run started, which is when it was submitted.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The same time as `createdAt`.
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        pollAfterSeconds:
          type:
          - integer
          - 'null'
          description: How long to wait before checking again, 30 while `In Queue` and 15 while `Running`. Null
            once the run is finished.
        links:
          type: object
          required:
          - self
          - jobs
          - pipeline
          properties:
            self:
              type: string
              format: uri-reference
              description: '`/jobs/run_...`'
            jobs:
              type: string
              format: uri-reference
              description: '`/jobs?pipelineRunId=run_...`, the jobs its steps launched.'
            pipeline:
              type: string
              format: uri-reference
              description: '`/pipelines/runs/run_...`, the run''s own detail, with the same `run_` id.'
    PipelineRunStatus:
