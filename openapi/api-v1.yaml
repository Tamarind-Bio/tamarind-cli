      - type: object
        required:
        - warnings
        properties:
          warnings:
            type: array
            description: For `kind` `batch`, always empty, because its rows are checked after the 202; `validateJob`
              returns each row's warnings. For a job its tool split, the validator's findings on that job. Not
              returned by `getJob`.
            items:
              $ref: '#/components/schemas/Diagnostic'
    SubmittedJob:
      description: What `submitJob` returns for a job, the job plus the validator's non-blocking findings.
