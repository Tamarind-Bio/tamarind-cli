      additionalProperties: false
      description: |-
        The spec's `ChainMappingEntry` — how ONE chain is defined for ingestion,
        keyed by chain id.

        This is what REPLACED the old fixed CSV role vocabulary
        (`heavy_chain`/`light_chain`/`sequence`/...), which could only describe
        antibody-shaped data and could not name a chain id at all (design notes §1).
      properties:
        csvColumn:
          anyOf:
          - maxLength: 500
            minLength: 1
            type: string
          - type: 'null'
          title: Csvcolumn
        tags:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChainTag'
            maxItems: 3
            type: array
          - type: 'null'
          description: Roles for this chain. A chain is `heavy` OR `light`, never both (storage keeps one subtype);
            `lead` is compatible with either. Omit to inherit the schema's tag.
          title: Tags
        type:
          anyOf:
          - $ref: '#/components/schemas/ChainType'
          - type: 'null'
      type: object
    ChainTag:
      description: The spec's `ChainTag` — the functional role of one chain.
      enum:
      - heavy
      - light
      - lead
      type: string
    ChainType:
      description: The spec's `ChainType` — the molecular kind of one chain.
      enum:
      - protein
      - small_molecule
      type: string
    CommitMoleculeImportRequest:
      additionalProperties: false
      description: The spec's `CommitRequest` — optional overrides applied at commit time.
      properties:
        columnMapping:
          anyOf:
          - additionalProperties:
