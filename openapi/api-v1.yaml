    Job:
      allOf:
      - $ref: '#/components/schemas/JobSummary'
      - type: object
        required:
        - settings
        - modelId
        - maxRuntimeSeconds
        - weightedHoursBudget
        - rerunOf
        properties:
          settings:
            type: object
            additionalProperties: true
            description: The settings as submitted, without internal keys. A molecule picked from the Molecules
              Database reads as its sequence, SMILES or structure file name. A file setting reads as its stored
              key, under the owner's email, and a job name's path as the job's folder.
          modelId:
            type:
            - string
            - 'null'
          maxRuntimeSeconds:
            type:
            - integer
            - 'null'
          weightedHoursBudget:
            type:
            - number
            - 'null'
          rerunOf:
            type:
            - string
            - 'null'
            description: The `job_` id of the job this one reran, on jobs an earlier v1 rerun created as a new
              job. `rerunJob` now reruns in place and never sets it, so it's null otherwise.
    JobStopReason:
      type: object
      required:
      - kind
      - code
      - message
      - retryable
      - hint
      properties:
        kind:
          type: string
          enum:
          - canceled
          - error
          - limit
          - unknown
          description: '`error` (status `Failed`): it failed; read `code` and `message`. `canceled` (status
            `Stopped`): a user or an API call stopped it, so there is nothing to fix. `limit` (status `Stopped`): a
            budget, quota or runtime limit you or your organization set stopped it. `unknown` (status `Stopped`):
            it stopped and no reason was recorded, so we don''t claim it failed.'
        code:
          type: string
          description: 'With `kind` `error`: `tool_error`, `invalid_input`, `out_of_memory`, `timeout` (the tool''s
            own time limit) or `platform_error` (our fault). With `limit`: `budget_exceeded`, `quota_exceeded`,
            `runtime_limit` (the maximum runtime set at submit) or, on a batch only, `queue_full` (too many of your
            jobs were waiting to run). With `canceled`: `canceled`. With `unknown`: `unknown`. New codes can be
            added.'
        message:
          type: string
          description: What happened, in words safe to show a user. The message recorded with the stop when there
            is one (a cancel's `reason`, for example), at most 500 characters; otherwise a fixed sentence for the
            `code`. A pipeline run's is always the fixed sentence.
        retryable:
          type:
          - boolean
          - 'null'
          description: Whether `rerunJob` with unchanged settings could help. Null when unknown.
        hint:
          type:
          - string
          - 'null'
          description: What to try next, when we know, e.g. `Use a larger GPU or split the input`.
    JobFile:
      type: object
      required:
      - path
      - sizeBytes
      - modifiedAt
      - ref
      - downloadUrl
      - downloadUrlExpiresAt
      properties:
        path:
          type: string
          description: Relative to the job's output folder.
        sizeBytes:
          type: integer
        modifiedAt:
          type: string
          format: date-time
        ref:
          type:
          - string
          - 'null'
          description: Pass this as any file setting of another job to reuse this file without downloading it. It is
            `{folder}/{path}`, the job's folder in your workspace and the file's `path`. A job stored under its own
            id has a folder named by that id, without `job_`; older jobs' folders are their names. Null for another
            account's job, such as an organization peer's or one you claimed from an agent trial, whose files no
            file setting of yours can name.
          examples:
          - 8d445959-3c1e-4b7a-9f62-2a51d0c7e4b8/predictions/model_1.pdb
        downloadUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Null without `includeDownloadUrls=true`.
        downloadUrlExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Null without `includeDownloadUrls=true`.
