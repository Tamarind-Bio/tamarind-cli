openapi: 3.1.0
info:
  title: Tamarind API
  version: 1.0.0-draft.10
  summary: Run computational biology tools, and manage their inputs, outputs and access.
  description: |
    DRAFT. Each operation's `x-build` says where it stands. All 116 operations are merged; main
    deploys to staging (`https://api-staging.tamarind.bio`), where v1 is behind the `api-v1` flag.
    Where a merged operation doesn't yet do everything this contract describes, its `x-build` names
    what's missing. The keyless catalog reads are built behind a launch switch. See DESIGN.md for the
    reasoning and the settled decisions, and MIGRATION.md for how today's routes map here.

    ## Conventions (these hold for every operation)

    **Base URL and versioning.** `https://api.tamarind.bio`, with no version in the path. Send an
    optional `Tamarind-Version: YYYY-MM-DD` header to pin a version; without it, a request gets the
    first version. Adding a field, an operation or an error code is not a breaking change and needs
    no new date. Removing or renaming anything, or adding a value to a closed enum in a response,
    ships under a new date, and a request that sends an older date keeps the older behavior. A
    request parameter's enum can accept a new value without a new date. Responses echo the version
    they used in `Tamarind-Version`. A retiring operation sends `Deprecation` (RFC 9745) and
    `Sunset` (RFC 8594) headers, then answers 410.

    **Authentication.** Send `Authorization: Bearer <key>`. `x-api-key: <key>` is also accepted.
    Every operation needs a key except two that answer without one at launch, as their public
    versions do today: `GET /tools` (without a key, the public catalog; with one, what that key's
    owner may run) and `GET /pipelines/schema`. Those two share one overall rate limit rather than a
    per-key one. Until launch they need a key like every other operation. A missing key is 401
    `authentication_required`; an unknown, revoked or expired key is 401 `invalid_api_key`, one
    answer for all three, and so is a key whose owner's email belongs to more than one account.
    When the key's account can't be confirmed yet, the answer is 503 `service_unavailable`, retryable. Use `GET /me` to check a key. A valid key without permission is always
    403. While v1 is behind the `api-v1` flag, a caller the flag doesn't cover gets the 404 an
    unknown path gets. A key can do everything its owner can do at the moment of each request, and
    never more. On `/service-accounts` and `GET /api-keys?scope=org`, an organization admin's own
    key acts as admin (see `listServiceAccounts`). Who can see and act on another member's jobs is
    the same as on today's API (decision 74), route by route. Reading and canceling are built;
    changing another member's job's project isn't yet.

    - Lists and lookups (`scope=org` and `createdBy` on `listJobs`, `name=` included, `searchJobs`
      by `names`, and `getJob` of a member's job): in an organization that shares within itself,
      every member sees the organization's jobs; in any other, only its admin (whose own key
      counts) and its service account do. A member's batch (`getJob` of its `batch_` id, and
      `listJobs?batchId=`, with no `scope=org` needed) reads as today's batch read shows it, each
      of its jobs admitted on its own.
    - A member's job's or batch's files, logs and results zip
      (`listJobFiles`, `getJobFile`, `getJobLogs`, `getJobResults`), follow today's `/result` rule for
      a key, which is stricter: on a job that records its organization, an admin's key has no admin
      exemption, and access comes from the organization sharing within itself, the job being
      shared with you, a project, or being the service account. A member's batch is read only when
      that rule admits every job its zip holds, as today's zip check does. Today's API has
      no key route that lists a member's files, so `listJobFiles` answers exactly the callers who
      may download the zip. A check that can't be completed is 503
      `jobs_dependency_unavailable`, retryable.
    - `cancelJob` of a job and `updateJob`'s `projectId` (the project edit isn't built yet) open to
      an admin's key and to a key the job is shared with, only in an organization that doesn't share
      within itself.
      Canceling a batch, `deleteJob`, `rerunJob` and `displayName` stay the owner's.

    A key never makes a key for its own owner: creating one
    without `serviceAccountId` is 403 `session_required`, and creating and rotating your own keys
    stay on the website's keys page, which only a signed-in session can use.

    **Identifiers.** Every resource has an opaque `id`. Do not parse it. Jobs, batches, pipeline
    runs and API keys use prefixed ids (`job_...`, `batch_...`, `run_...`, `key_...`); molecules,
    molecule groups, molecule imports and schemas use UUIDs. An id of the wrong kind is treated as an unknown id. `id` is the only address in a path. Names are labels; to
    find something by name, filter the list (`GET /jobs?name=...`). A field named for another
    resource, like `batchId` on a job, points at that resource. Two things are addressed by
    what they are called instead: tools and custom tools by `name`, and files by `path`.

    **Casing.** JSON fields, query parameters and path parameters are camelCase. Timestamps are
    RFC 3339 strings named `*At`. Tool `settings` are camelCase too, and
    `GET /tools/{tool}/schema` is the source of truth for their names. Where a tool uses a different
    name internally (`dist_cutoff`, `bias_AA`, `i_pAE`), the API translates, in requests, responses and
    the pointers of errors, subfields of object settings included, so always use the schema's names.
    The internal name isn't an alias: sending it is 422 `unknown_field` at its own pointer, with the
    v1 name in `suggestion` (`/settings/dist_cutoff`, `suggestion: distCutoff`). The pipelines
    operations (`/pipelines/*`) translate the same way, by the tool of the node each name belongs to: a
    graph's node `settings` (and their subfields), `inputs`, `combination_primary_field` and
    `metadata.editableSettings`, a run's per-node `settings` overrides and `residuesByChain` picks,
    saved templates, and the fields their validation findings name (an internal name there is
    `unknown_field` at, for example, `/pipeline/nodes/fold/settings/dist_cutoff`). A custom tool
    (`user:`) or an `mcp://` tool keeps the names its own definition uses.

    **Requests.** Unknown fields are rejected with 422, except inside `settings`, where they are
    reported per field by the same validation.

    **Responses.** Success bodies are always JSON resources, never plain text or bare strings.
    The exceptions are file content and the CSV form of `getUsage` (`Accept: text/csv`). A create
    answers 201 with `Location`. A delete answers 204.
    An operation that hasn't finished its own work when it answers (a batch whose jobs are still
    being created, a zip still being built) answers 202 with a resource to poll. A job or run
    created with 201 still runs after the answer: poll it for its status. Two carried operations keep
    today's 200 while their work goes on: `commitMoleculeImport` (poll `getMoleculeImport`) and
    `cancelCustomToolBuild` (keep polling the build's version); each says so.

    **Errors.** Every error is `application/problem+json` (RFC 9457): see `Problem`. Switch on
    `code`, not on prose. Validation returns ALL problems at once in `errors`, each with a JSON
    Pointer (`pointer`) to the offending field when it's about one field; a problem with the request
    as a whole has none. A request whose fields are wrong is 422 `validation_failed`,
    and each `errors[]` entry has its own `code` (`required`, `invalid_option`, `out_of_range`,
    `not_supported`, ...). Where an operation here says "422 `not_supported` at `/field`", that is
    an `errors[]` entry inside a `validation_failed` problem, so switch on the top-level `code` for
    the kind of failure and on `errors[].code` for each field. `retryable` says whether retrying
    the same request can help. A few codes add a top-level field of their own (RFC 9457 extension
    members, listed on `Problem` with the code that sends each); ignore fields you don't know.
    Quote `requestId` to support.

    **Pagination.** Lists take `limit` (default 50, max 200) and `cursor`, and return `items` and
    `nextCursor`; a `POST` search takes them in its body. Two paged reads size a page their own way and
    take no `limit`: `getJobLogs` (`maxBytes`) and `listCustomToolBuildLogs` (one read of the build
    log). `nextCursor` is null on the last page. Cursors are opaque and bound to the
    caller, the endpoint, its filters and its order: resending it with different ones is 400
    `invalid_cursor`. A page can hold fewer than `limit` items while `nextCursor` still says there
    is more, so stop when `nextCursor` is null, not when a page is short. Lists are newest first
    unless the operation says otherwise: file listings are in path order, and usage is in the
    order of its groups. `GET /jobs` also takes `order=asc` for oldest first; creation time is the
    only sort key, because it is the only one the stores keep in order.

    **Idempotency.** Every operation that creates billable work or a credential takes an optional
    `Idempotency-Key` header. A retry with the same key and body returns the original response
    with `Idempotent-Replayed: true`. The same key with a different body is 422
    `idempotency_key_reused`. A retry while the original is still running is 409
    `idempotency_in_progress` with `Retry-After`. Keys are kept for at least 7 days. Requests
    refused before any work starts are not stored, so they can be corrected and resent with
    the same key. If the work may have started and then failed, a retry with the same key is 500
    `internal_error` with `Idempotent-Replayed: true`: look for what was created before sending a
    new key. A key belongs to its caller and its operation, so the same key on `POST /jobs` and
    `POST /pipelines/runs` is two different keys. `rerunJob` takes no key: it puts the same job back
    in the queue, so repeating it finds the job queued and is 409 `job_not_finished`.
    `buildCustomTool` keeps the Custom Tools API's own rules
    (see it). `submitAssay` replays its order, or answers 409 `idempotency_order_unavailable` when the
    key's order was placed but can't be read back (see it). SDK, CLI and MCP send a key on every such call.

    Credentials are the one exception to replaying the original response. A secret is stored only
    as a hash, so it cannot be returned twice. A retry of `createApiKey` creates nothing new, and
    answers 200 instead of 201, with `Idempotent-Replayed: true` and the key's metadata but no
    secret. That secret is gone: revoke the key and create another with a new `Idempotency-Key`.
    Check for the 200, not only for success, because that body has no secret to read.

    **Rate limits.** Each API key has two allowances. Polling (`GET /jobs/{jobId}`,
    `POST /jobs/search`, `GET /jobs/{jobId}/files`, `GET /jobs/{jobId}/files/content` and
    `GET /pipelines/runs/{runId}`) allows 3,600 requests a minute with bursts of up to 1,000. Every
    other operation shares 1,200 a minute with bursts of up to 500. Polling never draws on the other
    allowance, so a script waiting on results doesn't starve its own submits. Each allowance is a
    token bucket: a request takes one token, and tokens come back at that steady rate, up to the
    burst. A response carries the allowance its request drew on: `X-RateLimit-Limit` (the most the
    key can send at once, 1,000 or 500), `X-RateLimit-Remaining` (how many it can send right now)
    and `X-RateLimit-Reset` (seconds until the allowance is full again). Over it is 429
    `rate_limited` with `Retry-After`, the seconds until one more request fits; a refused request
    takes no token. Responses that never reach the limit carry no `X-RateLimit-*` headers: a 401,
    the 404 a caller outside the `api-v1` flag or an unknown path gets, and the keyless catalog
    reads. If the limit can't be checked, the request runs, without those headers. Separately, some
    reads run in bounded lanes so one caller can't slow everyone:
    a second list request from the same account while the first is still running is 429, and a
    full lane is 503 `service_unavailable` with `retryable: true` and `Retry-After`. A job's
    detail runs in a wider lane, four per account, and so do a `listJobs?name=` lookup and a
    `searchJobs` of up to 4 values. Use
    `POST /jobs/search` to check up to 200 jobs by id and 200 by name in one request rather than one
    `getJob` each.
    `GET /me` reports the general allowance as `limits.requestsPerMinute` (1,200), or null on a
    deployment that doesn't enforce per-key limits.

    **Attribution.** Tamarind's SDK, CLI and MCP send `X-Tamarind-Client-Channel`, and Tamarind's own
    agent also sends `X-Tamarind-Client-Agent`. They're for Tamarind's own clients, so they aren't
    operation parameters. They never grant, deny or price anything, but they label what gets created: a
    known channel is recorded as the `source` of a submitted job, batch or pipeline run as `/jobs` lists
    it (anything else records `api`), and a molecule group Tamarind's agent creates is filed as agent
    output, outside the default list of your uploads. A run's `source` under `/pipelines/runs` is a
    different field (`RunSource`: a production or a test run).

    **Long-running work.** Jobs are asynchronous. Poll `GET /jobs/{jobId}` and honour
    `pollAfterSeconds`, or use the SDK or CLI `wait`.

    **File settings.** A setting that takes a file (a `.pdb`, say) takes a path in your own
    workspace: an upload's `path` (`1UBQ.pdb`, `targets/1UBQ.pdb`), or a job's output, by the
    `ref` `listJobFiles` gives it (`{the job's folder}/designs/x.pdb`) or under the job's name
    (`my-job/designs/x.pdb`). For a name, a file at that literal path wins; otherwise it is your
    newest job of that name. A path that starts with your own email is the same file. A bare path
    only ever names your own files: another account's job folder, by its id or its name, reads as
    a folder of yours. `../`, an absolute path, `~`, a leading `.`, a backslash and a path under
    another account's email are 422 `validation_failed` with the error `file_not_accessible`,
    which doesn't yet say which setting it is (it has no `pointer`). `s3://` URIs, and an
    organization whose S3 integration covers its whole bucket, keep the rules today's API applies.
    Batch rows, `validateJob`, `estimateJob` and tools that run as a pipeline take the same paths.
    Validation checks that you may read a file, not that it exists. A job's `settings` and
    `validateJob`'s `normalized` show the stored key, under your email and with a job name's path
    as the job's folder: keep sending the path, not these.

    **One list for everything you run.** `GET /jobs` lists jobs, batches and pipeline runs, told
    apart by `kind` (`job`, `batch`, `pipeline`). By default it holds what you started, as the
    app's Jobs page does: single jobs, batches and pipeline runs, not the jobs inside a batch or a
    run (list those with `batchId=` or `pipelineRunId=`). `GET`, `cancel`, `rerun`, `results`,
    `files` and `delete` under `/jobs/{jobId}` take any of the three ids where it makes sense; each
    operation says which. A pipeline run's steps, node runs and molecules stay under
    `/pipelines/runs/{runId}`.

    **Statuses.** In `/jobs`, jobs, batches and pipeline runs share five statuses: `In Queue`, `Running`,
    `Complete`, `Stopped` and `Failed`. `Complete`, `Stopped` and `Failed` are final. `Failed`
    means it ended in an error (`stopReason.kind` `error`: the tool failed, the input was invalid,
    it ran out of memory, it hit the tool's own time limit, or our platform failed). `Stopped`
    means it was canceled or hit a limit you or your organization set (`kind` `canceled` or
    `limit`), or it stopped with no recorded reason (`kind` `unknown`). Both carry `stopReason`
    with a message, whether a retry could help, and a hint when there is one. A batch or a run is
    `Complete` once all of its work has finished, whatever the mix; its `counts` say how each part
    ended, and it is `Failed` only when the batch or run itself broke. `In Queue` contains a space,
    so encode it in a query string (`status=In%20Queue`). A run read under `/pipelines/runs`, pipeline
    nodes and custom tools keep the statuses they have today (`PipelineRunStatus` for runs).
  contact:
    name: Tamarind Support
    email: info@tamarind.bio
servers:
- url: https://api.tamarind.bio
  description: Production
- url: https://api-staging.tamarind.bio
  description: Staging
- url: https://{host}
  description: Customer-cloud deployment
  variables:
    host:
      default: api.tamarind.bio
      description: Your deployment's API host.
security:
- bearerAuth: []
- apiKeyHeader: []
tags:
- name: Identity
  description: Who the caller is, and what it can do and spend.
- name: API Keys
  description: List, rename and revoke keys, and make a service account's keys.
- name: Service Accounts
  description: Non-human identities owned by an organization.
- name: Organization
  description: Organization details, members and contract.
- name: Usage
  description: Compute and agent usage, at parity with the web usage portal.
- name: Tools
  description: Discover tools and their settings schemas.
- name: Jobs
  description: Run one tool on one input.
- name: Job Outputs
  description: Files, logs and zips a job produced.
- name: Batches
  description: Run one tool across many independent inputs.
- name: Files
  description: Your workspace files, used as tool inputs.
- name: Models
  description: Finetuned models. Training one is an ordinary job.
- name: Projects
  description: Group jobs, and share them with teammates.
- name: Project Notes
  description: A project's notes board.
- name: Pipelines
  description: Declarative multi-step workflows.
- name: Molecules
  description: The Molecules Database.
- name: Custom Tools
  description: Package your own container as a tool. Also behind the `custom-tools-public-api` flag.
- name: Assays
  description: Wet-lab orders with partner labs.
paths:
  /me:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    get:
      operationId: getMe
      x-build: 'merged (website#7529, #7828)'
      tags:
      - Identity
      summary: Get the caller's identity, role, limits and remaining budget
      description: |
        The one call an agent or script should make first. `role` is the caller's EFFECTIVE
        privilege for this credential. `asOf` is when the answer was made: organization and team
        totals can trail it by up to about 30 minutes.
      x-change: new
      x-replaces:
      - CLI probe of GET /jobs?limit=1
      - GET /compute-balance
      x-clients:
        sdk: me.get
        cli: auth status
        mcp: null
      x-mcp-excluded: The MCP keeps today's tool list, which has no tool for this.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /api-keys:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    get:
      operationId: listApiKeys
      x-build: 'merged (website#7636)'
      tags:
      - API Keys
      summary: List API keys
      description: |
        Your own keys: the original one, the ones you created, and revoked ones. Never a short-lived
        key a Tamarind service made for you, and never a secret or a hash.

        With `scope=org`, an organization admin's own key lists every key of every member and service
        account in the organization, as metadata. It acts as admin only when a live check with the
        sign-in provider says you administer your organization, your account and the organization,
        read again, still say so, the organization doesn't force MFA and its access isn't disabled,
        and the key isn't a service account's. Otherwise it's 403 `org_admin_required`, or
        `mfa_required` when the organization forces MFA. An admin can see members' keys here but
        can't change them.
      x-change: new
      x-replaces:
      - GET /service-accounts/list
      x-clients:
        sdk: apiKeys.list
        cli: keys list
        mcp: null
      x-mcp-excluded: Credential management stays out of agent tool lists.
      parameters:
      - $ref: '#/components/parameters/OwnershipScope'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
          headers:
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createApiKey
      x-build: 'merged (website#7636)'
      tags:
      - API Keys
      summary: Create a service account's API key
      description: |
        Makes a key for one of your organization's service accounts, named by `serviceAccountId`.
        Only an organization admin's own key can (the rule `listApiKeys` describes). An id that isn't
        one of your organization's service accounts is 404.

        A key never makes a key for its own owner. Without `serviceAccountId` (absent or null), or
        with a body that isn't a JSON object, this is 403 `session_required` before anything else in
        the body is checked: create your own keys on the website's keys page, which only a signed-in
        session can use, so a leaked key can't make a backup that outlives revoking it. A body that
        isn't valid JSON is 422.

        The response is the ONLY time the secret is returned. The secret is a UUID, as the keys page
        makes them, and only its SHA-256 hash is stored. Keys have no budget or expiry yet: a
        non-null `budget` or `expiresAt` is 422 `not_supported` at that field. An account holds at
        most 20 live created keys; past that it's 409 `api_key_limit`.
      x-change: new
      x-replaces:
      - POST /service-accounts/create
      - POST /service-accounts/rollKey
      x-clients:
        sdk: apiKeys.create
        cli: keys create
        mcp: null
      x-mcp-excluded: Credential management stays out of agent tool lists.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: A replay of an earlier request with this `Idempotency-Key`. The key exists, but its secret
            cannot be shown again, so there is no `secret` here. Revoke this key with `revokeApiKey` and create
            another.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '201':
          description: The key, including its secret. Shown once.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/ReplayedFailure'
        default:
          $ref: '#/components/responses/Error'
  /api-keys/{keyId}:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    - $ref: '#/components/parameters/KeyId'
    get:
      operationId: getApiKey
      x-build: 'merged (website#7636)'
      tags:
      - API Keys
      summary: Get an API key
      description: One of your own keys or, for an organization admin, one of your organization's service accounts'
        keys. A member's key is 404 here, even to an admin, who sees it only in `scope=org`.
      x-change: new
      x-replaces: []
      x-clients:
        sdk: apiKeys.get
        cli: keys get
        mcp: null
      x-mcp-excluded: Credential management stays out of agent tool lists.
      responses:
        '200':
          description: The key, without its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          headers:
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
