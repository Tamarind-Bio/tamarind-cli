    MoleculeOrigin:
      description: |-
        `Molecule.origin` — how this molecule came to exist.

        `type` is the `complexes.origin_type` provenance class and is ALWAYS present (an
        uploaded molecule is `user_import`). `jobId`/`jobType` name the job behind a tool-produced
        molecule, `jobType` being the tool; for a plain batch submission `jobId` is the batch's own
        id rather than the run inside it, and it is that id `GET /molecules?jobId=` takes. A split
        design batch carries one of its runs' ids instead, as do molecules ingested before batches
        began naming the parent.
        BOTH are null for an upload — an upload has no job, and
        we do not fabricate one. Read-only, projected from columns that already exist (no
        migration).
      properties:
        jobId:
          anyOf:
          - type: string
          - type: 'null'
          title: Jobid
          description: The job's bare stored id, without the `job_` or `batch_` prefix `/jobs` uses.
        jobType:
          anyOf:
          - type: string
          - type: 'null'
          title: Jobtype
        type:
          title: Type
          type: string
      required:
      - type
      - jobId
      - jobType
      type: object
    MoleculePage:
      description: |-
        The spec's `MoleculePage` — `{items, nextCursor}` plus search-mode fields.

        Deliberately NOT `Page[Molecule]`: the generic carries a field
        (`sortedServerSide`, the internal sheet's score-cap fallback flag) that the
        published contract doesn't declare and no public caller can act on. The
        envelope grew for `mode=sequence`, which is a CHUNKED scan and therefore has
        to say what a plain page cannot: which search actually ran, how far through
        the scan this page got, and, inside a slice holding more matches than one
        page, how many of that slice's matches have been delivered so far.
      properties:
        items:
          items:
            $ref: '#/components/schemas/Molecule'
          title: Items
          type: array
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
        retryAfterMs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retryafterms
        scanProgress:
          anyOf:
          - type: number
          - type: 'null'
          title: Scanprogress
        sliceDelivered:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slicedelivered
        sliceMatched:
          anyOf:
          - type: integer
          - type: 'null'
          title: Slicematched
        waiting:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Waiting
        waitReason:
          anyOf:
          - type: string
            enum:
            - busy
            - stuck
          - type: 'null'
          description: On a waiting page when a cursor from a `searchCaps=persist` request is followed without
            `searchCaps`. `busy` means transient load; `stuck` means a unit needs repeated retries.
      required:
      - items
      - nextCursor
      - mode
      - scanProgress
      type: object
    MoleculeSchema:
      description: The spec's `Schema`.
      properties:
        createdAt:
          title: Createdat
          type: string
          format: date-time
        fields:
          items:
            $ref: '#/components/schemas/MoleculeSchemaField'
          title: Fields
          type: array
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - fields
      - createdAt
      type: object
    MoleculeSchemaField:
      additionalProperties: false
      description: |-
        The spec's `SchemaField` — one field in a schema.

        A RequestModel (extra='forbid') even though it also appears on responses: the
        field names are already the wire spelling, so no alias generator is needed, and
        forbidding extras means a typo'd `chaintype` 422s at create instead of being
        silently stored in the JSONB and never enforced.

        `type` defaults to `string` per the spec. `chain` is one of its values — a
        chain field's `name` IS the chain id (`H`, `L`, `A`), matching the keys of a
        molecule's `entity` map.
      properties:
        chainTag:
          anyOf:
          - $ref: '#/components/schemas/ChainTag'
          - type: 'null'
        chainType:
          anyOf:
          - $ref: '#/components/schemas/ChainType'
          - type: 'null'
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        formula:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          description: 'Spreadsheet expression computing this field''s value per molecule. A field with a `formula`
            is COMPUTED: it is evaluated on read and never stored, so a caller may not supply a value for it.'
          title: Formula
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
          pattern: \S
        options:
          anyOf:
          - items:
              type: string
              pattern: \S
            maxItems: 500
            type: array
            minItems: 1
          - type: 'null'
          description: Allowed values for a `category` field. REQUIRED (non-empty) when `type` is `category`, and
            must be omitted for every other type.
          title: Options
        required:
          default: false
          title: Required
          type: boolean
        type:
          $ref: '#/components/schemas/MoleculeFieldType'
          default: string
        units:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Units
      required:
      - name
      type: object
      if:
        required:
        - type
        properties:
          type:
            const: category
      then:
        required:
        - options
        properties:
          options:
            type: array
      else:
        properties:
          options:
            type: 'null'
      dependentSchemas:
        formula:
          if:
            properties:
              formula:
                type: string
          then:
            properties:
              formula:
                pattern: \S
              type:
                not:
                  enum:
                  - chain
                  - category
              required:
                const: false
    MoleculeSchemaPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MoleculeSchema'
          title: Items
          type: array
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
      required:
      - items
      - nextCursor
      type: object
    MoleculeSortGroup:
      description: |-
        `Molecule.sortGroup` — the group this row was ORDERED BY, under `sortBy=groupName`.

        A molecule can be in many of your groups, so `sortBy=groupName` has to rank it by ONE
        of them: the alphabetically first EFFECTIVE (displayed) name across all your in-scope
        memberships. That group is what makes a group's rows arrive contiguously, and it is
        the group a grouped presentation should file the row under.

        It is served because the inline `groups` list cannot be trusted to contain it: that
        list is CAPPED and selected by membership recency, so a molecule in more groups than
        the cap can be ranked by a group the response never carries. Re-deriving the section
        by name-sorting `groups` then files the row under the wrong heading — silently, and
        with no way for a client to tell.

        `name` is the EFFECTIVE name (the rename label when one exists, else the canonical
        one) — the exact string the ordering compared, so a section header built from it
        cannot disagree with the position the row was served in. That makes it the
        `displayName`-preferring sibling of `Group.name`, which is always the raw canonical
        column; for a group that was never renamed the two are identical.
      properties:
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      type: object
    MoleculeType:
      description: |-
        The spec's `MoleculeType` — the kind of a molecule, and of the molecules a
        group holds.

        Value-identical to the internal `Modality` (the user-picked upload modality),
        which is the superset enum `complexes.type` is written from. Declared
        separately because it is a PUBLISHED contract: `Modality` is free to grow a
        value for an internal picker without that value silently becoming part of the
        public API. `public_types_match_modality` pins them equal today.
      enum:
      - protein
      - antibody
      - peptide
      - enzyme
      - small_molecule
      - nucleic_acid
      - small_molecule_binding_protein
      type: string
    Organization:
      type: object
      required:
      - slug
      - name
      - parentSlug
      properties:
        slug:
          type: string
        name:
          type: string
          description: The organization's slug for now.
        parentSlug:
          type:
          - string
          - 'null'
          description: The organization whose sub-organizations include this one. Null when none does.
    OrganizationMember:
      type: object
      required:
      - email
      - name
      - role
      - teams
      properties:
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
          description: The name the sign-in provider holds. Null when it has no membership for this person.
        role:
          type: string
          enum:
          - admin
          - member
          description: The person's role in the app, from the sign-in provider. Not what their API key may do (see
            `GET /me`).
        teams:
          type: array
          description: The names of your organization's teams that list this member.
          items:
            type: string
    OrganizationMemberPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'
        nextCursor:
          type:
          - string
          - 'null'
    OrganizationPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        nextCursor:
          type:
          - string
          - 'null'
    PipelineBinding:
      anyOf:
      - $ref: '#/components/schemas/PipelineMoleculeBinding'
      - $ref: '#/components/schemas/PipelineFileBinding'
    PipelineFileBinding:
      additionalProperties: false
      properties:
        file:
          description: A file path (relative to your user folder).
          title: File
          type: string
      required:
      - file
      type: object
    PipelineFlow:
      enum:
      - molecule
      - file
      type: string
    PipelineGroupBinding:
      type: object
      additionalProperties: false
      required:
      - group
      properties:
        chainMapping:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          description: Optional; defaults to identity. referenceChain -> yourChain — only needed for an existing
            template whose reference chain IDs differ from your molecule's (for an inline pipeline your molecule
            IS the reference, so omit it).
          title: Chainmapping
        group:
          description: An existing molecules group id.
          type: string
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Name for the group created from raw values (auto if omitted).
          title: Name
        residuesByChain:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: |-
            Residue selection for this input, in ONE of two shapes (auto-detected by the value: a reference chain maps to a range STRING => SIMPLE; a tool node id maps to a per-field OBJECT => ADVANCED):
            - SIMPLE fan-out: `{ referenceChain -> ranges }` (e.g. `{"A": "1-76"}`). ONE selection applied to every residue field this input feeds. Used when the template maker turned on 'Simplified residue selection'.
            - ADVANCED per-field: `{ toolNodeId -> { field -> { referenceChain -> ranges } } }` — pick residues independently per (tool node, field) that this input feeds; two settings on the same chain can differ. Advanced is the DEFAULT for newly created templates. Picks under each binding are merged across bindings into one map.
            Each range value is a string of space/comma-separated residue numbers and inclusive ranges, e.g. `"1-76"` or `"42 43 44 58 59"` or `"10-20,45,60-64"`.
          title: Residuesbychain
    PipelineIR:
      additionalProperties: true
      description: 'A pipeline IR document. Full schema (typed, versioned): https://tamarind.bio/schemas/pipeline-v1.json'
      properties: {}
      type: object
    PipelineInputSlot:
      properties:
        chainLabels:
          additionalProperties:
            type: string
          title: Chainlabels
          type: object
        chains:
          items:
            type: string
          title: Chains
          type: array
        flow:
          $ref: '#/components/schemas/PipelineFlow'
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        moleculeType:
          $ref: '#/components/schemas/MoleculeClass'
        node:
          description: The stable input-node id you bind to.
          title: Node
          type: string
        requiresStructure:
          title: Requiresstructure
          type: boolean
        residueFields:
          items:
            $ref: '#/components/schemas/ResidueField'
          title: Residuefields
          type: array
      required:
      - node
      - flow
      - moleculeType
      - requiresStructure
      - label
      - chains
      - chainLabels
      - residueFields
      type: object
    PipelineMoleculeBinding:
      description: |-
        A molecule binding. Provide the molecules ONE of these ways (exactly one):

        - `group` — an existing molecules group id, OR
        - `sequences` — raw protein or nucleic-acid sequences, OR
        - `smiles` — raw small-molecule SMILES, OR
        - `pdbs` / `sdfs` — paths (relative to your user folder) of already-uploaded structure files.

        For the raw-value forms the server creates a molecules group for you (optionally named via `name`),
        then binds it — so you don't have to pre-create one. The target input node declares the polymer
        type for sequences/PDBs; SMILES/SDFs require a small-molecule target.

        A binding with none of these, or more than one (a `file` included), is 422 `invalid` at
        `/bindings/{node}`.
      oneOf:
      - $ref: '#/components/schemas/PipelineGroupBinding'
      - $ref: '#/components/schemas/PipelineSequencesBinding'
      - $ref: '#/components/schemas/PipelineSmilesBinding'
      - $ref: '#/components/schemas/PipelinePdbsBinding'
      - $ref: '#/components/schemas/PipelineSdfsBinding'
    PipelineNodeRun:
      properties:
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
        id:
          title: Id
          type: string
        jobsComplete:
          title: Jobscomplete
          type: integer
        jobsTotal:
          title: Jobstotal
          type: integer
        label:
          title: Label
          type: string
        nodeId:
          description: The stable pipeline node id.
          title: Nodeid
          type: string
        nodeType:
          title: Nodetype
          type: string
        outputCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Outputcount
        outputGroup:
          anyOf:
          - type: string
          - type: 'null'
          description: The molecules group id this node run produced.
          title: Outputgroup
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startedat
        status:
          $ref: '#/components/schemas/PipelineNodeRunStatus'
        failureReason:
          type:
          - string
          - 'null'
          description: 'Why this ended as it did, as a short machine token such as `tool_error`, `no_output` or
            `filter_empty`. More tokens may be added, so handle one you don''t know. It can be set when nothing
            failed: `no_output` marks a node that ran correctly and passed nothing on. Null means unclassified,
            not fine.'
      required:
      - id
      - nodeId
      - label
      - nodeType
      - status
      - startedAt
      - completedAt
      - outputCount
      - jobsTotal
      - jobsComplete
      - outputGroup
      - failureReason
      type: object
    PipelineNodeRunMolecule:
      description: |-
        One molecule a node run produced.

        Read from the node run's passing outputs directly, NOT from `PipelineNodeRun.outputGroup` — which
        is why this exists. A node run's `outputGroup` is the group the node minted, and a node that enriches its
        inputs in place (scoring, structure prediction) mints none: its molecules never moved, so they
        stay in the group they came from and `outputGroup` is correctly null. A filter node has no group
        either — its survivors exist only as outputs. Reading results by group therefore reports
        "produced nothing" for exactly the node runs that produced the most interesting thing.
      properties:
        id:
          description: The molecule's id, the same one the `/molecules` endpoints use. `GET /molecules/{moleculeId}`
            describes this molecule in a richer shape, and `GET /molecules?nodeRunId=` this whole node run's outputs
            at once.
          type: string
        hasStructure:
          description: Whether this molecule has a structure. The FILES are not on this shape — read them from `GET
            /molecules?nodeRunId=...&groupId=...` or `GET /molecules/{moleculeId}`, whose `files` map carries a
            signed `downloadUrl` per artifact.
          title: Hasstructure
          type: boolean
        moleculeType:
          anyOf:
          - type: string
          - type: 'null'
          description: protein, small_molecule, nucleic_acid, …
          title: Moleculetype
        name:
          title: Name
          type: string
        scores:
          additionalProperties: true
          description: 'Per-tool scores keyed by tool, e.g. `{"protenix": {"ipSAE_AB": 0.62, "pDockQ_AB": 0.41}}`.
            Metric names are case-sensitive. To THRESHOLD or RANK on one of these, use `GET /molecules?nodeRunId=`
            with `filter=protenix.ipSAE_AB:gte:0.5` and `sortBy=protenix.ipSAE_AB` — this endpoint returns them
            but does not filter or sort by them.'
          title: Scores
          type: object
        sequence:
          anyOf:
          - type: string
          - type: 'null'
          description: The ':'-joined chain sequences.
          title: Sequence
      required:
      - id
      - name
      - moleculeType
      - sequence
      - scores
      - hasStructure
      type: object
    PipelineNodeRunMoleculePage:
      properties:
        inputGroupExact:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether inputGroupId contains exactly the molecules this node processed. False means it is
