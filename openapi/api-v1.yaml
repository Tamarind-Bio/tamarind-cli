    Budget:
      type: object
      required:
      - scope
      - name
      - unit
      - used
      - limit
      - remaining
      - periodEndsAt
      properties:
        scope:
          type: string
          enum:
          - organization
          - team
          - member
          - apiKey
          - model
          - contract
          description: '`organization`, `team`, `member` or `model` for now. Keys have no budgets yet and the contract
            isn''t listed here (see `getOrganizationContract`), so `apiKey` and `contract` don''t occur.'
        name:
          type:
          - string
          - 'null'
          description: The team or model name. On a `member` budget, the team whose per-member cap applies to you, or
            null when your own cap or the organization's default applies. Null for the organization's budget.
        unit:
          type: string
          enum:
          - weightedHours
        used:
          type: number
        limit:
          type:
          - number
          - 'null'
        remaining:
          type:
          - number
          - 'null'
          description: '`limit` less `used`, and never below zero.'
        periodEndsAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Always null for now.
