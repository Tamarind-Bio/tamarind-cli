              original request's. Not returned by `getJob`.
            items:
              $ref: '#/components/schemas/Diagnostic'
    SubmitFileBatchRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - tool
      - source
      properties:
        kind:
          type: string
          enum:
          - batch
          description: Always `batch` for a batch. Required, so a batch is never inferred from the shape of `settings`.
        tool:
          type: string
          maxLength: 200
          pattern: \S
        name:
          $ref: '#/components/schemas/JobName'
          description: The batch's name. Optional; generated when omitted. One you already use is 409
            `job_name_conflict`, and `Starter_Kit` is reserved (422 `invalid_format`). Each job is named from
            `source.nameColumn`, or `<name>-<row index>`.
        source:
          $ref: '#/components/schemas/BatchSource'
        sharedSettings:
          type: object
          additionalProperties: true
          description: Merged into every row. A row's own value wins. With them, the rows are at most 64 MiB of JSON
            (422 `out_of_range` at `/sharedSettings`).
        inputs:
          type: array
          description: One molecule-input list per row, for tools that take them. Not built yet on a batch, so any
            value is 422 `not_supported` at `/inputs`; put the values in the rows' settings.
          items:
            type: array
            items:
              $ref: '#/components/schemas/PipelineToolInput'
        toolVersion:
          type: string
          minLength: 1
          pattern: \S
        modelId:
          type: string
          minLength: 1
          pattern: \S
        projectId:
          type: string
          minLength: 1
          pattern: \S
          description: A project you can use. One that doesn't resolve for you is never silently dropped, whether or
            not your organization requires projects. Submit and estimate answer 422 `validation_failed` with an
            `invalid_option` error at `/projectId`; validate reports a failed `project` check with that error.
        maxRuntimeSeconds:
          type: integer
          minimum: 1
          description: Stop each job after this long. No business maximum; a number a job can't store is 422
            `out_of_range`.
        weightedHoursBudget:
          type: number
          exclusiveMinimum: 0
          description: A budget for the whole batch. Only Premium members of an organization can set one, and not
            above the organization's hard limit when it has one (`not_supported` or `out_of_range` at this field).
            No business maximum; a number a job can't store is 422 `out_of_range`.
        gpu:
          type: string
          description: Request a specific GPU type for every job. Premium only. Not built yet, so any value is 422 at
            `/gpu`.
        lowPriority:
          type: boolean
          default: false
          description: Run every job at the low-priority tier, as for `submitJob`. Whether you may ask is checked at
            submit (422 `validation_failed`, with the reason at `/lowPriority`); a row whose job can't run at the
            tier is a row problem, which fails the batch after the 202. Optional.
        toolLifetimeEtag:
          type: string
          minLength: 1
          maxLength: 2048
          description: A custom tool version's `lifetimeEtag`. If the tool was deleted and its name reused since,
            submit is 409 `tool_lifetime_changed`, and validate reports a failed `access` check with an error at
            `/toolLifetimeEtag` with the same code.
          pattern: \S
        atomCount:
          type: number
          exclusiveMinimum: 0
          description: Atoms of an uploaded input, when `settings` hold only its path. The estimate uses a default
            without it, and it is not checked against the file.
        csvRowCount:
          type: number
          exclusiveMinimum: 0
          description: CSV rows of an uploaded input, when `settings` hold only its path. The estimate uses a default
            without it, and it is not checked against the file.
        smilesRowCount:
          type: number
          exclusiveMinimum: 0
          description: SMILES rows of an uploaded input, when `settings` hold only its path. The estimate uses a
            default without it, and it is not checked against the file.
        binderSeqRowCount:
          type: number
          exclusiveMinimum: 0
          description: Binder sequence rows of an uploaded input, when `settings` hold only its path. The estimate
            uses a default without it, and it is not checked against the file.
    SubmitInlineBatchRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - tool
      - settings
      properties:
        kind:
          type: string
          enum:
          - batch
          description: Always `batch` for a batch. Required, so a batch is never inferred from the shape of `settings`.
        tool:
          type: string
          maxLength: 200
          pattern: \S
        name:
          $ref: '#/components/schemas/JobName'
          description: The batch's name. Optional; generated when omitted. One you already use is 409
            `job_name_conflict`, and `Starter_Kit` is reserved (422 `invalid_format`).
        settings:
          type: array
          minItems: 1
          description: One settings object per job, at most 30,000 (422 `out_of_range` at `/settings` beyond that;
            `validateJob` checks at most 1,000 and reports more as a failed verdict). With `sharedSettings` merged
            in, the rows are at most 64 MiB of JSON (422 `out_of_range`).
          items:
            type: object
            additionalProperties: true
        sharedSettings:
          type: object
          additionalProperties: true
          description: Merged into every row. A row's own value wins.
        names:
          type: array
          minItems: 1
          description: Job names, one per row of `settings` (422 `invalid_length` at `/names` otherwise). None may
            repeat or be the batch's `name` (422 `conflict` at `/names/<n>`); one you already use is a row problem,
            which fails the batch after the 202. Generated when omitted, as `<name>-<row index>`.
          items:
            $ref: '#/components/schemas/JobName'
        inputs:
          type: array
          description: One molecule-input list per row, for tools that take them. Not built yet on a batch, so any
            value is 422 `not_supported` at `/inputs` (a failed verdict on `validateJob`); put the values in each
            row's settings.
          items:
            type: array
            items:
              $ref: '#/components/schemas/PipelineToolInput'
        toolVersion:
          type: string
          minLength: 1
          pattern: \S
        modelId:
          type: string
          minLength: 1
          pattern: \S
        projectId:
          type: string
          minLength: 1
          pattern: \S
          description: A project you can use. One that doesn't resolve for you is never silently dropped, whether or
            not your organization requires projects. Submit and estimate answer 422 `validation_failed` with an
            `invalid_option` error at `/projectId`; validate reports a failed `project` check with that error.
        maxRuntimeSeconds:
          type: integer
          minimum: 1
          description: Stop each job after this long. No business maximum; a number a job can't store is 422
            `out_of_range`.
        weightedHoursBudget:
          type: number
          exclusiveMinimum: 0
          description: A budget for the whole batch. Only Premium members of an organization can set one, and not
            above the organization's hard limit when it has one (`not_supported` or `out_of_range` at this field).
            No business maximum; a number a job can't store is 422 `out_of_range`.
        gpu:
          type: string
          description: Request a specific GPU type for every job. Premium only. Not built yet, so any value is 422 at
            `/gpu`.
        lowPriority:
          type: boolean
          default: false
          description: Run every job at the low-priority tier, as for `submitJob`. Whether you may ask is checked at
            submit (422 `validation_failed`, with the reason at `/lowPriority`); a row whose job can't run at the
            tier is a row problem, which fails the batch after the 202. Optional.
        toolLifetimeEtag:
          type: string
          minLength: 1
          maxLength: 2048
          description: A custom tool version's `lifetimeEtag`. If the tool was deleted and its name reused since,
            submit is 409 `tool_lifetime_changed`, and validate reports a failed `access` check with an error at
            `/toolLifetimeEtag` with the same code.
          pattern: \S
        atomCount:
          type: number
          exclusiveMinimum: 0
          description: Atoms of an uploaded input, when `settings` hold only its path. The estimate uses a default
            without it, and it is not checked against the file.
        csvRowCount:
          type: number
          exclusiveMinimum: 0
          description: CSV rows of an uploaded input, when `settings` hold only its path. The estimate uses a default
            without it, and it is not checked against the file.
        smilesRowCount:
          type: number
          exclusiveMinimum: 0
          description: SMILES rows of an uploaded input, when `settings` hold only its path. The estimate uses a
            default without it, and it is not checked against the file.
        binderSeqRowCount:
          type: number
          exclusiveMinimum: 0
          description: Binder sequence rows of an uploaded input, when `settings` hold only its path. The estimate
            uses a default without it, and it is not checked against the file.
    SubmitJobRequest:
      type: object
      required:
      - tool
      - settings
      additionalProperties: false
      description: One job. The same body is accepted by `submitJob`, `validateJob` and `estimateJob`.
      properties:
        kind:
          type: string
          enum:
          - job
          default: job
          description: '`job` (the default) for one job. Send `batch` to run the tool across many inputs.'
        tool:
          type: string
          description: A `name` from `listTools`.
          maxLength: 200
          pattern: \S
        settings:
          type: object
          additionalProperties: true
          description: The tool's settings. See `getToolSchema`. For a file setting, send a workspace `path`, a job
            file's `ref`, or a job's file under the job's name (see File settings in the introduction).
        name:
          $ref: '#/components/schemas/JobName'
          description: Optional. Generated when omitted.
        toolVersion:
          type: string
          minLength: 1
          pattern: \S
          description: A custom tool version. Defaults to the published one.
        modelId:
          type: string
          minLength: 1
          pattern: \S
          description: Run this finetuned model. `tool` must be its `inferenceTool`.
        projectId:
          type: string
          minLength: 1
          pattern: \S
          description: A project you can use. One that doesn't resolve for you is never silently dropped, whether or
            not your organization requires projects. Submit and estimate answer 422 `validation_failed` with an
            `invalid_option` error at `/projectId`; validate reports a failed `project` check with that error.
        inputs:
          type: array
          description: Named molecule inputs, for tools that take them. Not priced by `estimateJob` (422 there).
          items:
            $ref: '#/components/schemas/PipelineToolInput'
        maxRuntimeSeconds:
          type: integer
          minimum: 1
          description: Stop the job after this long. No business maximum; a number a job can't store is 422
            `out_of_range`.
        weightedHoursBudget:
          type: number
          exclusiveMinimum: 0
          description: Stop the job if it would use more than this. Only Premium members of an organization can set
            one, and not above the organization's hard limit when it has one (`not_supported` or `out_of_range` at
            this field). No business maximum; a number a job can't store is 422 `out_of_range`.
        gpu:
          type: string
          description: Request a specific GPU type. Premium only. Not built yet, so any value is 422 at `/gpu`.
        lowPriority:
          type: boolean
          default: false
          description: 'Run at the low-priority tier: 20% off the weighted hours, no completion guarantee (they target finishing within a week), and a job not started within 7 days stops with no charge. For T2 GPU tools in Premium organizations
            that have it enabled. When it isn''t available for this caller or this job, the request is refused
            with 422 `validation_failed` and an error at `/lowPriority` whose `code` is the reason, never run at full
            price. Optional.'
        toolLifetimeEtag:
          type: string
          minLength: 1
          maxLength: 2048
          description: A custom tool version's `lifetimeEtag`. If the tool was deleted and its name reused since,
            submit is 409 `tool_lifetime_changed`, and validate reports a failed `access` check with an error at
            `/toolLifetimeEtag` with the same code.
          pattern: \S
        atomCount:
          type: number
          exclusiveMinimum: 0
          description: Atoms of an uploaded input, when `settings` hold only its path. The estimate uses a default
            without it, and it is not checked against the file.
        csvRowCount:
          type: number
          exclusiveMinimum: 0
          description: CSV rows of an uploaded input, when `settings` hold only its path. The estimate uses a default
            without it, and it is not checked against the file.
        smilesRowCount:
          type: number
          exclusiveMinimum: 0
          description: SMILES rows of an uploaded input, when `settings` hold only its path. The estimate uses a
            default without it, and it is not checked against the file.
        binderSeqRowCount:
          type: number
          exclusiveMinimum: 0
          description: Binder sequence rows of an uploaded input, when `settings` hold only its path. The estimate
            uses a default without it, and it is not checked against the file.
    SubmitPipelineGraphRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - bindings
      - pipeline
      properties:
        bindings:
          additionalProperties:
            $ref: '#/components/schemas/PipelineBinding'
          description: One binding per input slot, keyed by the slot's input-node id. Bindings may be defined as
            an array of sequences, smiles, or sdf/pdb files (uploaded using `POST /files`), or an existing molecule
            group id (created using /molecules/groups below).
          maxProperties: 2048
          title: Bindings
          type: object
        name:
          description: Name for this pipeline. When `runName` is omitted, the run's JobName is derived from this
            (spaces removed, a random suffix appended for uniqueness).
          maxLength: 200
          minLength: 1
          title: Name
          type: string
          pattern: \S
        pipeline:
          description: 'INLINE mode: a full pipeline IR. Mutually exclusive with `templateId`.'
          $ref: '#/components/schemas/PipelineIR'
        runName:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          description: Optional explicit JobName for THIS run. Spaces are replaced with underscores; used verbatim
            otherwise (no random suffix). Omit to auto-generate a unique JobName from `name`.
          title: Runname
        settings:
          anyOf:
          - additionalProperties:
              additionalProperties: true
              type: object
            type: object
          - type: 'null'
          description: 'Per-node settings `{nodeId: {settingKey: value}}`. Chain and residue selections may be supplied
            here alongside ordinary settings. For existing templates, ordinary settings must be editable. Chain
            labels use reference space and follow chainMapping; inline residue selections must agree with overlapping
            binding selections.'
          title: Settings
        source:
          anyOf:
          - $ref: '#/components/schemas/RunSource'
          - type: 'null'
          default: production
          description: Run source; defaults to production.
        projectId:
          anyOf:
          - type: string
          - type: 'null'
          description: Organization project id to stamp on jobs this run creates.
          title: Project
    SubmitPipelineRequest:
      description: |-
        Body for `submitPipeline`, `validatePipeline` and `estimatePipeline` (identical shape). Two modes,
        discriminated by which of `pipeline` / `templateId` you send — exactly one is required. Neither is 422
        `required` at `/pipeline`, both is 422 `invalid` at `/templateId`, and `version` with `pipeline` is 422
        `unknown_field` at `/version`:

        - INLINE: send `pipeline` (a full IR) — submit creates a template you own (unpublished) and runs
          it; every setting is yours to set in the IR. `name` names both the created pipeline and the run.
        - REFERENCE: send `templateId` (+ optional `version`) — run an existing template; `settings`
          overrides are limited to each tool node's `metadata.editableSettings`. `name` names the run.

        `name` is required and doubles as the run's display name (deduplicated per pipeline). `bindings` is
        required in both modes. `validate` runs the SAME body without executing/persisting.
      example:
        bindings:
          target:
            group: 3f8a1c2e-5b7d-4e9f-a1b2-c3d4e5f6a7b8
        name: binder-design v2 experiment
        settings:
          design:
            numSequences: 32
        templateId: 3f2a1c9e-8b7d-4e6f-a1b2-c3d4e5f60718
        version: v1
        projectId: proj_…
      oneOf:
      - $ref: '#/components/schemas/SubmitPipelineGraphRequest'
      - $ref: '#/components/schemas/SubmitPipelineTemplateRequest'
    SubmitPipelineTemplateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - bindings
      - templateId
      properties:
        bindings:
          additionalProperties:
            $ref: '#/components/schemas/PipelineBinding'
          description: One binding per input slot, keyed by the slot's input-node id. Bindings may be defined as
            an array of sequences, smiles, or sdf/pdb files (uploaded using `POST /files`), or an existing molecule
            group id (created using /molecules/groups below).
          maxProperties: 2048
          title: Bindings
          type: object
        name:
          description: Name for this pipeline. When `runName` is omitted, the run's JobName is derived from this
            (spaces removed, a random suffix appended for uniqueness).
          maxLength: 200
          minLength: 1
          title: Name
          type: string
          pattern: \S
        runName:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          description: Optional explicit JobName for THIS run. Spaces are replaced with underscores; used verbatim
            otherwise (no random suffix). Omit to auto-generate a unique JobName from `name`.
          title: Runname
        settings:
          anyOf:
          - additionalProperties:
              additionalProperties: true
              type: object
            type: object
          - type: 'null'
          description: 'Per-node settings `{nodeId: {settingKey: value}}`. Chain and residue selections may be supplied
            here alongside ordinary settings. For existing templates, ordinary settings must be editable. Chain
            labels use reference space and follow chainMapping; inline residue selections must agree with overlapping
            binding selections.'
          title: Settings
        source:
          anyOf:
          - $ref: '#/components/schemas/RunSource'
          - type: 'null'
          default: production
          description: Run source; defaults to production.
        templateId:
          description: 'REFERENCE mode: an existing template id to run.'
          minLength: 1
          type: string
          pattern: \S
        version:
          anyOf:
          - minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          description: 'REFERENCE mode: a version handle e.g. ''v1''; absent -> default.'
          title: Version
        projectId:
          anyOf:
          - type: string
          - type: 'null'
          description: Organization project id to stamp on jobs this run creates.
          title: Project
    Tool:
      type: object
      required:
      - name
      - displayName
      - description
      - modalities
      - functions
      - finetune
      - custom
      - requiredSettings
      - timingPredictability
      - docsUrl
      - outputTypes
      properties:
        name:
          type: string
          description: The exact value to send as `tool`.
        outputTypes:
          type: array
          items:
            type: string
          description: What the tool declares it produces, in the catalog's own vocabulary, molecular (pdb, sequence,
            sdf, smiles) and otherwise (csv, score, cif, ...). A few are compound, like `pdb-list`, so match by
            containment. Empty means the tool declares nothing (unknown), not that it produces nothing.
        displayName:
          type: string
          description: The catalog's display name, or `name` when it has none.
        description:
          type: string
        modalities:
          type: array
          description: The catalog's categories for this tool, as stored. `getToolFacets` lists them lower-cased, and
            the `modality` filter matches them in any case.
          items:
            type: string
        functions:
          type: array
          description: The catalog's tags for this tool, as stored. `getToolFacets` lists them lower-cased, and the
            `function` filter matches them in any case.
          items:
            type: string
        finetune:
          type: boolean
          description: True when submitting this tool trains a model.
        custom:
          type: boolean
          description: True on your organization's custom tools, which `listTools` lists with `custom=true`;
            false on built-in ones.
        requiredSettings:
          type: array
          description: The settings every submit must send, by name. A setting needed only for some tasks or under
            a condition, one the platform fills a default for, and one behind a flag that's off for you aren't
            here. Use `getToolSchema` for everything else.
          items:
            type: string
        timingPredictability:
          type:
          - string
          - 'null'
          enum:
          - predictable
          - variable
          - unpredictable
          - null
          description: Always null for now. Nothing records it yet.
        docsUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Always null for now. Nothing records it yet.
    ToolFacets:
      type: object
      required:
      - modalities
      - functions
      properties:
        modalities:
          type: array
          items:
            type: object
            required:
            - name
            - label
            - description
            - toolCount
            properties:
              name:
                type: string
              label:
                type: string
                description: The curated taxonomy's label for this value; `name` when the taxonomy doesn't define it.
              description:
                type:
                - string
                - 'null'
                description: The curated taxonomy's description; null when it has none.
              toolCount:
                type: integer
                description: How many tools you can see with this value, what the filter returns. Every value the
                  curated taxonomy defines is listed, so this can be 0.
        functions:
          type: array
          items:
            type: object
            required:
            - name
            - label
            - description
            - toolCount
            properties:
              name:
                type: string
              label:
                type: string
                description: The curated taxonomy's label for this value; `name` when the taxonomy doesn't define it.
              description:
                type:
                - string
                - 'null'
                description: The curated taxonomy's description; null when it has none.
              toolCount:
                type: integer
                description: How many tools you can see with this value, what the filter returns. Every value the
                  curated taxonomy defines is listed, so this can be 0.
    ToolPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        nextCursor:
          type:
          - string
          - 'null'
    ToolOutputColumn:
      type: object
      required:
      - name
      - type
      - displayName
      - description
      - units
      - tasks
      properties:
        name:
          type: string
        type:
          type: string
          description: The column's declared type (pdb, sequence, sdf, smiles, number, string, ...); `string` when it
            declares none.
        displayName:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        units:
          type:
          - string
          - 'null'
        tasks:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The tasks that write this column. Null when the declaration doesn't gate it by task, which
            doesn't promise every task fills it; read `byTask.*.generates` for what a task produces.
    ToolOutputContract:
      type: object
      required:
      - produces
      - columns
      - taskType
      - mainCSV
      - byTask
      properties:
        produces:
          type: array
          items:
            type: string
            enum:
            - pdb
            - sequence
            - sdf
            - smiles
          description: The molecular representations the output carries, as a column of the results table or as a
            file written beside it, including any echoed from the input, so a scoring tool can list one. For a tool
            whose output depends on its task, the union over every task.
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ToolOutputColumn'
          description: The main results table's columns, the metrics to filter or rank on. For a tool whose output
            depends on its task, the union over every task's main table; a column with `tasks` appears only in
            those tasks.
        taskType:
          type:
          - string
          - 'null'
          description: The tool's top-level declaration, e.g. `generate` (creates a molecule), `score` (annotates
            one), `structure-prediction`. For a tool with `byTask`, read the task's own entry instead.
        mainCSV:
          type:
          - string
          - 'null'
          description: The main results table's file name, as the tool declares it at the top level.
        byTask:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/ToolOutputTaskContract'
          description: For a tool whose output depends on its task setting, one entry per task value, and
            authoritative for the task you set. Each entry is complete; a task that doesn't redeclare `mainCSV` or
            `taskType` inherits the top-level value. Null for a tool whose output doesn't depend on its task.
    ToolOutputTaskContract:
      type: object
      required:
      - mainCSV
      - taskType
      - generates
      properties:
        mainCSV:
          type:
          - string
          - 'null'
        taskType:
          type:
          - string
          - 'null'
        generates:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - pdb
            - sequence
            - sdf
            - smiles
          description: What this task creates fresh. Empty for a scoring task whose table still echoes its input;
            null when the tool declares nothing for this task.
    ToolRecommendation:
      description: |-
        A ranked recommendation, or a reasoned refusal to make one.

        `abstain` is a normal outcome, not an error: it means no tool could be defended
        for this request, and `summary` says why. Callers should handle it as an answer.
      properties:
        abstain:
          description: '`false` — `tools` is ranked, best first, and the first entry is what to run. `true` — no
            tool could be justified, `tools` is empty, and `summary` says what was missing. An abstention is an
            answer, not an error.'
          title: Abstain
          type: boolean
        summary:
          description: 'A short explanation of the ranking, for a person to read. It also carries the caveats: whether
            the benchmark had measured your target, whether anything measured this kind of task at all, and what
            the service could not establish.'
          title: Summary
          type: string
        tools:
          description: Ranked best-first, and only the tools worth running — usually two to four, not the whole
            catalogue. Empty when `abstain` is true.
          items:
            $ref: '#/components/schemas/RecommendedTool'
          title: Tools
          type: array
        abstainReason:
          type:
          - string
          - 'null'
          enum:
          - needs_more_detail
          - not_a_supported_task
          - not_available_to_your_account
          - catalog_not_configured
          - ranking_failed
          - classification_failed
          - no_recommendation
          - null
          description: Why no tool was recommended; null when one was. `needs_more_detail`, `summary` names the
            missing fact (which interface this is, say); answer it and ask again. `not_available_to_your_account`,
            the tools that fit aren't available to you.
        retryable:
          type: boolean
          description: Whether asking again may give a recommendation, after adding the missing detail for
            `needs_more_detail` or unchanged for a transient failure. False when a tool was recommended.
      required:
      - abstain
      - summary
      - tools
      - abstainReason
      - retryable
      type: object
    ToolRecommendationRequest:
      additionalProperties: false
      description: Ask which tool to run for a stated task.
      properties:
        inputs:
          description: Your input sequence components, to tailor the recommendation to your specific inputs. Optional,
            but they are what let the recommendation rest on a measurement of your own target rather than an overall
            ranking.
          items:
            $ref: '#/components/schemas/RecommendationInput'
          maxItems: 32
          title: Inputs
          type: array
        prompt:
          description: What you want to do, in your own words — e.g. 'predict the structure of this antibody-antigen
            complex'.
          maxLength: 20000
          minLength: 1
          title: Prompt
          type: string
          pattern: \S
      required:
      - prompt
      type: object
    ToolSchema:
      type: object
      required:
      - tool
      - version
      - schema
      - example
      - outputs
      - outputTypes
      - outputContract
      properties:
        tool:
          type: string
          description: The tool's name; a custom tool's as you sent it, which is what a submit sends.
        version:
          type:
          - string
          - 'null'
          description: The tool's settings schema version, as jobs record it. For a custom tool, the version this
            schema is. Null when the tool has none.
        outputTypes:
          type: array
          items:
            type: string
          description: What the tool declares it produces, as on `Tool`. Empty means the tool declares nothing
            (unknown), not that it produces nothing.
        outputContract:
          oneOf:
          - $ref: '#/components/schemas/ToolOutputContract'
          - type: 'null'
          description: What the results look like. Null when the tool declares no output contract.
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema 2020-12 for `settings`. Conditional fields are expressed with `if`/`then`.
        example:
          type: object
          additionalProperties: true
          description: A `settings` object built from each setting's example or default, for one task branch. File settings
            carry placeholder names until you upload your own.
        outputs:
          type: array
          description: The result tables this tool declares, the main one first. A `{JobName}` in a path is `*`, so each
            `glob` matches the file a job writes. Empty when the tool declares none.
          items:
            type: object
            required:
            - glob
            - description
            properties:
              glob:
                type: string
              description:
                type:
                - string
                - 'null'
    UpdateApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          maxLength: 64
          description: The new name. Control characters are removed and the ends trimmed; nothing left is 422
            `invalid_format`. Absent or null renames nothing.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Not supported yet. Null or absent; a value is 422 `not_supported`.
        budget:
          description: Not supported yet. Null or absent; a value is 422 `not_supported`.
          oneOf:
          - $ref: '#/components/schemas/ApiKeyBudget'
          - type: 'null'
    UpdateCustomToolRequest:
      additionalProperties: false
      properties:
        autoPublish:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether successful builds become the default version automatically. Omit or pass null to
            leave it unchanged.
          title: Autopublish
        cpu:
          anyOf:
          - maximum: 8.0
            minimum: 1.0
            type: integer
          - type: 'null'
          description: Number of CPU cores allocated to each run. Omit or pass null to leave it unchanged.
          title: Cpu
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          description: Short explanation of the tool. Omit or pass null to leave it unchanged; pass an empty string
            to clear it.
          title: Description
        displayName:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Human-readable name shown in the UI. Omit or pass null to leave it unchanged; pass an empty
            string to clear it.
          title: Displayname
        estTime:
          anyOf:
          - type: string
            pattern: ^$|^[0-9]+:0*[0-5]?[0-9]:0*[0-5]?[0-9]$
          - type: 'null'
          description: Estimated runtime in H:M:S format, for example "0:1:0". Minutes and seconds must be 0-59.
            Omit or pass null to leave it unchanged; pass an empty string to clear it.
          title: Esttime
        functions:
          anyOf:
          - items:
              maxLength: 200
              minLength: 1
              type: string
              pattern: \S
            maxItems: 100
            type: array
          - type: 'null'
          description: Short capability labels used for discovery. Omit or pass null to leave them unchanged; pass
            an empty list to clear them.
          title: Functions
        gpuType:
          anyOf:
          - enum:
            - None
            - T4
            - L4
            - L40S
            - A10
            - A100
            type: string
          - type: 'null'
          description: 'GPU allocated to each run: "None", T4, L4, L40S, or A100. Omit or pass null to leave it
            unchanged. A10 is retired: it is still accepted and runs on L4.'
          title: Gputype
        homeDiskGi:
          anyOf:
          - maximum: 50.0
            minimum: 1.0
            type: integer
          - type: 'null'
          description: Writable home-disk capacity in GiB. Omit or pass null to leave it unchanged.
          title: Homediskgi
        memory:
          anyOf:
          - enum:
            - 8Gi
            - 12Gi
            - 24Gi
            - 32Gi
            - 48Gi
            - 64Gi
            - 90Gi
            - 96Gi
            - 180Gi
            type: string
          - type: 'null'
          description: Memory allocated to each run. Omit or pass null to leave it unchanged.
          title: Memory
        paperUrl:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          description: Related HTTP or HTTPS publication URL. Omit or pass null to leave it unchanged; pass an empty
            string to clear it.
          title: Paperurl
        tags:
          anyOf:
          - items:
              maxLength: 200
              minLength: 1
              type: string
            maxItems: 100
            type: array
          - type: 'null'
          description: Search and discovery tags. Omit or pass null to leave them unchanged; pass an empty list
            to clear them. Each tag is trimmed, and blank or repeated tags are dropped.
          title: Tags
      type: object
    UpdateEntryResponse:
      description: |-
        `resourceTagging` comes back only when the request carried `links`. An update that did
        not touch them reports no tagging rather than an empty one.
      properties:
        entry:
          anyOf:
          - $ref: '#/components/schemas/BoardEntry'
          - type: 'null'
        meta:
          anyOf:
          - $ref: '#/components/schemas/BoardMeta'
          - type: 'null'
        resourceTagging:
          anyOf:
          - $ref: '#/components/schemas/BoardResourceTagging'
          - type: 'null'
      required:
      - entry
      - meta
      type: object
    UpdateMetadataRequest:
      additionalProperties: false
      description: |-
        The spec's `UpdateMoleculeRequest` — a PARTIAL patch across the MOLECULE and
        MEMBERSHIP tenancy grains, applied ATOMICALLY (all-or-nothing, one transaction: if any
        field's write fails, none of them persist).

        Every field is OPTIONAL and independent: an ABSENT field is left untouched, which
        is DISTINCT from a field sent as `null` (which CLEARS it, where the grain allows).
        The fields and the grain each writes:

          * `properties` (MOLECULE grain) — merge scalar annotations into the molecule's
            metadata. Only the keys you send change; a key set to `null` REMOVES that key
            (an absent key and a null key mean different things, so the raw dict carries
            intent). Tool score-run entries are written by tools and are not editable here;
            when the molecule's group is schema-bound the MERGED result must still satisfy
            it. This is the properties-only PATCH's behaviour, unchanged.
          * `source` (MOLECULE grain) — the id of the PARENT molecule this one was derived
            from; `null` clears it. The parent must be visible in YOUR scope, or the write
            is refused (404) — you cannot point a molecule at a parent you cannot see.
          * `fileId` (MOLECULE + MEMBERSHIP grain) — a structure file to associate as this
            membership's primary; `null` clears it. The file must already be attached to
            this molecule in your tenant.
          * `name` (MEMBERSHIP grain) — rename this molecule's per-group display name. A
            name already used by another molecule in the same group is a 409 conflict (the
            `UNIQUE (group_id, name)` constraint), never a 500.

        The membership-grained writes (`name`, `fileId`) target the molecule's MOST RECENT
        in-scope group membership, matching how the group-less by-id read resolves labels.
      properties:
        fileId:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          title: Fileid
        metadata:
          description: DEPRECATED alias for `properties`, kept for callers written against the original v1 shape.
            Send `properties` instead; if both are sent, `properties` wins.
          additionalProperties: true
          type: object
        name:
          maxLength: 200
          minLength: 1
          type: string
          pattern: \S
        properties:
          additionalProperties: true
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      type: object
    UpdateMoleculeSchemaRequest:
      additionalProperties: false
      description: |-
        The spec's `UpdateSchemaRequest` — partial. `fields` REPLACES the whole
        list; omitted keys are left unchanged.
      properties:
        fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/MoleculeSchemaField'
            maxItems: 200
            minItems: 1
            type: array
          - type: 'null'
          title: Fields
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          title: Name
      type: object
    UpdateNoteResponse:
      properties:
        note:
          anyOf:
          - $ref: '#/components/schemas/BoardNote'
          - type: 'null'
      required:
      - note
      type: object
    UpdateNotesResponse:
      description: |-
        `lanes` comes back only when the request carried a `lanes` operation, and then it is
        the whole ordered set — a new lane gets an id you could not have predicted, and a removed
        one leaves `laneOrder` rewritten.
      properties:
        lanes:
          anyOf:
          - items:
              $ref: '#/components/schemas/BoardLane'
            type: array
          - type: 'null'
          title: Lanes
        meta:
          anyOf:
          - $ref: '#/components/schemas/BoardMeta'
          - type: 'null'
      required:
      - meta
      type: object
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/ProjectName'
        description:
          type:
          - string
          - 'null'
          description: At most 2,000 characters once trimmed (an emoji counts as two). Null or empty clears it.
        color:
          $ref: '#/components/schemas/ProjectColor'
        isArchived:
          type: boolean
          description: Archive or restore it. `listProjects` leaves out archived projects, so keep the `id` to restore
            one.
        addMembers:
          type: array
          maxItems: 50
          description: People to share a `personal` project with. Ignored on an `org` project, which is open to
            the whole organization. An entry that isn't an email address is skipped.
          items:
            type: string
            format: email
        removeMembers:
          type: array
          maxItems: 50
          description: People to stop sharing a `personal` project with. Ignored on an `org` project.
          items:
            type: string
            format: email
    UpdatedProject:
      allOf:
      - $ref: '#/components/schemas/Project'
      - type: object
        required:
        - failedAdds
        properties:
          failedAdds:
            type: array
            description: Members who could not be added. The rest of the update still applied. Send them again to
              retry.
            items:
              type: string
              format: email
    UploadFileInlineRequest:
      type: object
      additionalProperties: false
      required:
      - path
      - contentBase64
      properties:
        path:
          type: string
          description: Where to store it, e.g. `targets/1abc.pdb`.
          pattern: \S
        contentType:
          type: string
          maxLength: 255
          pattern: '^[!-~][ -~]*$'
          description: The file's media type, e.g. `chemical/x-pdb`, in printable ASCII. Stored with the file. For a
            signed URL, `upload.headers` then carries it as `Content-Type`.
        contentBase64:
          type: string
          contentEncoding: base64
          maxLength: 4194304
          description: The file itself, up to 3 MiB before encoding, which is 4,194,304 characters of base64.
    UploadFileMultipartRequest:
      type: object
      additionalProperties: false
      required:
      - path
      - sizeBytes
      - multipart
      properties:
        path:
          type: string
          description: Where to store it, e.g. `targets/1abc.pdb`.
          pattern: \S
        contentType:
          type: string
          maxLength: 255
          pattern: '^[!-~][ -~]*$'
          description: The file's media type, e.g. `chemical/x-pdb`, in printable ASCII. Stored with the file. For a
            signed URL, `upload.headers` then carries it as `Content-Type`.
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 5368709120000
          description: At most 1,000 parts of 5 GiB, 5,368,709,120,000 bytes.
        multipart:
          type: boolean
          const: true
    UploadFileRequest:
      description: 'Send `contentBase64` to store the file now, `sizeBytes` to get a signed URL, or `sizeBytes`
        with `multipart: true` for a multipart transfer.'
      oneOf:
      - $ref: '#/components/schemas/UploadFileInlineRequest'
      - $ref: '#/components/schemas/UploadFileSignedRequest'
      - $ref: '#/components/schemas/UploadFileMultipartRequest'
    UploadFileSignedRequest:
      type: object
      additionalProperties: false
      required:
      - path
      - sizeBytes
      properties:
        path:
          type: string
          description: Where to store it, e.g. `targets/1abc.pdb`.
          pattern: \S
        contentType:
          type: string
          maxLength: 255
          pattern: '^[!-~][ -~]*$'
          description: The file's media type, e.g. `chemical/x-pdb`, in printable ASCII. Stored with the file. For a
            signed URL, `upload.headers` then carries it as `Content-Type`.
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 5000000000
          description: 'At most 5 GB, the limit for one PUT. Above that, set `multipart: true`.'
    UploadMoleculesRequest:
      additionalProperties: false
      description: The spec's `UploadRequest`.
      properties:
        chainMapping:
          additionalProperties:
            $ref: '#/components/schemas/ChainMappingEntry'
          title: Chainmapping
          type: object
        groupId:
          maxLength: 200
          minLength: 1
          title: Groupid
          type: string
          pattern: \S
        molecules:
          items:
            $ref: '#/components/schemas/MoleculeInput'
          maxItems: 1000
          minItems: 1
          title: Molecules
          type: array
      required:
      - groupId
      - molecules
      type: object
    UploadMoleculesResponse:
      properties:
        groupId:
          title: Groupid
          type: string
        groupName:
          anyOf:
          - type: string
          - type: 'null'
          title: Groupname
        importId:
          title: Importid
          type: string
        moleculeCount:
          title: Moleculecount
          type: integer
        moleculeIds:
          items:
            type: string
          title: Moleculeids
          type: array
        status:
          const: pending
          default: pending
          title: Status
          type: string
      required:
      - groupId
      - groupName
      - moleculeIds
      - moleculeCount
      - importId
      - status
      type: object
    UsagePage:
      type: object
      required:
      - metric
      - from
      - to
      - total
      - items
      - nextCursor
      - asOf
      properties:
        metric:
          type: string
          description: The `metric` asked for.
        from:
          type: string
          format: date-time
          description: The start of the range, a Pacific month start.
        to:
          type: string
          format: date-time
          description: The end of the range, exclusive. Without a `to` in the request, when the reads finished
            (rounded up to the second), but never past the end of the month they read.
        total:
          type: number
          description: The total for the whole query, not just this page.
        items:
          type: array
          description: One per group with a value above zero, in the order of their dimension values.
          items:
            type: object
            required:
            - dimensions
            - value
            properties:
              dimensions:
                type: object
                additionalProperties:
                  type: string
                description: 'One entry per `groupBy` value, e.g. `{"tool": "alphafold", "month": "2026-10"}`.'
              value:
                type: number
        nextCursor:
          type:
          - string
          - 'null'
        asOf:
          type: string
          format: date-time
          description: The oldest refresh time of the rows read. The time of the request when no rows were read.
    ValidatePipelineTemplateRequest:
      additionalProperties: false
      description: |-
        Body for `POST /pipelines/templates/{templateId}/validate` — validate the TEMPLATE ITSELF (no run bindings),
        against its own `metadata.defaultGroup` reference groups. `{}` is valid (validate the default
        version).
      properties:
        version:
          anyOf:
          - minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          description: A version handle e.g. 'v1' to validate; absent -> default.
          title: Version
      type: object
    ValidationCheck:
      type: string
      enum:
      - passed
      - failed
      - skipped
      description: '`skipped` means this family of check didn''t run: it doesn''t apply to the operation, or
        validation stopped at an earlier refusal (on `validateAssay`, `settings` and `name` are skipped when `access`
        failed).'
    ValidationReport:
      type: object
      required:
      - valid
      - checks
      - errors
      - warnings
      properties:
        valid:
          type: boolean
        checks:
          type: object
          description: Which families of check ran. Each one maps to a way `submitJob` can refuse.
          required:
          - settings
          - access
          - name
          - project
          - budget
          properties:
            settings:
              $ref: '#/components/schemas/ValidationCheck'
            access:
              $ref: '#/components/schemas/ValidationCheck'
            name:
              $ref: '#/components/schemas/ValidationCheck'
            project:
              $ref: '#/components/schemas/ValidationCheck'
            budget:
              $ref: '#/components/schemas/ValidationCheck'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        normalized:
          type: object
          additionalProperties: true
          description: 'Present only when valid, for reading. On `validateJob`, the settings as a submit would take
            them, with defaults filled in and molecule references resolved. On `validateAssay`, `{assayType, provider,
            modality, settings, sequenceCount}`. Send your original request, not these.'
        name:
          type: string
          description: The name you sent, trimmed and checked. Present only when the request included `name`; a name
            the submit would generate isn't predicted. Absent when the name was blank or is what failed.
