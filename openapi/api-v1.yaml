  /usage:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    get:
      operationId: getUsage
      x-build: 'merged (website#7638)'
      tags:
      - Usage
      summary: Query compute and agent usage
      description: |
        One query over the stored monthly usage the web usage portal reads. Choose a `metric`, a range
        of Pacific months and up to three `groupBy` dimensions. Send `Accept: text/csv` for CSV. A CSV
        is one page, like the JSON form, and its next cursor is in the `X-Next-Cursor` header (also set
        on JSON pages). Items are in the order of their dimension values, months oldest first.

        Nothing is recomputed: a figure the stored rows don't hold exactly is refused, not estimated.
        Rows from before a breakdown was stored (every row before 2026 has no weighted hours, and the
        source, custom-tool and pipeline breakdowns came later) make a query that needs that breakdown
        422 `not_supported`, naming the months.

        `total` counts each job once. With `team`, a member in several teams appears under each and one
        in none under none. `project` groups cover tagged usage only. Groups whose value is zero are
        left out. `asOf` is the OLDEST refresh time of the rows read, so it never claims fresher
        figures than the stalest row holds; with no rows, it's the time of the request. Use
        `refreshUsage` to request newer figures. A failed read is 503, never a quietly smaller total.

        `scope=org` is every current member's usage, including months from before they joined, as the
        portal shows it. Only a caller who sees shared budgets on `GET /me` may ask for it (the
        organization's service account, or any member when the organization shares its budget with
        members); anyone else, a personal account included, is 403 `forbidden`, not their own usage
        instead. While your membership of the organization isn't confirmed yet, it's 503
        `service_unavailable` with `Retry-After`, as on `/organization`. A second `scope=org` query from the same account while one is still running is 429.
      x-change: reshaped
      x-replaces:
      - GET /usage-statistics
      - GET /getUsageStatistics
      - GET /getOrgMonthlyUsage
      - GET /getMonthlyJobsUsed
      x-clients:
        sdk: usage.get
        cli: usage
        mcp: null
      x-mcp-excluded: The MCP keeps today's tool list, which has no tool for this.
      parameters:
      - name: metric
        in: query
        description: '`hours` (GPU hours), `weightedHours` (what budgets bill against) or `jobs`. `dollars`, `llmTokens`
          and `llmCost` are 422 `not_supported` for now.'
        schema:
          type: string
          enum:
          - hours
          - weightedHours
          - jobs
          - dollars
          - llmTokens
          - llmCost
          default: weightedHours
      - name: groupBy
        in: query
        description: |
          Dimensions to break down by, comma-separated (`groupBy=tool,month`) or repeated
          (`groupBy=tool&groupBy=month`): both forms are read, and every value counts. `user`, `month` and `team` combine
          with at most ONE stored breakdown: `tool`, `gpu`, `project`, `source`, `customTool` or
          `pipeline`, or `tool` and `gpu` together. Each breakdown stores only some metrics: `gpu` has
          `hours` and `jobs`; `tool` and `gpu` together, `hours`; `source`, `customTool` and `pipeline`,
          `weightedHours` and `jobs`; `tool` and `project`, all three. Anything else is 422
          `not_supported`, and so are `day`, `apiKey`, `model`, `agent` and `campaignMode`, which aren't
          stored. `user` and `team` need `scope=org`. A dimension named twice is 422.
        style: form
        explode: false
        schema:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
            - tool
            - user
            - team
            - project
            - gpu
            - source
            - apiKey
            - customTool
            - pipeline
            - month
            - day
            - model
            - agent
            - campaignMode
      - name: from
        in: query
        description: Start of the range, inclusive, with a time zone offset. Must be the start of a Pacific month,
          such as `2026-11-01T00:00:00-07:00`; anything else is 422, never rounded. Defaults to the start of the
          current Pacific month.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: End of the range, exclusive, with a time zone offset. Must be the start of a Pacific month after
          `from`; anything else is 422. Defaults to now.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/OwnershipScope'
      - name: organizationSlug
        in: query
        description: A sub-organization to report on. 422 `not_supported` for now, until a rule for reading a
          sub-organization's usage is decided.
        schema:
          type: string
      - name: apiKeyId
        in: query
        description: Only usage attributed to this key. 422 `not_supported` for now, because jobs don't record their
          key yet.
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Usage rows.
          headers:
            X-Next-Cursor:
              $ref: '#/components/headers/NextCursor'
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePage'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
