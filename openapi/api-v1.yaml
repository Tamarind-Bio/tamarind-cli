                propertyName: kind
                mapping:
                  job: '#/components/schemas/SubmitJobRequest'
                  batch: '#/components/schemas/SubmitBatchRequest'
            example:
              kind: job
              tool: alphafold
              name: ubiquitin-fold
              settings:
                sequence: MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG
                numRecycles: 3
      responses:
        '201':
          description: The job, readable immediately. For a tool that runs as a pipeline behind the scenes, the
            pipeline run it started (`kind` `pipeline`).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SubmittedJob'
                - $ref: '#/components/schemas/SubmittedPipelineRun'
                discriminator:
                  propertyName: kind
                  mapping:
                    job: '#/components/schemas/SubmittedJob'
                    pipeline: '#/components/schemas/SubmittedPipelineRun'
        '202':
          description: The batch, readable immediately. For `kind` `batch`, its jobs are created in the background;
            otherwise it's the batch the job's tool split it into. For a tool that runs as a pipeline behind the
            scenes, it's the run (`kind` `pipeline`, `In Queue`) when the pipeline engine hasn't recorded it yet.
          headers:
