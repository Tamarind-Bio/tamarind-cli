          - type: 'null'
          title: Columnmapping
      type: object
    Contract:
      type: object
      required:
      - terms
      - dollarsPerWeightedHour
      properties:
        terms:
          type: array
          description: Every stored term, newest start first; a term with no readable start is last.
          items:
            type: object
            required:
            - startAt
            - endAt
            - isActive
            - contractedHours
            - promoHours
            - rolloverHours
            - effectiveHours
            - usedHours
            - remainingHours
            properties:
              startAt:
                type:
                - string
                - 'null'
                format: date-time
                description: Pacific midnight on the term's first day. Null when the stored date is unreadable.
              endAt:
                type:
                - string
                - 'null'
                format: date-time
                description: Pacific midnight after the term's last day (exclusive). Null when the stored date is
                  unreadable.
              isActive:
                type: boolean
              contractedHours:
                type: number
              promoHours:
                type: number
              rolloverHours:
                type: number
              effectiveHours:
                type: number
              usedHours:
                type:
                - number
                - 'null'
                description: Null when nothing records the usage, such as an active term whose stored figure is
                  unreadable or an ended term with no final usage.
              remainingHours:
                type:
                - number
                - 'null'
                description: Null whenever `usedHours` is.
