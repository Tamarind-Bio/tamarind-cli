      description: One problem with a request. The same shape in `Problem.errors` and in validation reports.
      required:
      - code
      - severity
      - detail
      properties:
        code:
          type: string
          description: Stable. For example `required`, `unknown_field`, `out_of_range`, `invalid_option`, `invalid_residue`,
            `conditional_not_met`, `file_not_accessible`, `file_not_found`.
        severity:
          type: string
          enum:
          - error
          - warning
        pointer:
          type: string
          description: JSON Pointer to the field in the request body, e.g. `/settings/17/numRecycles`. Absent when
            the problem concerns the whole request.
        detail:
          type: string
        allowedValues:
          type: array
          items: {}
        allowedRange:
          type: object
          properties:
            minimum:
              type: number
            maximum:
              type: number
        suggestion:
          type: string
          description: A likely intended value, e.g. the closest valid field name.
        node:
          type: string
          description: In pipeline validation, the node concerned.
        field:
          type: string
          description: In pipeline validation, the setting at fault on `node`.
    DownloadLink:
      type: object
      required:
      - url
      - expiresAt
      - sizeBytes
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        sizeBytes:
          type:
          - integer
          - 'null'
          description: Null when the size is not known.
    DuplicatePipelineTemplateRequest:
      additionalProperties: false
      description: |-
        Body for `POST /pipelines/templates/{templateId}/duplicate`.

        Both fields are optional; `{}` is a valid body.

        VERSIONS ONLY — never the working draft. A draft is mutable and unversioned, so there is no
        stable thing for an API client to reference ("the draft as of now" isn't expressible) and it
        may be a teammate's mid-edit graph. So `version` omitted resolves to the published version if
        one is pinned, else the latest SAVED version. This is the one place the API deliberately
        differs from the in-app menu, which forks the draft because the user can see it.
      example:
        name: binder-design v2 experiment
        version: v2
      properties:
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Name
        version:
          anyOf:
          - minLength: 1
            type: string
            pattern: \S
          - type: 'null'
          description: A version handle e.g. 'v3'; absent -> default.
          title: Version
      type: object
    Estimate:
      type: object
      required:
      - jobCount
      - perJobRuntimeSeconds
      - weightedHours
      - notes
      description: |
        A job's or a batch's runtime and cost, before running: exactly what today's estimator
        returns, the same figures the submit budget gate checks. No ranges, elapsed time or
        per-stage breakdown yet; fields are added (which isn't a breaking change) when the
        estimator produces them.
      properties:
        jobCount:
          type: integer
          description: How many jobs this would create, including fan-out. For a batch over 500 rows, the count for
            its first 500 rows scaled to all of them.
        perJobRuntimeSeconds:
          type:
          - number
          - 'null'
          description: The estimated runtime of one job, averaged across a batch. Null means unknown, when
            the estimator has no runtime for the tool; it is never 0 for that.
        weightedHours:
          type:
          - number
          - 'null'
          description: The total weighted (compute) hours, the figure your budget is checked against at
            submit, at the low-priority price when the request sets `lowPriority`, and for a batch over 500 rows
            scaled from its first 500. Null on the Free tier, with a note saying so.
        notes:
          type: array
          description: Caveats a user should see, such as that a batch was priced from its first 500 rows. Empty
            when there are none.
          items:
            type: string
    FileEntry:
