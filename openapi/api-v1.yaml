        If applicable, put residue selections inside each binding's `residuesByChain` for the tools that require hotspots / designed residues. Two shapes, auto-detected by the value: SIMPLE `{chain: ranges}` (a chain maps to a range string) fans one selection to every residue field the input feeds; ADVANCED `{toolNodeId: {field: {chain: ranges}}}` (a node maps to a per-field object) picks per (tool node, field). An inline submit is stamped Simplified/Advanced from the shape you send; picks under each binding are merged. Chain and residue selections can also be supplied in tool-node `settings` or top-level per-node `settings`. Reference chain labels follow `chainMapping`. Conflicting inline and binding residue selections are rejected.

        The engine records a run a moment after accepting it, so submit reads it back for up to about 4.5 seconds. The 201 is then the run as `GET /pipelines/runs/{runId}` reads it, which can already be `running` with node runs. If it isn't readable yet, the 201 is the accepted run: `queued`, with no node runs. Poll `GET /pipelines/runs/{runId}` for progress. Problems found while the engine resolves the run are reported there as a failed run.

        The run records the channel it came from (`api`, or the `X-Tamarind-Client-Channel` you declare), as `POST /jobs` does. A `projectId` you can't use is 422 at `/projectId`, never silently dropped. An `Idempotency-Key` is this operation's own, separate from `POST /jobs`; today's `POST /pipelines/submit` is the same operation, so a key and request first sent there replay that run here. A replay whose run isn't readable yet is 409 `idempotency_in_progress` (retry shortly); one whose run you can no longer read is 404.

        Choose from your pipelines or example templates to view example scripts.
