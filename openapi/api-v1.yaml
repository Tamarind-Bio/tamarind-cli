      description: One `/jobs` list item, told apart by `kind`.
      oneOf:
      - $ref: '#/components/schemas/JobSummary'
      - $ref: '#/components/schemas/Batch'
      - $ref: '#/components/schemas/PipelineRunItem'
      discriminator:
        propertyName: kind
        mapping:
          job: '#/components/schemas/JobSummary'
          batch: '#/components/schemas/Batch'
          pipeline: '#/components/schemas/PipelineRunItem'
