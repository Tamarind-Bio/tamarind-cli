    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    post:
      operationId: searchMolecules
      x-build: 'merged (website#7627, #7723)'
      tags:
      - Molecules
      summary: Search Molecules
      description: 'Search molecules using the same filters as `GET /molecules`, with the same names (`groupId`,
        `jobId`), plus `jobName`, which only this body takes. Send repeated filters as arrays. Maximum request body:
        4 MB.'
      x-change: carried
      x-replaces:
      - POST /molecules/search
      x-clients:
        sdk: molecules.search
        cli: molecules search
        mcp: searchMolecules
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                cursor:
                  anyOf:
                  - maxLength: 4096
                    minLength: 1
                    type: string
                    pattern: \S
                  - type: 'null'
                  description: Omit for your first request. To get the next page, copy the `nextCursor` value from
                    the response into this parameter and send another request with the same filters. Repeat until
                    `nextCursor` is null, even if a page is empty.
                  title: Cursor
                dir:
                  default: desc
                  description: '`asc`: ascending order. `desc`: descending order.'
                  pattern: ^(asc|desc)$
                  title: Dir
                  type: string
                filter:
                  anyOf:
                  - items:
                      type: string
                      pattern: \S
                    maxItems: 32
                    type: array
                  - type: 'null'
                  description: 'String in format `field:operator:value`. "field" can be user-uploaded properties
                    or tool scores (in format `tool-id.score`). Supported operators: `gt`, `gte`, `lt`, `lte`, `eq`,
                    `neq`, `iequals`, `includes`, `in` (any of a `|`-separated set of at most 64 members, e.g. `stage:in:lead|backup`),
                    `exists` (written `field:exists`, no value). Append `:jobId` to a tool score (not with `in`
                    or `exists`) to filter only from tool scores from a particular job. Repeat `filter` to combine
                    conditions; a molecule must match all of them. See `/tools` endpoint for list of output scores
                    for each tool.'
                  title: Filter
                groupId:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  description: Limit results to one group by id (from `GET /molecules/groups`), the same filter as
                    `GET /molecules?groupId=`. Today's name `group` is refused with a hint to use `groupId`.
                  title: Group Id
                jobId:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  description: Limit results to one job's input and output molecules by ID. For batches, use the
                    batch's ID to retrieve molecules for all jobs within the batch. Takes the `job_` or `batch_` id
                    from `/jobs`, or the bare stored id.
                  title: Jobid
                jobName:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  description: List input and output molecules by job or batch name.
                  title: Jobname
                limit:
                  default: 50
                  description: Maximum number of items to return in one page.
                  maximum: 200.0
                  minimum: 1.0
                  title: Limit
                  type: integer
                mode:
                  default: default
                  description: 'Choose what `search` matches: `sequence` searches amino acid chains by exact or
                    subsequence match, while `sequenceMatch=exact_smiles` matches a small molecule''s stored SMILES
                    exactly. `default`/`name` match molecule, property, and score names.'
                  pattern: ^(default|name|sequence)$
                  title: Mode
                  type: string
                moleculesPerGroup:
                  anyOf:
                  - maximum: 25.0
                    minimum: 1.0
                    type: integer
                  - type: 'null'
                  description: Maximum molecules per group across the whole result set. Requires `sortBy=groupName`;
                    unavailable with `mode=sequence`.
                  title: Moleculespergroup
                nodeRunId:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  description: Limit results to one pipeline step's output molecules by node run ID (retrieve ID
                    using `/pipelines/runs/{runId}`).
                  title: Noderunid
                owner:
                  anyOf:
                  - maxLength: 320
                    type: string
                  - type: 'null'
                  description: Only groups whose owner equals this value, as the owners list returns it.
                  title: Owner
                scope:
                  default: mine
                  description: '`mine` (the default) shows molecules in groups you created; `org` shows everything
                    across your organization.'
                  pattern: ^(mine|org)$
                  title: Scope
                  type: string
                search:
                  anyOf:
                  - maxLength: 4000
                    type: string
                  - type: 'null'
                  description: Enter a search term to find molecule names, user-uploaded property names, or tool
                    score names. To search chains instead, set `mode=sequence` and enter a sequence or exact SMILES.
                    Use at least 3 characters for sequence searches or when searching without a group.
                  title: Search
                searchCaps:
                  anyOf:
                  - maxLength: 1024
                    type: string
                  - type: 'null'
                  description: Comma-separated list of capabilities. The response's `caps` field lists the values
                    the API supports from your request.
                  title: Searchcaps
                sequence:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  description: Match molecules containing this amino-acid subsequence in any chain (case-insensitive,
                    at least 3 characters).
                  title: Sequence
                sequenceMatch:
                  default: subsequence
                  description: 'Only available with `mode=sequence`: `subsequence` matches part of an amino-acid
                    chain; `exact` matches a whole amino-acid chain; `exact_smiles` matches a whole small-molecule
                    chain exactly, including case.'
                  pattern: ^(subsequence|exact|exact_smiles)$
                  title: Sequencematch
                  type: string
                sortBy:
                  default: added
                  description: Sort by `id`, `added`, `type`, `groupName`, a property, or a score such as `alphafold.ptm`.
                    Scores use the tool's "best run." `groupName` keeps each group together; use `moleculesPerGroup`
                    to limit its results.
                  maxLength: 200
                  title: Sortby
                  type: string
                tags:
                  anyOf:
                  - items:
                      type: string
                      pattern: \S
                    maxItems: 32
                    type: array
                  - type: 'null'
                  description: Limit results to molecules carrying this tag. Repeat it to require several tags.
                  title: Tags
                type:
                  anyOf:
                  - items:
                      description: |-
                        The spec's `MoleculeType` — the kind of a molecule, and of the molecules a
                        group holds.

                        Value-identical to the internal `Modality` (the user-picked upload modality),
                        which is the superset enum `complexes.type` is written from. Declared
                        separately because it is a PUBLISHED contract: `Modality` is free to grow a
                        value for an internal picker without that value silently becoming part of the
                        public API. `public_types_match_modality` pins them equal today.
                      enum:
                      - protein
                      - antibody
                      - peptide
                      - enzyme
                      - small_molecule
                      - nucleic_acid
                      - small_molecule_binding_protein
                      title: MoleculeType
                      type: string
                    maxItems: 32
                    type: array
                  - type: 'null'
                  description: Filter by molecule type, such as `protein`, `small_molecule`, or `nucleic_acid`.
                  title: Type
                view:
                  default: full
                  description: Return full molecules (default) or molecule cards.
                  enum:
                  - full
                  - card
                  title: View
                  type: string
              title: PublicMoleculeSearchRequest
              type: object
        required: true
      responses:
