  /jobs:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    get:
      operationId: listJobs
      x-build: 'merged (website#7530, #7550, #7558, #7562, #7584, #7640, #7790, #7795, #7852, #7975)'
      tags:
      - Jobs
      summary: List your jobs, batches and pipeline runs, newest first
      description: |
        Returns summaries without `settings`. Each item has a `kind`: `job`, `batch` or `pipeline`.
        The default list is what you started: single jobs, batches and pipeline runs, but not the
        jobs inside a batch or a run. `batchId=` lists a batch's jobs and `pipelineRunId=` a run's.
        Pipeline runs are listed only for a caller in an organization, and benchmark runs never.

        Jobs and batches are listed by their display time, pipeline runs by their start (when they
        were submitted), merged newest first under one cursor; `order=asc` reads oldest first. A
        single-tool run is listed as its job, not as a run, as the app shows it.

        `kind`, `status`, `tool`, `search` and `source` filter each page, so a page can hold fewer
        than `limit` items while `nextCursor` still says there's more; stop when `nextCursor` is
        null. A page also stops early when counting its batches has read a lot of rows. With
        `search` or `source`, a page reads at most 1,000 rows across jobs and runs, then ends short
        with a `nextCursor` to continue. `tool` matches jobs and batches only, since a run has no
        single tool. `source` matches a run only if the run recorded its channel.

        A value `kind`, `status`, `source`, `order` or `scope` doesn't take is 400
        `validation_failed`, and so are these, not built yet, rather than a silently wider list:
        `projectId`, `apiKeyId`, `createdAfter` and `createdBefore`. Past its 15-second deadline a
        read is 503 `jobs_dependency_unavailable`.

        Organization scope (decision 74). With
        `scope=org` the list is the organization's jobs and batches, not pipeline runs (those list
        under `listPipelineRuns?scope=org`), as today's API shows them: every member's when the
        organization shares within itself or you're its admin or its service account, otherwise
        only yours. `createdBy` is another member's email and needs `scope=org` (400 without it); a
        member whose jobs you can't see is 403 `forbidden`. Pages walk the members in turn (you
        first, then the others by email), each page newest first. `name=` works with both.
        `batchId`, `pipelineRunId`, `search`, `source`, `order=asc` and `kind=pipeline` can't be
        combined with `scope=org` yet (400). `batchId=` of another member's batch needs no
        `scope=org`: it lists the batch's jobs as today's batch read does, each admitted on its own.

        Today's list options. Each one is answered by the same reader today's `GET /jobs` uses, so it
        lists what today's API lists.

        - `includeSubjobs=true`: your list, or a member's with `createdBy`, holds every batch's own
          jobs as well, each with its `batchId`. With `scope=org` alone the list is unchanged, because
          today's organization list never had a batch's jobs. Pipeline runs aren't in it.
        - `batchName=`: the jobs of every batch with that exact name in the scope you ask for, which
          is yours, one member's (`scope=org&createdBy=`) or the organization's (`scope=org`). A name
          with nothing you can see answers an empty page. Today's organization batch read keeps only
          rows the organization's own list would show, and a batch's jobs almost never are, so with
          `scope=org` alone it is mostly empty, as it is today.
        - `allMatches=true`, with `name` and `scope=org` and no `createdBy`: every member's match,
          newest first, rather than only the newest. It is still one page with no `nextCursor`.

        With `includeSubjobs` or `batchName`, `kind`, `status` and `tool` filter each page. `name`,
        `batchId`, `pipelineRunId`, `search`, `source`, `order=asc` and `kind=pipeline` can't be
        combined with them (400). `allMatches` anywhere else is 400.
      x-change: reshaped
      x-replaces:
      - GET /jobs
      - GET /v2/jobs
      - GET /v2/org/jobs
      - GET /jobs?projectId=
      - GET /jobs?jobName=
      - GET /v2/jobs/by-name/{jobName}
      - GET /getBatchJobs
      - GET /jobs (Type=batch rows)
      - GET /jobs?jobName=<batch>
      - GET /jobs?includeSubjobs=
      - GET /jobs?batch=
      - GET /jobs?jobName=&organization=true
      x-replaces-via:
        GET /jobs?jobName=: name
        GET /v2/jobs/by-name/{jobName}: name
        GET /getBatchJobs: batchId
        GET /jobs (Type=batch rows): kind
        GET /jobs?jobName=<batch>: name
        GET /jobs?includeSubjobs=: includeSubjobs
        GET /jobs?batch=: batchName
        GET /jobs?jobName=&organization=true: allMatches
      x-clients:
        sdk: jobs.list
        cli: jobs list
        mcp: listJobs
      parameters:
      - name: name
        in: query
        description: Exact name of a job, batch or pipeline run (a run by its own name). Returns at most one
          item, the newest match that passes the other filters (every member's match with `allMatches`), and no
          `nextCursor`; a `cursor` with it is 400 `invalid_cursor`. At most 2,048 bytes. It can't be combined with
          `batchId`, `pipelineRunId`, `batchName` or `includeSubjobs`. A job a
          pipeline run's step launched is found by its name too, yours or a member's with `createdBy`, as today's
          `jobName=` finds it, though no list shows it (list a run's jobs with `pipelineRunId`). With `scope=org`
          alone, or `allMatches`, it isn't, since today's organization read doesn't serve one.
        schema:
          type: string
          maxLength: 2048
      - name: kind
        in: query
        description: Only this kind. With `batchId` or `pipelineRunId`, only `job`; the two can't be combined.
        schema:
          type: string
          enum:
          - job
          - batch
          - pipeline
      - $ref: '#/components/parameters/StatusFilter'
      - name: tool
        in: query
        description: Exact tool name. Leaves pipeline runs out.
        schema:
          type: string
      - name: batchId
        in: query
        description: The jobs in this batch, nested sub-batches included, instead of the default list.
          A batch with more than 40,000 jobs is 503 `jobs_dependency_unavailable`. A batch you can't read
          answers an empty page.
        schema:
          type: string
      - name: pipelineRunId
        in: query
        description: The jobs this pipeline run's steps launched (a `run_` id), instead of the default
          list. They're listed only here, never in the default list. A run with more than 40,000 jobs is
          503 `jobs_dependency_unavailable`. A run you can't read answers an empty page.
        schema:
          type: string
      - name: search
        in: query
        description: Case-insensitive text anywhere in an item's `name` or `displayName`, matched as
          typed, spaces included. Empty or over 200 characters is 422; only spaces is 400. A page reads at
          most 1,000 rows, so pages can be short; follow `nextCursor`.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: source
        in: query
        description: Only what was submitted through this channel. Includes pipeline runs that recorded
          their channel; runs from before recording started match no `source`.
        schema:
          $ref: '#/components/schemas/SubmissionChannel'
      - $ref: '#/components/parameters/Order'
      - name: projectId
        in: query
        description: Not built yet, so any value is 400.
        schema:
          type: string
      - name: apiKeyId
        in: query
        description: Only jobs submitted with this key. Not built yet, so any value is 400.
        schema:
          type: string
      - $ref: '#/components/parameters/OwnershipScope'
      - name: createdBy
        in: query
        description: Another member's email, with `scope=org` (400 without it). A member whose jobs you can't see
          is 403 `forbidden`.
        schema:
          type: string
          format: email
      - name: includeSubjobs
        in: query
        description: Today's `includeSubjobs`. Your list, or a member's with `createdBy`, holds every batch's own
          jobs as well. The organization's list is unchanged by it, and pipeline runs aren't listed.
        schema:
          type: boolean
          default: false
      - name: batchName
        in: query
        description: Today's `batch=`. The jobs of every batch with this exact name, yours or in the scope you ask
          for. At most 2,048 bytes. A name with nothing you can see answers an empty page.
        schema:
          type: string
          maxLength: 2048
      - name: allMatches
        in: query
        description: With `name` and `scope=org` (no `createdBy` or `includeSubjobs`), every member's match, newest
          first, not only the newest. 400 anywhere else.
        schema:
          type: boolean
