            type: string
          - type: 'null'
          description: Optional SHA-256 assertion, formatted as `sha256:<hex>`. The server always computes the digest.
            If supplied, a mismatch rejects the build. Without it, the server builds the uploaded bytes it reads.
          title: Expectedsourcedigest
