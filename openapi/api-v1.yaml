        tags:
          items:
            type: string
          title: Tags
          type: array
        type:
          title: Type
          type: string
      required:
      - type
      - tags
      type: object
    MoleculeClass:
      enum:
      - protein
      - small_molecule
      - nucleic_acid
      type: string
    MoleculeFastaMode:
      description: The public spelling of the ingestion worker's FASTA split modes.
      enum:
      - one-entity-per-file
      - one-entity-per-header
      type: string
    MoleculeFieldType:
      description: |-
        The spec's `FieldType`.

        NOTE `chain` is a MEMBER of this enum, not a separate axis: a schema's `fields`
        list interleaves scalar fields and chain fields, and `type == "chain"` is what
        distinguishes them.
      enum:
      - string
      - integer
      - float
      - boolean
      - category
      - chain
      type: string
    MoleculeFileEntry:
      description: |-
        One structure file on a molecule. Appears in the `files` map, whose KEY is
        the producer (a job/tool name, or `user` for uploads).
      properties:
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
        downloadUrl:
          title: Downloadurl
          type: string
        fileName:
