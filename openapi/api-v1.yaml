        complete:
          type: boolean
          description: Whether the job or batch has finished (`Complete`, `Stopped` or `Failed`, by the status
            `getJob` shows), so nothing more will be written. False while it may still write to its log. A
            batch is finished once every job in it is.
    JobName:
      type: string
      pattern: ^[A-Za-z0-9_.-]{1,220}$
      description: Unique per owner, and never changes. Invalid characters are refused, not silently removed.
    JobPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        nextCursor:
          type:
          - string
          - 'null'
    JobStatus:
      type: string
      enum:
      - In Queue
      - Running
      - Complete
      - Stopped
      - Failed
      description: Shared by jobs, batches and pipeline runs. `Complete`, `Stopped` and `Failed` are final.
        `Failed` means it ended in an error (`stopReason.kind` `error`). `Stopped` means it was canceled, hit a
        limit, or stopped with no recorded reason (`kind` `canceled`, `limit` or `unknown`). Both always carry
        `stopReason`. A new value here would need a new `Tamarind-Version` date.
    JobSummary:
      type: object
      description: A `/jobs` item of `kind` `job`.
      required:
      - kind
      - id
      - name
      - displayName
      - tool
      - toolVersion
      - status
      - statusDetail
      - stopReason
      - scores
      - batchId
      - pipelineRunId
      - projectId
      - createdBy
      - apiKeyId
      - source
      - lowPriority
      - createdAt
      - startedAt
      - completedAt
      - runtimeSeconds
      - weightedHours
      - pollAfterSeconds
      - links
      properties:
        kind:
          type: string
          const: job
        id:
          type: string
          description: The stable address of this job.
        name:
          type: string
          description: Unique per owner, chosen at submit or generated, and never changes.
        displayName:
          type:
          - string
          - 'null'
          description: Editable label.
        tool:
          type: string
        toolVersion:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/JobStatus'
        statusDetail:
          type:
          - string
          - 'null'
          description: What the job is doing now, in words, e.g. `Waiting for MSA`. For display only. Null for now.
        stopReason:
          description: Set when `status` is `Stopped` or `Failed`. Says why. A single-tool run's job shows its
            run's status and reason.
          oneOf:
          - $ref: '#/components/schemas/JobStopReason'
          - type: 'null'
        scores:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'The tool''s headline metrics, when finished. A single number the tool recorded reads as
            `{"score": <number>}`.'
        batchId:
          type:
          - string
          - 'null'
          description: The `batch_` id of the batch this job is in; null when it isn't in one.
        pipelineRunId:
          type:
          - string
          - 'null'
          description: The `run_` id of the pipeline run whose step launched this job. Null otherwise, and for a
            single-tool run's job, which stands for its run.
        projectId:
          type:
          - string
          - 'null'
        createdBy:
          type: string
          format: email
        apiKeyId:
          type:
          - string
          - 'null'
          description: The key that submitted this job. Null for now.
        source:
          $ref: '#/components/schemas/SubmissionChannel'
          description: The channel the job was submitted through; `web` when none was recorded.
        lowPriority:
          type: boolean
          description: Whether the job runs at the low-priority tier (`lowPriority` at submit), as the job records
            it. False for every other job.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        runtimeSeconds:
          type:
          - number
          - 'null'
        weightedHours:
          type:
          - number
          - 'null'
        pollAfterSeconds:
          type:
          - integer
          - 'null'
          description: How long to wait before checking again, 30 while `In Queue` and 15 while `Running`. Null once
            the job is finished.
        links:
          type: object
          required:
          - self
          - files
          - logs
          properties:
            self:
              type: string
              format: uri-reference
            files:
              type: string
              format: uri-reference
            logs:
              type: string
              format: uri-reference
    Me:
      type: object
      required:
      - user
      - organization
      - credential
      - tier
