              - apiKey
              - oauth
              - session
              - agentTrial
              description: '`agentTrial` for an unclaimed agent trial''s key, else `apiKey`. v1 takes API keys only,
                so `oauth` and `session` don''t occur yet.'
            keyId:
              type:
              - string
              - 'null'
              description: The key's `id`, as `listApiKeys` shows it. Null when it can't be read.
            name:
              type:
              - string
              - 'null'
              description: The key's stored name. Null when it has none, such as the original key.
            expiresAt:
              type:
              - string
              - 'null'
              format: date-time
              description: When a short-lived key a Tamarind service made, or an agent trial, expires. Null for every
                other key.
        tier:
          type: string
          enum:
          - free
          - premium
        limits:
          type: object
          required:
          - monthlyJobs
          - maxBatchJobs
          - maxQueuedJobs
          - maxRequestBytes
          - requestsPerMinute
          - perJobWeightedHours
          properties:
            monthlyJobs:
              type:
              - object
              - 'null'
              description: Null unless your tier is Free, the only tier with a monthly job cap.
              required:
              - used
              - limit
              - remaining
              properties:
                used:
                  type: integer
                limit:
                  type: integer
                remaining:
                  type: integer
            maxBatchJobs:
              type: integer
              description: The most jobs one batch may hold (30,000).
            maxQueuedJobs:
              type: integer
              description: The most jobs you may have queued at once (100,000).
            maxRequestBytes:
              type: integer
              description: The largest request body the gateway accepts, 10 MiB (10,485,760 bytes).
            requestsPerMinute:
              type:
              - integer
              - 'null'
              description: This key's general allowance, in requests a minute (1,200). Polling has its own,
                3,600 a minute (see "Rate limits" above). Null on a deployment that doesn't enforce per-key limits.
            perJobWeightedHours:
              type:
              - number
              - 'null'
              description: The most a job's `weightedHoursBudget` may be, when your Premium organization pins a hard
                limit. Null when no such cap applies.
        budgets:
          type: array
          description: Every budget the submit checks hold you to that this credential may see. Your own member
            budget whenever one applies; the organization's, teams' and models' only for a service account, or when
            your organization lets members see budgets. Only budgets with a limit are listed, so `limit` and
            `remaining` are numbers. The lowest `remaining` binds.
          items:
            $ref: '#/components/schemas/Budget'
        asOf:
          type: string
          format: date-time
          description: When this answer was made. Organization and team totals can trail it by up to about 30
            minutes.
