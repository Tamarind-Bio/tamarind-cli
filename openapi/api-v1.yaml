          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /assays/{assayId}/cancel:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    - name: assayId
      in: path
      required: true
      description: An order's `id`. One that isn't one of your orders is 404.
      schema:
        type: string
        maxLength: 200
    post:
      operationId: cancelAssay
      x-build: 'merged (website#7679, #7721)'
      tags:
      - Assays
      summary: Cancel an assay order. This cannot be undone
      description: |
        Confirm with the user first. The order's `cancellable` field says whether this will work now.
        Safe to repeat: an order already `cancelled` or `cancelling` answers 200 as it is. When the lab
        holds the order it is told: Ginkgo confirms later, so the order reads `cancelling`; A-Alpha
        confirms at once. An order no lab holds yet is only recorded as `cancelled`. Ginkgo orders can
        be cancelled only before work starts, A-Alpha orders until they finish, and Adaptyv and
        GenScript orders only through Tamarind support.

        - 409 `not_cancellable`: the lab won't cancel the order in its current status, cancels only
          through support, or isn't set up on this deployment.
        - 409 `approval_in_progress`: Tamarind is approving the order right now. Check its status again
          in a minute.
        - 409 `approval_under_review`: someone at Tamarind has to look at the order first. Contact
          support.
        - 409 `order_changed`: the order changed while it was being cancelled, so the cancel wasn't
          recorded. Read the order.
        - 502 `cancel_unconfirmed`: the cancel may or may not have happened. Read the order before
          retrying or telling anyone it is cancelled.
      x-change: reshaped
      x-replaces:
      - POST /cancel-assay
      x-clients:
        sdk: assays.cancel
        cli: assays cancel
        mcp: cancelAssay
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: Recorded on the order, and sent to the lab when it holds the order. Left out or
                    empty, it is `Cancelled via API`.
      responses:
        '200':
          description: The order, now `cancelled` or `cancelling`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssayOrder'
          headers:
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /assays/{assayId}/results:
    parameters:
    - $ref: '#/components/parameters/TamarindVersion'
    - name: assayId
      in: path
      required: true
      description: An order's `id`. One that isn't one of your orders is 404.
      schema:
        type: string
        maxLength: 200
    get:
      operationId: getAssayResults
      x-build: 'merged (website#7639, #7669, #7680)'
      tags:
      - Assays
      summary: Get an order's results and download links
      description: |
        Links to what the lab delivered; `expiresAt` says when they stop working. Results stored with
        Tamarind are listed whatever the order's `status` says now; otherwise nothing is ready until
        the order is `completed`. A completed order with nothing stored yet asks the lab once more:
        GenScript's report or Adaptyv's results are fetched, stored and recorded on the order. Ginkgo
        and A-Alpha deliver on their own, so there is nothing to ask. An Adaptyv order's own
        data-package links are fetched again on each read, waiting at most 5 seconds. These lab calls
        only read: nothing is ordered, changed or charged.

        502 `results_unavailable` means the results can't be loaded. With `retryable: true`, retry
        shortly. With `retryable: false`, the lab's delivery failed and Tamarind recorded it, or the
        stored results can't be linked: contact Tamarind support.
      x-change: reshaped
      x-replaces:
      - GET /assay-results
      x-clients:
        sdk: assays.results
        cli: assays results
        mcp: getAssay
      responses:
        '200':
          description: The results. `available` is false until the lab has delivered something to download.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssayResults'
          headers:
            Tamarind-Version:
              $ref: '#/components/headers/TamarindVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'A Tamarind API key: `Authorization: Bearer <key>`. Keys are UUIDs today, such as
        `3f6c1a2e-8b7d-4e5f-9a0b-1c2d3e4f5a6b`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: The same key, in the header today's clients use.
  headers:
    TamarindVersion:
      description: The API version this response used, the date of the first version unless the request
        pinned another with `Tamarind-Version`, as a date string (`YYYY-MM-DD`).
      schema:
        type: string
        examples:
        - '2026-12-01'
    Location:
      description: The URL of the created resource.
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: '`true` when this response replays an earlier request with the same `Idempotency-Key`.'
      schema:
        type: string
        enum:
        - 'true'
    RequestId:
      description: Unique id for this request. Quote it to support.
      schema:
        type: string
    RateLimitLimit:
      description: The most this key can send at once on the allowance this request drew on (1,000 for polling,
        500 for everything else). See "Rate limits" above.
      schema:
        type: integer
    RateLimitRemaining:
      description: How many requests this key can send right now on that allowance.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until that allowance is full again.
      schema:
        type: integer
    NextCursor:
      description: 'On a `text/csv` response, the `nextCursor` a JSON response would carry: send it as `cursor`
        for the next page. Absent on the last page.'
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  parameters:
    TamarindVersion:
      name: Tamarind-Version
      in: header
      description: Pin the API version, as a date string (`YYYY-MM-DD`), matched exactly. Without it the request gets
        the first version. An unknown date is 400 `unsupported_version`. See "Base URL and versioning" above.
      schema:
        type: string
        examples:
        - '2026-12-01'
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: '`nextCursor` from the previous page. Opaque.'
      schema:
        type: string
        maxLength: 4096
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A unique value for this intent, such as a UUID. See "Idempotency" above.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: \S
    OwnershipScope:
      name: scope
      in: query
      description: '`mine` is what you own. `org` is everything you can see in your organization.'
      schema:
        type: string
        enum:
        - mine
        - org
        default: mine
    StatusFilter:
      name: status
      in: query
      description: Comma-separated and URL-encoded, e.g. `In%20Queue,Running` or `Stopped,Failed`. Send one
        `status` parameter with the values joined by commas; a repeated `status` keeps only the last one.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/JobStatus'
    Order:
      name: order
      in: query
      description: '`desc` (the default) lists newest first; `asc` oldest first. By creation time.'
      schema:
        type: string
        enum:
        - desc
        - asc
        default: desc
    JobId:
      name: jobId
      in: path
      required: true
      description: A `job_`, `batch_` or `run_` id. Each operation says which kinds it takes; any other is 404.
      schema:
        type: string
        examples:
        - job_8f3a1c2e9b7d4f60a1b2c3d4e5f60718
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        examples:
        - key_8f3a1c2e9b7d4f60a1b2c3d4e5f60718
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      description: A molecule group's id, a UUID. Anything else is 404 `not_found`.
      schema:
        type: string
        format: uuid
    ToolView:
      name: view
      in: query
      required: false
      description: '`agent` lists the catalog as the Tamarind MCP and agents see it: every tool you can run by name,
        including the ones the product''s tool list leaves out, less those kept off the API or the assistant; like
        the API catalog, it lists the four Rosetta tools the app shows to everyone and refuses at submit. Unlike the
        MCP, a tool your organization''s
        policy denies you, or a GPL tool for a pharma organization, isn''t listed. Leave it out for the API
        catalog. Any other value is 422 `validation_failed`; on `listTools` without a key it is 400.'
      schema:
        type: string
        enum:
        - agent
    ToolName:
      name: tool
      in: path
      required: true
      description: The tool's exact, case-sensitive `name`, such as `alphafold`.
      schema:
        type: string
    FilePath:
      name: path
      in: query
      required: true
      description: The file's `path`, e.g. `predictions/model_1.pdb`.
      schema:
        type: string
    Delivery:
      name: delivery
      in: query
      description: |
        `url`: 200 with `DownloadLink` as JSON. Fetch the link without your API key.
        `redirect`: 302 to a short-lived signed URL. Send your key as `Authorization: Bearer`. With
        `x-api-key` this is 422 `redirect_needs_bearer`, because clients such as `curl -L` and Python
        `requests` forward that header to the redirect target, which would give your key to the storage host.
        `inline`: 200 with the bytes through this host, up to 4 MiB; larger is 413. For sandboxed
        clients that can reach only this API.
      schema:
        type: string
        enum:
        - url
        - redirect
        - inline
        default: url
  responses:
    BadRequest:
      description: The request is malformed, for example an unknown `Tamarind-Version` (`unsupported_version`), an
        invalid cursor (`invalid_cursor`) or `If-Match`, a query
        value an operation doesn't take or doesn't support yet (`validation_failed`), or a carried route refused its
        contents. On project notes, `write_contended` (with `retryable` true) means another write held the same
        record and nothing was stored; read again and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    Unauthorized:
      description: No key (`authentication_required`), or a key that is unknown, revoked or expired
        (`invalid_api_key`, one answer for all three), or an unclaimed agent trial past its lifetime
        (`agent_trial_expired`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.tamarind.bio/errors/invalid_api_key
            title: Authentication required
            status: 401
            code: invalid_api_key
            detail: This API key is not valid. It may have been revoked or have expired.
            retryable: false
            requestId: req_7Hk2mQ
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    BudgetExceeded:
      description: The work is over a budget or quota. `code` says which kind, `budget_exceeded` or
        `quota_exceeded`, and `detail` names the limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    Forbidden:
      description: The credential is valid but lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    NotFound:
      description: No such resource, or it is not visible to you.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    Conflict:
      description: The request conflicts with the resource's current state. Examples are `job_name_conflict`,
        `tool_lifetime_changed`, `job_already_finished`, `archive_failed`, and `idempotency_in_progress` and
        `job_still_starting`, which also send `Retry-After`. On project notes, a stale `version` is
        `version_conflict` with the `currentVersion`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` no longer matches the current version.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    PayloadTooLarge:
      description: The request body or the file asked for is over the limit (`payload_too_large`). Each
        operation gives its limit. For a large batch, upload the rows as a file and submit it as a `source`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    ValidationFailed:
      description: The request is invalid. `errors` lists every problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.tamarind.bio/errors/validation_failed
            title: The request is invalid
            status: 422
            code: validation_failed
            detail: 2 problems were found. Nothing was submitted.
            retryable: false
            requestId: req_7Hk2mQ
            errors:
            - code: out_of_range
              severity: error
              pointer: /settings/numRecycles
              detail: numRecycles must be between 0 and 20.
              allowedRange:
                minimum: 0
                maximum: 20
            - code: unknown_field
              severity: error
              pointer: /settings/numRecyles
              detail: Unknown setting.
              suggestion: numRecycles
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    RateLimited:
      description: Too many requests. Either this key is over its rate limit (`rate_limited`; a refused request
        takes no token), or the same account sent a second list request while its first was still running. Wait
        for `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Temporarily unavailable. Safe to retry, after `Retry-After` when it is sent. `retryable` false
        means retrying the same request won't help (for example a feature this deployment doesn't have, or a read
        too large for one request).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: The work may or may not have been accepted, because the outcome could not be confirmed in time.
        Check the resource before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    UpstreamUnavailable:
      description: A partner lab or the pipeline engine could not be reached, or could not confirm. Check the resource
        before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    ReplayedFailure:
      description: '`internal_error`. With `Idempotent-Replayed: true`, an earlier request with this `Idempotency-Key`
        failed after its work may have started: look for what it created (for example with `GET /jobs`) before
        sending the request again with a new key. Without that header, an unexpected error.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    Error:
      description: Any other error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    FileContentOrLink:
      description: The bytes (`delivery=inline`) or a link (`delivery=url`).
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            $ref: '#/components/schemas/DownloadLink'
      headers:
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
    FileRedirect:
      description: A redirect to a short-lived signed URL (`delivery=redirect`).
      headers:
        Location:
          description: The signed URL. Do not send your API key to it.
          schema:
            type: string
            format: uri
        Tamarind-Version:
          $ref: '#/components/headers/TamarindVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
  schemas:
    AntibodySequence:
      type: object
      description: 'An antibody, for `modality: antibody`.'
      required:
      - heavy
      properties:
        name:
          type: string
          description: At most 100 characters once trimmed.
        heavy:
          type: string
          pattern: \S
        light:
          type: string
      additionalProperties: false
    ApiKey:
      type: object
      required:
      - id
      - name
      - prefix
      - last4
      - status
      - owner
      - serviceAccountId
      - budget
      - expiresAt
      - lastUsedAt
      - createdAt
      - createdBy
      - rotatedFromId
      properties:
        id:
          type: string
        name:
          type: string
          description: The name the keys page shows. A key saved without one is `Original key` (the original key) or
            `Untitled key`.
        prefix:
          type:
          - string
          - 'null'
          description: Always null for now. A key's secret is a UUID, as the keys page makes them, so it has no display
            prefix. (The key's `id` is `key_` and 32 hex characters.)
        last4:
          type: string
          description: The secret's last four characters.
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        owner:
          type: string
          description: The owning user's or service account's email.
        serviceAccountId:
          type:
          - string
          - 'null'
          description: The owning service account's id. Null for a person's key.
        budget:
          description: Always null for now. Nothing enforces a key budget yet.
          oneOf:
          - $ref: '#/components/schemas/ApiKeyBudget'
          - type: 'null'
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Always null for now. Nothing enforces a key expiry yet.
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Always null for now. Nothing records a key's last use yet.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type:
          - string
          - 'null'
          description: The email of whoever made it, for a key made with `createApiKey`. Null for every other key,
            including the original key and keys made on the website's keys page.
        rotatedFromId:
          type:
          - string
          - 'null'
          description: Always null for now. Keys aren't rotated through this API.
    ApiKeyBudget:
      type: object
      required:
      - weightedHours
      - period
      additionalProperties: false
      description: A hard spending limit on a key. Not supported yet; the shape is kept for when key budgets are enforced.
      properties:
        weightedHours:
          type: number
          exclusiveMinimum: 0
        period:
          type: string
          enum:
          - month
          - total
    ApiKeyPage:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type:
          - string
          - 'null'
    ApiKeyStatus:
      type: string
      enum:
      - active
      - revoked
    ApiKeyWithSecret:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: The full key, a UUID. Returned once, then never again.
            examples:
            - 3f2b8c1e-5d4a-4e9b-8a7c-1d2e3f4a5b6c
    AppendNoteResponse:
      description: The entry comes back with the note, because its `noteCount` has moved.
      properties:
        entry:
          anyOf:
          - $ref: '#/components/schemas/BoardEntry'
          - type: 'null'
        note:
          anyOf:
          - $ref: '#/components/schemas/BoardNote'
          - type: 'null'
      required:
      - note
      - entry
      type: object
    ResultsPreparing:
      type: object
      required:
      - status
      - retryAfterSeconds
      properties:
        status:
          type: string
          const: preparing
        retryAfterSeconds:
          type: integer
          description: How long to wait, in seconds, before repeating the request. The `Retry-After` header says
            the same.
    ResultsReady:
      type: object
      required:
      - status
      - downloadUrl
      - expiresAt
      - sizeBytes
      - fileCount
      - truncated
      properties:
        status:
          type: string
          const: ready
        downloadUrl:
          type: string
          format: uri
          description: A short-lived signed link. Fetch it without your API key.
        expiresAt:
          type: string
          format: date-time
          description: When `downloadUrl` stops working. Never later than the link's own expiry.
        sizeBytes:
          type: integer
          description: The zip's size.
        fileCount:
          type:
          - integer
          - 'null'
          description: How many files the zip holds, from its own directory. A job's or a batch's zip always
            has it. Null when nothing records it, as for a pipeline run's zip.
        truncated:
          type:
          - boolean
          - 'null'
          description: True when the zip hit a size or file-count limit and is missing files. A job's or a
            batch's zip is the stored one and never cut short, so it is false; the exception is a batch's
            `bestStructures` zip past 500 structures or 2 GiB of them. Null when nothing records it, as for a
            pipeline run's zip.
    ResultsRequest:
      type: object
      additionalProperties: false
      description: Send at most one of `paths`, `glob` and `bestStructures`; send none for the whole zip.
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 10000
          description: Paths inside the zip. A job's are the paths `listJobFiles` shows; a batch's zip
            holds each job's files under the job's name, plus its combined files.
          items:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: \S
        glob:
          type: string
          minLength: 1
          maxLength: 1024
          description: Matches the whole path inside the zip, case-sensitive, with `*` also matching `/`. For
            example `*.pdb`.
        bestStructures:
          type: boolean
          description: One best structure per job, as the app's "PDBs only" download gives. A job's or a batch's stored
            structures zip when it has one. Otherwise, for a batch submitted as a batch, a zip of each Complete job's best structure, chosen
            by its tool, named after the job, at most 500 or 2 GiB of structures (`truncated` is true past either),
            which may take a while (202, then poll). That build has an 8-minute deadline (past it, 503
            `jobs_dependency_unavailable`, retryable), and runs one per account at a time (another is 429
            `rate_limited`) and two per server (past that, 503 `service_unavailable`). A job or a design batch
            (`numDesigns`) without one is 422 `not_supported`. With `paths` or `glob` it is 422
            `conditional_not_met` at `/bestStructures`.
    AssayEstimate:
      type: object
      required:
      - assayType
      - provider
      - sequenceCount
      - estimatedCostUsd
      - costPerSequenceUsd
      - turnaround
      - turnaroundDays
      - note
      properties:
        assayType:
          type: string
        provider:
          type: string
          description: The lab that gave the estimate.
        sequenceCount:
          type: integer
          minimum: 1
        estimatedCostUsd:
          type:
          - number
          - 'null'
          description: Null when the lab prices this order on request. `note` says so.
        costPerSequenceUsd:
          type:
          - number
          - 'null'
          description: Null when `estimatedCostUsd` is.
        turnaround:
          type:
          - string
          - 'null'
          description: The assay type's usual turnaround, as text.
        turnaroundDays:
          type:
          - number
          - 'null'
          description: The lab's own figure for this order, when it gave one.
        note:
          type: string
          description: 'What this figure is. It is an estimate, not a quote: Tamarind confirms the final price before
            the order is approved.'
    AssayOrder:
      type: object
      description: An assay order. You get one back when you submit, list or cancel orders.
      properties:
        id:
          type: string
        name:
          type:
          - string
          - 'null'
        assayType:
          type:
          - string
          - 'null'
          description: Which assay the order is for. Null for some older orders placed in the web app.
        provider:
          type:
          - string
          - 'null'
          description: The lab running the order, for example adaptyv, ginkgo, aalpha or genscript. More labs may
            be added, so don't assume these are the only values.
        providerName:
          type:
          - string
          - 'null'
        assays:
          type: array
          items:
            type: object
            properties:
              id:
                type:
                - string
                - 'null'
              name:
                type:
                - string
                - 'null'
            required:
            - id
            - name
        status:
          type: string
          description: '`unknown` when the order is in a state this API has no name for yet.'
          enum:
          - pending_quote
          - pending_approval
          - approved
          - in_progress
          - completed
          - failed
          - cancelling
          - cancelled
          - rejected
          - unknown
        sequenceCount:
          type:
          - integer
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type:
          - string
          - 'null'
        cost:
          type:
          - object
          - 'null'
          description: The price on file for the order, once there is one. Null before that.
          properties:
            amountUsd:
              type: number
            isEstimate:
              type: boolean
              description: True when the figure is an estimate, not the lab's quote.
            invoiceUrl:
              type:
              - string
              - 'null'
              description: The order's invoice, once one is issued.
          required:
          - amountUsd
          - isEstimate
          - invoiceUrl
        cancellable:
          type: boolean
          description: Whether `cancelAssay` would cancel the order now, by its lab's rule for the order's status.
            False when that lab isn't set up on this deployment (or its settings can't be read), since the cancel
            would be refused then.
        resultsAvailable:
          type: boolean
          description: True once the lab has delivered results and `GET /assays/{assayId}/results` has files for
            you. It stays true from then on, even if the order's `status` changes later, so check this field instead
            of waiting for `status` to be `completed`.
      required:
      - id
      - name
      - assayType
      - provider
      - providerName
      - assays
      - status
      - sequenceCount
      - createdAt
      - updatedAt
      - notes
      - cost
      - cancellable
      - resultsAvailable
    AssayOrderCsvRequest:
      type: object
      additionalProperties: false
      required:
      - assayType
      - csvFile
      - columnMapping
      properties:
        assayType:
          type: string
          description: Which assay to run. The options come from GET /assay-types.
          example: adaptyv_affinity
          pattern: \S
        modality:
          type:
          - string
          - 'null'
          enum:
          - antibody
          - protein
          - null
          description: Whether your sequences are antibodies or proteins. You can leave it out when the assay type
            only supports one.
        settings:
          type:
          - object
          - 'null'
          description: Options for this assay, such as the target. The assay type's `settings` list says what is
            needed.
          example:
            targetId: <id from /assay-targets>
            method: BLI
            antigenConcentrations:
            - 1
            - 10
            - 100
        csvFile:
          type: string
          description: A CSV file of sequences, to use instead of `sequences`. Upload it first with `POST /files`,
            then give its path within your files. It is a relative `.csv` path of at most 512 characters, with
            no `..`, and the file can be up to 10 MB. The order checks enforce these.
          example: designs/round2.csv
          pattern: \S
        columnMapping:
          type: object
          description: Which CSV columns hold what. Needed with `csvFile`. For antibodies, map `heavy`, and
            optionally `name` and `light`. For proteins, map `sequence`, and optionally `name`.
          properties:
            name:
              type: string
              pattern: \S
            heavy:
              type: string
              pattern: \S
            light:
              type: string
              pattern: \S
            sequence:
              type: string
              pattern: \S
          anyOf:
          - required:
            - heavy
          - required:
            - sequence
          additionalProperties: false
        name:
          type:
          - string
          - 'null'
          description: A name for the order so you can find it later. At most 200 characters once trimmed; the order
            checks enforce it, so a longer one is a validation problem, not a schema refusal.
        notes:
          type:
          - string
          - 'null'
          description: Anything the Tamarind team should know when reviewing the order. At most 2,000 characters,
            enforced by the order checks.
        confirmDuplicate:
          type:
          - boolean
          - 'null'
          default: false
          description: Set to true to place an order that looks like one you placed recently. Use it after a `duplicate_order`
            response, when you do want a second, separately billed order. Only `submitAssay` reads it.
    AssayOrderInlineRequest:
      type: object
      additionalProperties: false
      required:
      - assayType
      - sequences
      properties:
        assayType:
          type: string
          description: Which assay to run. The options come from GET /assay-types.
          example: adaptyv_affinity
          pattern: \S
        modality:
          type:
          - string
          - 'null'
          enum:
          - antibody
          - protein
          - null
          description: Whether your sequences are antibodies or proteins. You can leave it out when the assay type
            only supports one.
        settings:
          type:
          - object
          - 'null'
          description: Options for this assay, such as the target. The assay type's `settings` list says what is
            needed.
          example:
            targetId: <id from /assay-targets>
            method: BLI
            antigenConcentrations:
            - 1
            - 10
            - 100
        sequences:
          type: array
          description: The sequences to test. At most 5,000, enforced by the order checks. For antibodies, send "HEAVY:LIGHT" strings (or just "HEAVY"), or objects
            with `name`, `heavy` and `light`. For proteins, send the sequence as a string (join chains with ":"),
            or objects with `name` and `sequence`. A sequence you don't name is called seq_1, seq_2 and so on. Every
            name and every sequence has to be different.
          items:
            oneOf:
            - type: string
              pattern: \S
            - $ref: '#/components/schemas/AntibodySequence'
            - $ref: '#/components/schemas/ProteinSequence'
          minItems: 1
        name:
          type:
          - string
          - 'null'
          description: A name for the order so you can find it later. At most 200 characters once trimmed; the order
            checks enforce it, so a longer one is a validation problem, not a schema refusal.
        notes:
          type:
          - string
          - 'null'
          description: Anything the Tamarind team should know when reviewing the order. At most 2,000 characters,
            enforced by the order checks.
        confirmDuplicate:
          type:
          - boolean
          - 'null'
          default: false
          description: Set to true to place an order that looks like one you placed recently. Use it after a `duplicate_order`
            response, when you do want a second, separately billed order. Only `submitAssay` reads it.
    AssayOrderCheckRequest:
      type: object
      additionalProperties: false
      required:
      - assayType
      description: 'The body `validateAssay` takes: the fields of `AssayOrderRequest`, typed, without the rules
        between them (exactly one of `sequences` or `csvFile`, a `columnMapping` with `csvFile`, the shape of
        each sequence), which are part of its verdict.'
      properties:
        assayType:
          type: string
        modality:
          type:
          - string
          - 'null'
        settings:
          type:
          - object
          - 'null'
        sequences:
          type:
          - array
          - 'null'
          items: {}
        csvFile:
          type:
          - string
          - 'null'
        columnMapping:
          type:
          - object
          - 'null'
        name:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        confirmDuplicate:
          type:
          - boolean
          - 'null'
    AssayOrderRequest:
      description: 'An assay order. `POST /assays` and `POST /assays/estimate` take this body, and
        `POST /assays/validate` takes the same fields (`AssayOrderCheckRequest`) and reports these rules in its verdict. Send exactly one of `sequences` or `csvFile`. An optional field sent as null counts as left
        out. A body with no `assayType`, a field of the wrong JSON type, an unknown field or text that isn''t
        valid Unicode is refused as it arrives (422). Every other rule here, and each assay type''s own, is
        checked by the order checks: `validateAssay` reports their problems in its verdict, and `estimateAssay`
        answers 422 `validation_failed` with the same problems.'
      oneOf:
      - $ref: '#/components/schemas/AssayOrderInlineRequest'
      - $ref: '#/components/schemas/AssayOrderCsvRequest'
    AssayResults:
      type: object
      required:
      - assayId
      - status
      - available
      - complete
      - files
      - missingFiles
      - expiresAt
      properties:
        assayId:
          type: string
        available:
          type: boolean
          description: Whether there is anything to download now. It stays false on an order that ended without
            results, so poll only while `status` is not `failed`, `cancelled` or `rejected`.
        complete:
          type: boolean
          description: 'Whether this is the full result set. It can be false while `available` is true: a file
            could not be linked yet (`missingFiles`), the lab''s own links (Adaptyv''s data package) could not
            be fetched in time, files fetched from the lab are not yet recorded on the order (the next read
            records them), the lab''s delivery failed, or a GenScript report was collected before the order
            completed and may still grow.'
        files:
          type: array
          items:
            type: object
            required:
            - name
            - url
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
                description: Signed. Do not send your API key to it.
        missingFiles:
          type: array
          items:
            type: string
          description: Names of files the lab sent that cannot be linked yet.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The latest that `files` links stop working. A lab's own link can stop sooner. Null when there
            are no files.
        status:
          type: string
          enum:
          - pending_quote
          - pending_approval
          - approved
          - in_progress
          - completed
          - failed
          - cancelling
          - cancelled
          - rejected
          - unknown
    AssaySetting:
      type: object
      description: One setting an assay type takes.
      required:
      - name
      - type
      - required
      - description
      properties:
        name:
          type: string
        type:
          type: string
          description: The kind of value, such as `string` or `number`. `dropdown` means one of `options`.
        required:
          type: boolean
        description:
          type: string
        options:
          type: array
          description: The values allowed. Present when `type` is `dropdown`.
          items: {}
        default:
          description: The value used when this is omitted. Present only when there is one.
        list:
          type: boolean
          description: Present and true when the setting takes an array of `type`.
        requiredWhen:
          type: object
          description: 'When this setting becomes required: another setting''s name, and the values of it that require
            this one. Present only when that applies.'
          additionalProperties:
            type: array
            items: {}
    AssayTarget:
      type: object
      description: A target to name in an order's `settings`. Labs publish different details, so only `id` and `name`
        are always present.
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        uniprotId:
          type: string
        organism:
          type: string
        aliases:
          type: array
          items:
            type: string
        catalogNo:
          type: string
          description: GenScript only.
        size:
          type: string
          description: GenScript only.
    AssayType:
      type: object
      description: One wet-lab assay you can order.
      required:
      - assayType
      - name
      - provider
      - providerName
      - category
      - method
      - description
      - details
      - modalities
      - multiChainProtein
      - minSequences
      - maxSequences
      - turnaround
      - includesAssays
      - targetsProvider
      - settings
      - docUrl
      properties:
        assayType:
          type: string
          description: The value to send as `assayType`.
        name:
          type: string
        provider:
          type: string
          description: The lab running it. More labs may be added, so handle one you do not know.
        providerName:
          type: string
        category:
          type: string
        method:
          type:
          - string
          - 'null'
        description:
          type: string
        details:
          type:
          - string
          - 'null'
        modalities:
          type: array
          description: The `modality` values this assay accepts.
          items:
            type: string
            enum:
            - antibody
            - protein
        multiChainProtein:
          type: boolean
          description: False when a protein sequence must be a single chain.
        minSequences:
          type: integer
        maxSequences:
          type: integer
        turnaround:
          type:
          - string
          - 'null'
        includesAssays:
          type: array
          description: The assays an order of this type runs.
          items:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
              name:
                type: string
        targetsProvider:
          type:
          - string
          - 'null'
          description: Send this as `provider` to `listAssayTargets` to find target ids. Null when the assay takes
            no target.
        settings:
          type: array
          description: What `settings` takes on an order of this type.
          items:
            $ref: '#/components/schemas/AssaySetting'
        docUrl:
          type:
          - string
          - 'null'
          format: uri
    AssayTypePage:
      type: object
      required:
      - items
      - nextCursor
      - wetLabAccess
      - requestAccessUrl
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssayType'
        nextCursor:
          type:
          - string
          - 'null'
        wetLabAccess:
          type: boolean
        requestAccessUrl:
          type: string
          format: uri
    Batch:
      type: object
      description: A `/jobs` item of `kind` `batch`. `Complete` once every job has finished, whatever the mix,
        and `Failed` only when the batch itself broke. Until it finishes it is `In Queue` while it has no jobs
        yet and `Running` once it has any.
      required:
      - kind
      - id
      - name
      - displayName
      - tool
      - toolVersion
      - status
      - stopReason
      - jobsCreated
      - counts
      - projectId
      - createdBy
      - apiKeyId
      - source
      - createdAt
      - startedAt
      - completedAt
      - weightedHours
      - rerunOf
      - pollAfterSeconds
      - links
      properties:
        kind:
          type: string
          const: batch
        id:
          type: string
        name:
          type: string
          description: Unique per owner, and never changes.
        displayName:
          type:
          - string
          - 'null'
        tool:
          type: string
        toolVersion:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/JobStatus'
        stopReason:
          description: Set when `status` is `Stopped` or `Failed`. How each job ended is in `counts`; the batch's
            own `stopReason` is about the batch. It is `Failed` only when the batch itself broke, with `platform_error`
            when its jobs couldn't be created or their results couldn't be combined, and `invalid_input` when a
            `kind` `batch` submit couldn't go ahead as sent (rows that can't run, or a project no longer
            available). A `kind` `batch` submit that a budget, the monthly quota or the queue limit refused before
            any job was created is `Stopped` with `kind` `limit`. On those two, `errors` holds the problems, a
            row's pointing into the request the batch was submitted with; at most 100, and when there were more,
            the last one has code `truncated` and says how many aren't listed. `errors` is absent otherwise.
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/JobStopReason'
            - type: object
              properties:
                errors:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Diagnostic'
          - type: 'null'
        jobsCreated:
          type: boolean
          description: False while the batch's jobs are still being created from a `kind` `batch` submit. Any other
            batch reads false until it has a job. True once the batch has finished.
        counts:
          description: How many of the batch's jobs are in each status, by the same statuses a job item shows, nested
            sub-batches included. When a tool split one job into several, the first part is both the batch and one
            of its jobs, and is counted here.
          $ref: '#/components/schemas/ItemCounts'
        projectId:
          type:
          - string
          - 'null'
        createdBy:
          type: string
          format: email
        apiKeyId:
          type:
          - string
          - 'null'
          description: Null for now.
        source:
          $ref: '#/components/schemas/SubmissionChannel'
          description: The channel the batch was submitted through; `web` when none was recorded.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        weightedHours:
          type:
          - number
          - 'null'
        rerunOf:
          type:
          - string
          - 'null'
          description: The `job_` id of the job whose rerun the tool split into this batch, on batches an earlier
            v1 rerun created. `rerunJob` now reruns in place and never sets it, so it's null otherwise.
        pollAfterSeconds:
          type:
          - integer
          - 'null'
          description: How long to wait before checking again, 30 while `In Queue` and 15 while `Running`. Null
            once the batch is finished.
        links:
          type: object
          required:
          - self
          - jobs
          - files
          properties:
            self:
              type: string
              format: uri-reference
              description: '`/jobs/batch_...`'
            jobs:
              type: string
              format: uri-reference
              description: '`/jobs?batchId=batch_...`, the batch''s jobs.'
            files:
              type: string
              format: uri-reference
              description: '`/jobs/batch_.../files`, the batch''s own folder.'
    BatchSource:
      type: object
      required:
      - file
      additionalProperties: false
      description: Read the batch's rows from one of your files, at submit. Replaces the MCP-only `fromFile` handling.
        A problem with the file itself is 422 at the member at fault, such as `/source/file` or
        `/source/sequenceColumn`; the rows' settings are checked after the 202, like an inline batch's.
      properties:
        file:
          type: string
          description: A workspace `path`, a path in one of your job folders, or a `tamarind://jobs/job_<id>/<path>`
            reference to a job's file. At most 64 MiB of UTF-8 text and 30,000 rows (after `topN`); a file that is
            missing, too large, empty or malformed is 422 at `/source/file`. A file batch's row pointers
            (`/settings/<n>`) count the file's rows from 0.
          pattern: \S
        format:
          type: string
          description: '`auto` picks by the file''s extension (`.fasta`, `.fa`, `.faa`, `.fna`, `.csv`, `.jsonl`,
            `.ndjson`), and any other is 422 `required` at `/source/format`. FASTA is one row per record. CSV is one
            row per line under a header row; a line with more cells than the header is 422 `invalid_format` at
            `/source/file`. JSONL is one JSON object of settings per line.'
          enum:
          - auto
          - fasta
          - csv
          - jsonl
          default: auto
        sequenceField:
          type: string
          minLength: 1
          pattern: \S
          description: The setting each row's sequence goes into, for FASTA, and for CSV with `sequenceColumn`.
            Defaults to `sequence`.
        sequenceColumn:
          type: string
          minLength: 1
          pattern: \S
          description: 'CSV only: the column holding the sequence. Each row then carries only that value. Without
            it, every column but `nameColumn` is a setting of the same name. CSV values are text; send typed values
            as JSONL.'
        nameColumn:
          type: string
          minLength: 1
          pattern: \S
          description: 'CSV only: the column holding each job''s name. A value that isn''t a job name, or a name
            repeated or equal to the batch''s `name`, is 422 at `/source/nameColumn`, naming the row.'
        rankBy:
          type: string
          minLength: 1
          pattern: \S
          description: 'CSV only: a numeric column to order the rows by before `topN`. Rows with no number in it go
            last, in file order.'
        rankOrder:
          type: string
          description: With `rankBy` only. Without it, `rankBy` ranks highest first.
          enum:
          - asc
          - desc
        topN:
          type: integer
          minimum: 1
          description: Keep only the first N rows, after ranking.
    BatchValidationReport:
      type: object
      description: '`validateJob`''s verdict on an inline batch.'
      required:
      - valid
      - count
      - validCount
      - errors
      - results
      - resultsTruncated
      properties:
        valid:
          type: boolean
        count:
          type: integer
          description: The rows sent.
        validCount:
          type: integer
          description: The rows with no error. 0 when the batch as a whole has a problem.
        errors:
          type: array
          description: Problems with the batch as a whole, such as an unknown tool, a taken `name`, the
            `weightedHoursBudget` option, or the rows' total over a budget, the monthly limit or the queue limit.
          items:
            $ref: '#/components/schemas/Diagnostic'
        results:
          type: array
          description: The rows with an error or a warning, in row order, at most 1,000. Their pointers lead into the
            row, such as `/settings/17/numRecycles` or `/names/17`.
          items:
            type: object
            required:
            - index
            - valid
            - errors
            - warnings
            properties:
              index:
                type: integer
              valid:
                type: boolean
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Diagnostic'
              warnings:
                type: array
                items:
                  $ref: '#/components/schemas/Diagnostic'
        resultsTruncated:
          type: boolean
          description: True when more rows had an error or a warning than `results` lists.
